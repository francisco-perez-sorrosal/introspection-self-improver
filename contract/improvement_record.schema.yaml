# The per-transition improvement record: the evidence → signal → hypothesis → mutation →
# result chain (protocol §24), one YAML file per transition at
#   results/experiment_<id>/improvement_records/gen_<g>_to_<g+1>.yaml
# written while the transition happens, never reconstructed afterwards.
#
# This file is the schema's single source: tau_adapter/records.py loads it to validate
# records — edit the field list here, not there. Rules a field list cannot state live in
# that module and are summarized here:
#
#   * outcome `accepted` names a candidate_commit distinct from source_commit (the merge
#     commit IS the next generation, tagged exp<seq>-g<NNN>).
#   * outcome `rejected` or `identity` pins H_(g+1) = H_g (decision D5): candidate_commit
#     is null or equals source_commit, the held-out evaluation is skipped, and the result
#     is carried forward at reveal.
#   * held_out_result stays null until `make reveal` fills it — during optimization the
#     record exists precisely so the conclusion can be audited without the measurement.
#   * every record cites at least one Introspection conversation id: a claim without the
#     executions behind it is a fabricated signal (CLAUDE.md invariants).
#   * schema version 2 (plan D22, from seq 6): a generation's mutation is an IMPROVEMENT
#     SET — any number of individually-coherent changes, itemized in `changes`. A record
#     carrying `schema_version: 2` with outcome accepted/rejected must itemize at least
#     one change; each item carries its own mechanism, surface and falsifiable
#     expected_effect, because per-change attribution is mechanistic (predictions scored
#     against the next batch), never statistical. Records without `schema_version`
#     (seq ≤ 5) predate the set discipline and validate under the single-mutation rules.
#   * schema version 3 (plan D26, post-seq-6): two additions, both keyed on the version so
#     seq-6 v2 records keep validating untouched. (a) Every `surface: instructions` change
#     in an accepted/rejected v3 record carries a non-empty `clauses` list — the
#     adversarial wording review: each clause of the landed text that a
#     letter-over-intent reading could optimise against gets its own falsifier (seq 6:
#     C2's unwatched "or explained" carried the harm one round past its record). (b) The
#     record's transition must be marked in the experiment's improvement_backlog.md
#     (`<!-- transition: gen_NNN_to_MMM -->`) — the backlog is updated in the same
#     transition as the record, mechanically (seq 6's backlog silently froze at gen-003
#     while its gated records stayed impeccable).

version: 3

outcomes: [accepted, rejected, identity]

# kind: str | int | mapping | list. required_keys applies to mappings.
# prose_required_for: outcomes for which the field must be non-empty prose — an identity
# transition with no viable hypothesis may leave hypothesis/proposed_change terse, but an
# accepted or rejected mutation must say what was claimed and why.
fields:
  transition:
    kind: mapping
    required: true
    required_keys: [from_generation, to_generation]
    description: integers; to_generation = from_generation + 1, matching the filename
  experiment:
    kind: str
    required: true
    description: the experiment id this record belongs to, e.g. 002_bm25-sonnet46
  outcome:
    kind: str
    required: true
    description: one of the outcomes above (D5)
  batch:
    kind: mapping
    required: true
    required_keys: [name, task_ids]
    description: the improvement batch consumed by this transition (batch_NN + its tasks)
  evidence:
    kind: mapping
    required: true
    required_keys: [conversation_ids, summary]
    description: what was inspected — stable Introspection ids plus a prose account
  signals:
    kind: list
    required: true
    description: discovered signals, each with a description and a prevalence stated n/B
  counterevidence:
    kind: str
    required: true
    description: what argued against the hypothesis; "none found" is a legitimate value
  hypothesis:
    kind: str
    required: true
    prose_required_for: [accepted, rejected]
  owning_layer:
    kind: str
    required: true
    description: >-
      the mutable harness layer(s) targeted (prompt, retrieval usage, pi-skill, tool,
      sub-agent, ...); with a `changes` list this is the set-level summary and each item
      names its own surface
  proposed_change:
    kind: str
    required: true
    prose_required_for: [accepted, rejected]
    description: >-
      with a `changes` list this is the SET-level summary — why these changes compose
      (non-conflicting, independently justified); per-change detail lives in the items
  schema_version:
    kind: int
    required: false
    description: >-
      2 = composite improvement sets (plan D22); 3 = per-clause falsifiers + backlog
      write-through (plan D26). Absent on seq ≤ 5 records; the validator keys every
      version-specific requirement on this field so history keeps validating.
  changes:
    kind: list
    required: false
    description: >-
      the improvement set, one item per change. Each item is a mapping with mechanism
      (one coherent mechanism, the CLI improve discipline held per change), surface
      (instructions | extension-hook | extension-tool | sub-agent | pi-skill |
      retrieval-usage | revert | other — extension-hook/tool and sub-agent are live under
      D24; a declared pi-skill is measured inert on this seam, its content ships via an
      extension-hook), and expected_effect (its own falsifiable prediction, scored
      against the next batch); optional evidence (conversation ids / backlog target),
      risk, and commit (the per-change commit, for selective revert). From
      schema_version 3, a surface: instructions change also carries clauses — a list of
      mappings {clause: verbatim fragment of the landed text (git show, never memory),
      adversarial_reading: what a letter-over-intent reading does with it, falsifier:
      the counter that fires if the adversarial reading wins} — one entry per
      disjunction, precondition, or licensed alternative in the landed wording
  mutation:
    kind: mapping
    required: true
    required_keys: [source_commit]
    description: branch, pr_url, source_commit (H_g), candidate_commit (H_(g+1) or null)
  expected_effect:
    kind: str
    required: true
    prose_required_for: [accepted]
  human_approval:
    kind: mapping
    required: true
    required_keys: [approved_by, date]
    description: who approved (or rejected) the mutation, and when
  held_out_result:
    kind: mapping
    required: false
    description: "{passed, total, carried} — written by make reveal, never by hand"
