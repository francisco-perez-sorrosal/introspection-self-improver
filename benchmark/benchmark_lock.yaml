# Frozen surfaces for one experiment.
#
# contract/constraints.md holds the rules and the reasoning; this file holds only the
# values, so that "frozen" is checkable rather than aspirational. Every field here is
# asserted mechanically before a run starts — nothing in this file is documentation.
#
# Changing any value invalidates cross-generation comparison. Start a new experiment
# instead, and say so in the results directory.

# "Say so in the results directory" is mechanical, not aspirational: seq + name derive the
# experiment id (`<seq, zero-padded to 3>_<name>`, here 001_bm25-sonnet46) naming the freeze
# the values below define, and every run writes under results/experiment_<id>/<generation>/
# — the runner refuses any other results/ path. One experiment is one freeze: re-deciding a
# frozen value means bumping `seq` here (a NEW experiment), never a new value under the old
# one; `name` is a configuration nickname and may repeat across experiments — the sequence
# is the identity.
#
# NUMBERING RESET 2026-08-13 (user-directed fresh start): every pre-protocol bring-up
# artifact was cleared from the working tree and lives in git history — including the
# bring-up freeze that previously held the id 001_bm25-sonnet46 (its closure README is at
# that path in history) and the 002 bring-up runs. Seq 1 froze the debug experiment
# (D10 sizes) and was VOIDED the same day at H0: task_034 deterministically crashes τ's
# text-mode user simulator under real agents, a frozen-surface defect — see
# results/experiment_001_bm25-sonnet46/README.md. Seq 2 ran the debug experiment to
# completion and is REVEALED (results/experiment_002_bm25-sonnet46/). Seq 3 held the
# powered experiment's bring-up — the D12/D13/D14 model-pair detours, calibration
# pilots and seam validations archived under results/experiment_003_powered-bm25-*/
# — and stays theirs. Seq 4 IS the powered experiment — the tier between debug and
# full, sized from seq-2 actuals by
# results/experiment_002_bm25-sonnet46/SIZING_ANALYSIS.md (plan D11): G=5/B=8/T=28 on
# a fresh 76-task pool; REVEALED 2026-08-15 — endpoint -2 tasks inside the ±9 pp band,
# trend p=0.802, no improvement demonstrated; the loop's machinery held (208 episodes,
# zero seam incidents, all twenty §29 guardrails). Seq 5 IS the loop-reliability
# experiment (plan D17/D18/D19): batch_mode fixed + num_trials 3 asks the prerequisite
# question seq 4 could not answer — can the loop fix what it stares at? Run at a
# REDUCED G=2 (plan D20, user-authorized 2026-08-15) — two mutation slots plus the
# endpoint round, enough to exercise every loop mechanic at ~40% of the episode cost;
# the design question is loop mechanics, not curve power. The full T=47 run stays
# deferred to seq 6.
#
# PARITY CONVENTION (plan D15, 2026-08-15): EVEN seqs are stable, reportable
# experiments; ODD seqs are experimentation — bring-up, detours, voided freezes
# (1 = voided debug, 3 = powered bring-up). Parity layers on the freeze discipline
# and never replaces it: a re-decide still bumps seq, to the next number of the
# right parity. Reused ids are unambiguous mechanically: each freeze is identified
# by its own results/ snapshot fingerprint.
experiment:
  seq: 5
  name: fixedb-bm25-luna56

benchmark:
  repository: sierra-research/tau2-bench
  # Exact commit, never a range: v1.0.1 changed banking_knowledge grading and task data,
  # and results either side of it are not comparable. This is the released point the
  # re-graded leaderboard entries correspond to.
  commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
  tag: v1.0.1
  domain: banking_knowledge

  # Decides the agent's tool set *and* rewrites the policy text it is graded against, so it
  # is benchmark configuration, not harness. Improve how retrieval is *used* instead.
  #
  # DELIBERATE FREEZE (decided 2026-08-12). `bm25` is pinned knowingly, not as a
  # fallback: it is fully offline and needs no provider key at run or grade time. The accepted
  # cost is comparability — `bm25` changes both the tool set and the policy text, so no number
  # under this freeze is comparable with published τ-Knowledge results, and none is claimed;
  # contract/constraints.md records the caveat. Cross-generation comparison is unaffected (the
  # backend is constant by construction) and retrieval *usage* — query formulation, k,
  # iteration, stopping — stays mutable harness territory.
  # Re-deciding this value means a NEW experiment id, never a new value under this one.
  retrieval_config: bm25

  # `base` is a task *split*, not a task set: tau's --task-set-name defaults to the domain's
  # own set, and --task-split-name defaults to "base". Two values, not one — conflating them
  # was an early mistake, corrected in contract/constraints.md.
  task_set_name: banking_knowledge
  task_split_name: base

# The generation protocol's experiment configuration (SIA_EVALUATION_PLAN.md §3;
# self_improving_agent_evaluation_protocol.md §26). Frozen with everything else in this
# file: the partition manifest is proposed from these sizes and verified against them,
# and the distinct-task budget must fit the eligible pool — (G*B)+T under batch_mode
# fresh, B+T under fixed (seq 5: 36 of 97; the pool is exhausted of virgin tasks, so
# reuse is a recorded freeze decision, not an accident — see the manifest header). Powered scale per D11 (2026-08-14,
# sized from seq-2 actuals by results/experiment_002_bm25-sonnet46/SIZING_ANALYSIS.md:
# powered for a ~+4-5 pp/generation loop — ~97% direction, ~82% trend-significance at
# α=.05 — where the debug T=8 could resolve nothing smaller than ~45 pp. T=28 gives a
# ~10-task failure mode 97%/85% odds of ≥1/≥2 held-out witnesses vs 60%/19% at T=8 and
# tightens the noise band ±17 → ±9 pp; B=8 turns batch prevalence quotes from quarters
# into eighths — the cheapest lever on mutation quality; G=5 is the strongest power
# lever, compounding mutations AND adding curve points to the pre-registered trend
# test). The full G=5/B=10/T=47 experiment is deferred to seq 6: at measured per-episode
# costs it adds ~10 pp of trend power for ~$80.
#
# G REDUCED 5 -> 2 for seq 5 (plan D20, user-authorized 2026-08-15, lock still
# PROVISIONAL with zero episodes). B and T are UNCHANGED, so D11's per-round sizing
# rationale above stands verbatim; only the number of mutation slots moves. The cost
# accepted knowingly and stated wherever the curve renders: G is the strongest power
# lever (D11), so the held-out trend test runs over 3 points instead of 6 and is
# underpowered by construction — but seq 5's pre-registered PRIMARY is the paired batch
# endpoint test (H2 vs H0, 8 tasks, 2^8 exact enumeration), whose power depends on B and
# num_trials, not on G. Two slots still exercise every loop mechanic end to end
# (diagnose -> mutate -> PR -> tag -> re-measure the same batch), which is what a
# loop-reliability experiment is for.
protocol:
  generations: 2
  improvement_tasks_per_generation: 8
  held_out_tasks: 28

  # THE SEQ-5 DESIGN CHANGE (plan D17): one fixed batch task set measured under every
  # generation, H2 included (batch_03 is H2's measurement-only endpoint round, consumed
  # by no transition). Seq 4's null left two explanations standing — "the mutations did
  # nothing" vs "the measurement could not see it" — and fixed mode attacks the
  # prerequisite question directly: can the improvement loop fix what it stares at?
  # The batch curve becomes a PAIRED saturation curve (same tasks per generation);
  # its pre-registered primary is scripts/batch_curve.py's exact paired sign-flip
  # endpoint test, H2 vs H0, alpha 0.05. The held-out lane is unchanged and stays the
  # transfer probe. The reading key, pre-registered with the freeze:
  #   B rises + T rises  -> the loop works and generalizes
  #   B rises + T flat   -> the loop optimizes but overfits (mutations task-shaped)
  #   B flat             -> the meta-agent is the problem
  batch_mode: fixed

  # True BECAUSE batch_mode is fixed: re-measuring the same batch every generation IS
  # within-batch verification, embraced as the object of study (the lock refuses the
  # contradictory combination). Under fresh mode this stays false (protocol §15).
  allow_within_batch_verification: true

  # The held-out firewall, stated as configuration: nothing about the held-out set —
  # tasks, trajectories, per-task rewards, aggregates — reaches the orchestrator before
  # reveal. Held-out trials per task are frozen.num_trials below — one knob, never two;
  # a held_out_trials_per_task key here is refused by the lock parser.
  holdout_visibility:
    expose_tasks_to_orchestrator: false
    expose_traces_to_orchestrator: false
    expose_per_task_results_to_orchestrator: false
    expose_aggregate_score_to_orchestrator: false

  # Every mutation lands as a PR a human reviews and merges; the agent never merges its
  # own work. The merge commit is the next generation.
  require_human_approval: true

frozen:
  # PROVISIONAL while seq 5 (the loop-reliability experiment) is prepared: values cut
  # 2026-08-15 (plan D17 fixed batch mode, D18 num_trials 3, D19 partition reuse, D20
  # generations 5 -> 2 — the last re-cut in place under this same sanction), the
  # partition frozen with hand-chosen lists, no freeze snapshot written or enforced
  # until the start gate flips this to FROZEN — after `make reset_h0` (H0 back to the
  # D16-corrected `h0-baseline`; seq-4 mutations are evidence, not inheritance) and the
  # A.0a gate. Everything below this status line is carried from the seq-4 freeze
  # UNCHANGED except num_trials (1 -> 3, D18): same model pair (D12/D14 luna both
  # halves), same bm25, same budgets, same seed — one variable class changed at a time.
  # Re-cutting seq 5 in place is sanctioned only while PROVISIONAL with zero episodes;
  # the moment a snapshot exists, any change means a seq bump (next ODD number for
  # experimentation per D15 — seq 5 is deliberately odd: it studies the loop, not the
  # capability claim).
  status: FROZEN

  # The model that actually serves the agent. Authoritative copy lives in
  # target-agent/agents/agent.yaml; the runner refuses to start if the two disagree, which
  # is what stops a later generation "improving" by quietly upgrading its own model.
  #
  # gpt-5.6-luna at medium thinking — D12's intended pair, RESTORED by D14 per D13's
  # return clause once the platform fixed its sandbox serializer (it emitted OpenAI's
  # retired `reasoning.level` for any thinking level; the fix rides the sandbox stack
  # baked into runtime images, so verification requires a POST-fix image — the span of
  # the first episode on one must show `reasoning.effort`). The
  # inference-cost rationale and the sensitivity trade are D12's, unchanged: if luna
  # performs the harness behaviours natively, mutations move the score less; the B1
  # read (D8) guards both failure modes (0/B = strengthen H0, B/B = the model choice
  # re-opens). Calibration of record is the CORRECTED-H0 luna pilot (D16, 2026-08-15:
  # baseline 6/28 = 21.4%, $0.022/local episode —
  # results/experiment_004_powered-bm25-luna56/CALIBRATION_PILOT.md). The earlier 003
  # pilot measured a seq-2-contaminated harness (its arm carried the g1-g3 SYSTEM.md
  # mutations; the h0-baseline tag has since been corrected and reset_h0 verifies
  # byte-identity); the D13 haiku
  # detour is archived at results/experiment_003_powered-bm25-haiku45/.
  agent_model: openai/gpt-5.6-luna
  # null = the ai:-spelled recipe omits thinking_level (user decision at the merge of
  # probe/ai-no-thinking, 2026-08-15). The assertion pins the ABSENCE; whether the
  # platform sandbox injects a default reasoning parameter for this shape is exactly
  # what the next platform episode's span must show.
  agent_thinking_level: null

  # tau requires --agent-llm, but our agent takes its model from the recipe, so this value
  # is declared and unused. Kept equal to agent_model so the file cannot read misleadingly.
  agent_llm_declared: openai/gpt-5.6-luna

  # The user simulator moves scores as much as the agent model does, with no harness change
  # at all. It is a comparison variable in its own right.
  #
  # gpt-5.6-luna here too (D12/D14): one model pair, one provider, minimum surface.
  # The reproducibility knob is surrendered knowingly: luna rejects `temperature: 0.0`
  # exactly as Sonnet 5 did (HTTP 400, verified 2026-08-14), so the simulator samples
  # at the provider default and this half of the environment is stochastic per
  # episode — absorbed by D2's task-pooling. (The D13 haiku detour briefly restored
  # the knob; it leaves with haiku.) The seq-2 user-sim screening evidence is
  # model-conditioned and is re-run at the start gate.
  user_llm: openai/gpt-5.6-luna

  # `timeout` is a per-attempt request ceiling, not a preference. tau sets litellm's
  # `num_retries` but never a `timeout`, so a stalled provider response blocks with no bound:
  # one user-simulator call in the first banking run hung for 601s while the agent side of the
  # same episode used 48s in total. Unbounded here makes wall-clock per generation
  # unpredictable, which is exactly what the cost-and-time budget cannot absorb.
  #
  # 60s is roughly five times the slowest healthy call observed (~12s), so a legitimate call is
  # never cut while a stall now costs 60s and a retry instead of ten minutes.
  #
  # This mapping REPLACES tau's DEFAULT_LLM_ARGS_USER rather than merging with it — every
  # key the simulator should run with must be listed here. `temperature` is deliberately
  # ABSENT: gpt-5.6-luna rejects any non-default value (see the note on user_llm above).
  # `reasoning_effort` reaches litellm verbatim (user_simulator.py passes llm_args
  # through) and is the medium-effort half of D12.
  user_llm_args:
    reasoning_effort: medium
    timeout: 60

  # 3 per plan D18 (2026-08-15), revising D2's value while keeping its structure: ONE
  # knob governing trials on every round type, batches and held-out alike. D2 chose 1
  # trial and pooled across tasks because trials were unaffordable at Sonnet prices;
  # seq 4 then paid D2's stated cost in full — every cell a coin flip, the whole curve
  # inside single-trial sampling noise (endpoint -7.1pp, trend p=0.802, all consistent
  # with no effect). At luna's measured ~$0.022/episode the affordability objection is
  # gone, so each per-task cell becomes a pass RATE (0..3/3): the noise band tightens
  # ±9 -> ±5 pp at T=28, a batch task at 1/3 hands diagnosis a passing and a failing
  # transcript of the SAME harness on the SAME task, and cross-generation flips become
  # attributable. The aggregate stays the mean per-task rate — the same quantity seq 4
  # estimated, comparably — and pass^k is still never used for generations (guardrail
  # 15; within-generation pass@3/pass^3 are legitimate per-task reliability texture).
  num_trials: 3
  seed: 300

  # Execution budgets. Exactly how a later generation can "improve" by being allowed to do
  # more, so they are frozen and reported rather than tuned.
  max_steps: 200
  max_errors: 10

  # Per-simulation wallclock ceiling, tau's TextRunConfig.timeout. Note this is *not*
  # --max-steps-seconds: that flag only configures audio-native runs, where it is divided
  # by the tick duration. It has no effect in text mode, so freezing it would freeze
  # nothing (contract/constraints.md records the correction).
  timeout_seconds: 600

  # Whether tau ends an episode when an assistant message carries both text and tool calls.
  # On the frozen list because it decides whether a protocol violation is graded at all, so
  # flipping it moves scores with no harness change.
  #
  # Left at tau's own default of false, which is the setting stock runs use and therefore the
  # comparable one. The adapter still forwards such messages unaltered, so the narration is
  # recorded in the trajectory even though tau never delivers it to the user — the harness
  # behaviour stays visible in the evidence rather than being repaired out of existence.
  enforce_communication_protocol: false

# Operational defaults — recorded configuration that is deliberately OUTSIDE the freeze:
# the fingerprint excludes this block (tau_adapter/experiment.py), so editing a value here
# is never freeze drift and never refuses a run.
operational:
  # Episodes in flight at once. Re-decided 2026-08-13 (user): an OPERATIONAL knob, not an
  # execution budget — parallelism moves wall-clock, never what the agent can do inside an
  # episode (each episode is independent and graded alone), so it lives outside the frozen
  # block and the freeze fingerprint. This value is the recorded default; any run may
  # override it with --max-concurrency (1 = serial), and the effective value lands in
  # run_metadata.json so every record still names its configuration. Episodes rendezvous on
  # per-episode bridge channels (tool_bridge.py) on both lanes — contract/constraints.md
  # § Platform-lane concurrency has the platform mechanism. A round can never use more
  # workers than it has episodes (tau's pool idles past the task count), so a generous
  # default is safe: held-out rounds run T-wide on the local lane, which has no sandbox
  # constraint. Platform BATCH rounds take --max-concurrency 4 from the batch target
  # instead (no org sandbox quota exists — misdiagnosis corrected 2026-08-14, and 4-wide
  # validated clean 2026-08-15; see contract/constraints.md § Platform-lane concurrency):
  # the remaining hazard is the heavy-tailed provisioning burst (100-650s observed at
  # 3-wide, vs 35-90s healthy) against the transport's 240s queue budget, whose tau
  # retries are noise a diagnosis round must not carry — drop the value per run if a
  # round shows that churn. Caveat, documented not gated: high N contends on
  # provider rate limits (2N provider streams), which can convert throttling into infra
  # retries.
  #
  # 10 -> 8 (2026-08-15, seq-5 restart). Not a response to a local-lane incident — the
  # discarded H0 held-out round ran 84 episodes 10-wide with ZERO incidents, so the local
  # lane's own evidence says 10 was fine. It is margin, taken deliberately after the seam's
  # real ceiling was found: every MCP tools/call parks TWO threads (channel resolution,
  # then the rendezvous), drawn from asyncio's DEFAULT executor at min(32, cpu_count + 4)
  # — 16 on the 12-core host, i.e. a hidden ~8-episode cap that belonged to the machine
  # rather than to any recorded value.
  #
  # CEILING STATUS (final, post-seq-5): REMOVED by the call-site executor —
  # ToolBridge._in_bridge_pool gives the two parking hops their own pool sized from the
  # round's concurrency, with no event-loop surgery (the same-day set_default_executor
  # attempt was reverted during the disconnect scare; contract/constraints.md § The seam's
  # own thread ceiling has the full arc). `bridge_executor_workers` in run_metadata.json
  # records the pool in use. The remaining practical constraints at any width are provider
  # streams (2N) and sandbox provisioning latency — and note the seam timeouts seen at
  # 4-wide in seq 5's batches were daemon patience against slow rendezvous, which no
  # thread count fixes; bridge_calls.jsonl carries the park durations that attribute them.
  #
  # Platform BATCH rounds still take --max-concurrency 4 from the `make batch` target, and
  # that number now carries evidence in both directions: 4-wide validated clean 2026-08-15,
  # while 8-wide produced one 300s rendezvous stall in a 24-episode round (task_028, τ
  # retried, succeeded) — consistent with the thread ceiling above, since a sandbox round-trip
  # parks a bridge thread far longer than a local call does.
  max_concurrency: 8

# Written by `make policy`. The pre-commit hook and CI compare sha256 against the
# <policy> block of target-agent/SYSTEM.md; the adapter additionally compares the block
# against the live env.get_policy() at episode start.
policy:
  sha256: 9c660d4354d7cb0858dd03dae0ad6ace1c25c181a07440b519442c48517fb176
  source_domain: banking_knowledge
  source_retrieval_config: bm25

# Written by `make policy`. The bridge asserts the live tau tool set matches this list
# exactly before the first episode, so a change to the graded tool surface cannot pass
# unnoticed through the agent's `include: ["*"]`.
tool_catalog:
  - KB_search
  - transfer_to_human_agents
  - get_current_time
  - get_user_information_by_id
  - get_user_information_by_name
  - get_user_information_by_email
  - change_user_email
  - get_referrals_by_user
  - get_credit_card_transactions_by_user
  - get_credit_card_accounts_by_user
  - log_verification
  - give_discoverable_user_tool
  - unlock_discoverable_agent_tool
  - call_discoverable_agent_tool
  - list_discoverable_agent_tools
