# Frozen surfaces for one experiment.
#
# contract/constraints.md holds the rules and the reasoning; this file holds only the
# values, so that "frozen" is checkable rather than aspirational. Every field here is
# asserted mechanically before a run starts — nothing in this file is documentation.
#
# Changing any value invalidates cross-generation comparison. Start a new experiment
# instead, and say so in the results directory.

# "Say so in the results directory" is mechanical, not aspirational: this id names the
# experiment the frozen values below define, and every run writes under
# results/experiment_<id>/<generation>/ — the runner refuses any other results/ path.
# One experiment is one freeze: re-deciding a frozen value means a NEW id here, never a
# new value under the old one. While frozen.status is PROVISIONAL the id stays `dummy`
# (the bring-up bucket, no snapshot enforcement); the real id is assigned when the freeze
# is re-decided before G0.
experiment:
  id: dummy

benchmark:
  repository: sierra-research/tau2-bench
  # Exact commit, never a range: v1.0.1 changed banking_knowledge grading and task data,
  # and results either side of it are not comparable. This is the released point the
  # re-graded leaderboard entries correspond to.
  commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
  tag: v1.0.1
  domain: banking_knowledge

  # Decides the agent's tool set *and* rewrites the policy text it is graded against, so it
  # is benchmark configuration, not harness. Improve how retrieval is *used* instead.
  #
  # BRING-UP VALUE, NOT THE INTENDED FREEZE. The MVP pins `openai_embeddings` because it sits
  # closest to the conditions under which published τ-Knowledge scores were obtained. That
  # config needs a working OPENAI_API_KEY, and the key on this machine returns
  # 429 billing_not_active, so the offline `bm25` fallback is used to bring the seam up.
  # Switching back is a one-line edit here plus `make policy`; doing so before G0 is
  # required for any number to be comparable with published results.
  retrieval_config: bm25

  # `base` is a task *split*, not a task set: tau's --task-set-name defaults to the domain's
  # own set, and --task-split-name defaults to "base". The MVP document's frozen-flag list
  # conflates the two.
  task_set_name: banking_knowledge
  task_split_name: base

frozen:
  # PROVISIONAL. These are placeholders that let the pipe move; they are not an
  # experiment's freeze. Re-decide every value here before G0 and drop this marker.
  status: PROVISIONAL

  # The model that actually serves the agent. Authoritative copy lives in
  # target-agent/agents/agent.yaml; the runner refuses to start if the two disagree, which
  # is what stops a later generation "improving" by quietly upgrading its own model.
  #
  # Sonnet 4.6 deliberately, and NOT Sonnet 5, despite Sonnet 5 being cheaper per unit of work
  # (~13%: $2/$10 per MTok against $3/$15, offset by its newer tokenizer's ~30% token inflation)
  # and stronger on agentic work. The reason is experimental sensitivity, not cost.
  #
  # §21 lists what the improvement orchestrator is expected to discover from evidence:
  # retrieval discipline, query reformulation, policy extraction, prerequisite checking,
  # plan-before-write, post-action verification. Sonnet 5 performs much of that natively —
  # adaptive thinking is on by default and it is explicitly trained for agentic
  # self-verification. A harness change that adds those behaviours explicitly would therefore
  # move the score *less* on Sonnet 5: the model compensates for the harness deficiency the
  # experiment exists to detect. A model that does not already do them leaves the harness as
  # the binding constraint, which is what we are trying to measure.
  #
  # Still provisional in one respect: 4.6 must clear §13.1's ≥20–25% floor on the discovery
  # split, or the comparative method loses its successful controls. That is unmeasured — no
  # split exists yet. If G0 lands below the floor, strengthen G0 before reconsidering this.
  agent_model: anthropic/claude-sonnet-4-6
  agent_thinking_level: low

  # tau requires --agent-llm, but our agent takes its model from the recipe, so this value
  # is declared and unused. Kept equal to agent_model so the file cannot read misleadingly.
  agent_llm_declared: anthropic/claude-sonnet-4-6

  # The user simulator moves scores as much as the agent model does, with no harness change
  # at all. It is a comparison variable in its own right.
  #
  # Anthropic by necessity as well as by choice: of the three provider keys on this machine,
  # OpenAI returns 429 billing_not_active and Gemini fails authentication.
  #
  # Also not Sonnet 5, for an independent reason that outlives the agent-side choice above:
  # Sonnet 5 rejects non-default sampling parameters, and `temperature: 0.0` — tau's own
  # default for the user simulator (config.py: DEFAULT_LLM_ARGS_USER) — returns a 400,
  # verified. Running the simulator on Sonnet 5 would mean giving up the one knob that makes
  # this half of the environment reproducible. The agent side has no such conflict, because Pi
  # owns its sampling and tau's llm_args never reach it.
  user_llm: anthropic/claude-sonnet-4-5

  # `timeout` is a per-attempt request ceiling, not a preference. tau sets litellm's
  # `num_retries` but never a `timeout`, so a stalled provider response blocks with no bound:
  # one user-simulator call in the first banking run hung for 601s while the agent side of the
  # same episode used 48s in total. Unbounded here makes wall-clock per generation
  # unpredictable, which is exactly what the cost-and-time budget cannot absorb.
  #
  # 60s is roughly five times the slowest healthy call observed (~12s), so a legitimate call is
  # never cut while a stall now costs 60s and a retry instead of ten minutes.
  #
  # `temperature` is tau's own default for the user simulator and is restored here explicitly:
  # this mapping REPLACES tau's DEFAULT_LLM_ARGS_USER rather than merging with it, so listing
  # only `timeout` silently ran the simulator at the provider's default temperature. This is
  # also the value Sonnet 5 rejects — see the note on user_llm above.
  user_llm_args:
    temperature: 0.0
    timeout: 60

  num_trials: 1
  seed: 300

  # Execution budgets. Exactly how a later generation can "improve" by being allowed to do
  # more, so they are frozen and reported rather than tuned.
  max_steps: 200
  max_errors: 10

  # Per-simulation wallclock ceiling, tau's TextRunConfig.timeout. Note this is *not*
  # --max-steps-seconds, which the MVP document lists as frozen: that flag only configures
  # audio-native runs, where it is divided by the tick duration. It has no effect in text
  # mode, so freezing it would freeze nothing.
  timeout_seconds: 600

  # 1 for bring-up. The bridge binds an ephemeral port per episode and passes it through
  # the environment, so raising this needs no redesign — but it must be re-frozen first.
  max_concurrency: 1

  # Whether tau ends an episode when an assistant message carries both text and tool calls.
  # Not in the MVP document's frozen list, and it belongs there: it decides whether a protocol
  # violation is graded at all, so flipping it moves scores with no harness change.
  #
  # Left at tau's own default of false, which is the setting stock runs use and therefore the
  # comparable one. The adapter still forwards such messages unaltered, so the narration is
  # recorded in the trajectory even though tau never delivers it to the user — the harness
  # behaviour stays visible in the evidence rather than being repaired out of existence.
  enforce_communication_protocol: false

# Written by `make policy`. The pre-commit hook and CI compare sha256 against the
# <policy> block of target-agent/SYSTEM.md; the adapter additionally compares the block
# against the live env.get_policy() at episode start.
policy:
  sha256: 9c660d4354d7cb0858dd03dae0ad6ace1c25c181a07440b519442c48517fb176
  source_domain: banking_knowledge
  source_retrieval_config: bm25

# Written by `make policy`. The bridge asserts the live tau tool set matches this list
# exactly before the first episode, so a change to the graded tool surface cannot pass
# unnoticed through the agent's `include: ["*"]`.
tool_catalog:
  - KB_search
  - transfer_to_human_agents
  - get_current_time
  - get_user_information_by_id
  - get_user_information_by_name
  - get_user_information_by_email
  - change_user_email
  - get_referrals_by_user
  - get_credit_card_transactions_by_user
  - get_credit_card_accounts_by_user
  - log_verification
  - give_discoverable_user_tool
  - unlock_discoverable_agent_tool
  - call_discoverable_agent_tool
  - list_discoverable_agent_tools
