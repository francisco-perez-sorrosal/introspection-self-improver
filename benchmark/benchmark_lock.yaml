# Frozen surfaces for one experiment.
#
# contract/constraints.md holds the rules and the reasoning; this file holds only the
# values, so that "frozen" is checkable rather than aspirational. Every field here is
# asserted mechanically before a run starts — nothing in this file is documentation.
#
# Changing any value invalidates cross-generation comparison. Start a new experiment
# instead, and say so in the results directory.

# "Say so in the results directory" is mechanical, not aspirational: seq + name derive the
# experiment id (`<seq, zero-padded to 3>_<name>`, here 001_bm25-sonnet46) naming the freeze
# the values below define, and every run writes under results/experiment_<id>/<generation>/
# — the runner refuses any other results/ path. One experiment is one freeze: re-deciding a
# frozen value means bumping `seq` here (a NEW experiment), never a new value under the old
# one; `name` is a configuration nickname and may repeat across experiments — the sequence
# is the identity.
#
# NUMBERING RESET 2026-08-13 (user-directed fresh start): every pre-protocol bring-up
# artifact was cleared from the working tree and lives in git history — including the
# bring-up freeze that previously held the id 001_bm25-sonnet46 (its closure README is at
# that path in history) and the 002 bring-up runs. Seq 1 froze the debug experiment
# (D10 sizes) and was VOIDED the same day at H0: task_034 deterministically crashes τ's
# text-mode user simulator under real agents, a frozen-surface defect — see
# results/experiment_001_bm25-sonnet46/README.md. Seq 2 ran the debug experiment to
# completion and is REVEALED (results/experiment_002_bm25-sonnet46/). Seq 3 held the
# powered experiment's bring-up — the D12/D13/D14 model-pair detours, calibration
# pilots and seam validations archived under results/experiment_003_powered-bm25-*/
# — and stays theirs. Seq 4 IS the powered experiment — the tier between debug and
# full, sized from seq-2 actuals by
# results/experiment_002_bm25-sonnet46/SIZING_ANALYSIS.md (plan D11): G=5/B=8/T=28 on
# a fresh 76-task pool; REVEALED 2026-08-15 — endpoint -2 tasks inside the ±9 pp band,
# trend p=0.802, no improvement demonstrated; the loop's machinery held (208 episodes,
# zero seam incidents, all twenty §29 guardrails). Seq 5 IS the loop-reliability
# experiment (plan D17/D18/D19): batch_mode fixed + num_trials 3 asks the prerequisite
# question seq 4 could not answer — can the loop fix what it stares at? Run at a
# REDUCED G=2 (plan D20, user-authorized 2026-08-15) — two mutation slots plus the
# endpoint round, enough to exercise every loop mechanic at ~40% of the episode cost;
# the design question is loop mechanics, not curve power. Seq 5 REVEALED 2026-08-16:
# the paired batch endpoint test gave p = 1.0000 with the curve 4.2% -> 8.3% -> 0.0%,
# held-out endpoint +0.0 pp — against the frozen reading key, "B flat -> the meta-agent
# is the problem". Seq 6 IS that experiment repeated at G=6 with composite improvement
# sets (see the seq-6 header below); it REVEALED 2026-08-16 — pre-registered primary NULL
# (paired batch endpoint p = 1.0000, curve ending below baseline), secondary held-out trend
# z = 1.77 / p = 0.038 on a triple-exposed set, so no capability claim. Seq 7 is unused.
# Seq 8 IS the stratified-batch experiment defined in its own block below; the full T=47
# run is deferred past it.
#
# PARITY CONVENTION (plan D15, 2026-08-15): EVEN seqs are stable, reportable
# experiments; ODD seqs are experimentation — bring-up, detours, voided freezes
# (1 = voided debug, 3 = powered bring-up). Parity layers on the freeze discipline
# and never replaces it: a re-decide still bumps seq, to the next number of the
# right parity. Reused ids are unambiguous mechanically: each freeze is identified
# by its own results/ snapshot fingerprint.
#
# SEQ 6 (plan D23, 2026-08-16, user-directed): the loop-reliability design REPEATED at
# full mutation depth and with composite improvement sets. Seq 5 answered its question
# ("can the loop fix what it stares at?") with *no* at G=2, and named the reason: seven
# of seven mutations across seq 4 + seq 5 were single changes, six of them `SYSTEM.md`
# text, four of which failed because an instruction does not inherit the scope its author
# reasoned about. Seq 6 changes exactly two things and holds every measured surface
# constant: G 2 -> 6 (six mutation slots, so a compounding loop has room to show), and
# improvement SETS per generation (plan D22) with the recipe's growth surfaces —
# Pi skill, extension tool, sub-agent — first-class. Same fixed 8 batch tasks, same
# T=28 held-out set, same model pair, same budgets, same seed: the instrument is
# unchanged so the seq-5 curve is the direct comparison.
#
# Seq 6 is EVEN, and D15's parity convention is satisfied on its own terms — it is a
# reportable experiment run to completion — but the number was pencilled in D11/D15 for
# the full T=47 run. The user overrode that on 2026-08-16 (recorded in D23, not
# relitigated): loop mechanics at depth outrank curve power while the loop has not yet
# been shown to improve anything at all.
#
# SEQ 8 (plan D28, 2026-08-16, user-directed): the SAME design as seq 6 — fixed batch,
# G=6, B=8, T=28, num_trials 3, luna on both halves, bm25, seed 300, every budget and both
# concurrency defaults carried UNCHANGED — with exactly two things moved, both of them
# instrument repairs the seq-6 independent review demanded and D25/D26 encoded:
#
#   1. THE BATCH IS STRATIFIED (plan D25 rule 1). Seq 5 hand-picked eight known-fails;
#      five of them never passed once in 168 episodes, so the pre-registered primary
#      reduced to one task's day-to-day variance and a regression on anything the harness
#      already did well was invisible by construction. Seq 8's eight span measured strata
#      under the incumbent H0 — anchors (reliable passes: regression detectors), marginals
#      (the band three trials resolve), headroom (fails whose modes the NOW-AVAILABLE
#      structural surfaces can plausibly address) — with each task's stratum and the
#      composition rationale in benchmark/split_manifest.yaml's header and the anchor tier
#      verified by a pre-partition calibration probe
#      (benchmark/probes/2026-08-16-anchor-calibration/). The endpoint test therefore has
#      dynamic range in BOTH directions for the first time.
#   2. THE READING KEY IS MECHANICAL (plan D25 rule 3). `protocol.reading_key` below names
#      all nine primary × secondary cells, lock-validated. Seq 6 observed primary-down /
#      secondary-up, a cell its prose key never named, and its closure had to adjudicate
#      off-key.
#
# THE SEAM CHANGED UNDER D24, so NOTHING in seq 8 is comparable to seq ≤ 6: registry-
# declared Pi-local tool calls are executed by Pi and suppressed from τ (no step, none of
# the ten max_errors), which re-opens extension tools and sub-agents as real mutation
# surfaces for the first time in this project. Three experiments of prose-only mutation
# are the standing prior; the structural surfaces are the live hypothesis, and the D26
# concentration flag is now a positive obligation rather than a justification duty. Every
# curve this experiment renders states the non-comparability.
#
# THE HELD-OUT SET IS ON ITS FOURTH EXPOSURE (plan D19/D23/D28, declared in
# benchmark/partition_reuse.yaml against 004, 005 AND 006, all revealed). The pool holds
# zero virgin tasks — a structural limit no re-draw escapes — so under D25 rule 2 the
# held-out lane is FORMALLY a diagnostic transfer probe and may carry no capability claim,
# however clean its trend. The pre-registered PRIMARY is the batch curve, whose evidence is
# fully observable by design and therefore unharmed by exposure.
#
# AUTONOMY (D23's envelope, re-registered here): require_human_approval stays false —
# every in-loop decision, PR merge included, is the orchestrator's. What the delegation
# does NOT cover is unchanged and still enforced mechanically: the frozen surfaces, the
# partition, the <policy> block, and the held-out firewall. Autonomy is decision authority,
# never access.
#
# Seq 8 is EVEN per D15: a reportable experiment, run to completion. Seq 7 was never cut.
experiment:
  seq: 8
  name: stratb-bm25-luna56

benchmark:
  repository: sierra-research/tau2-bench
  # Exact commit, never a range: v1.0.1 changed banking_knowledge grading and task data,
  # and results either side of it are not comparable. This is the released point the
  # re-graded leaderboard entries correspond to.
  commit: fc0055dc4e0a316c3f83133267fbd6faaa770992
  tag: v1.0.1
  domain: banking_knowledge

  # Decides the agent's tool set *and* rewrites the policy text it is graded against, so it
  # is benchmark configuration, not harness. Improve how retrieval is *used* instead.
  #
  # DELIBERATE FREEZE (decided 2026-08-12). `bm25` is pinned knowingly, not as a
  # fallback: it is fully offline and needs no provider key at run or grade time. The accepted
  # cost is comparability — `bm25` changes both the tool set and the policy text, so no number
  # under this freeze is comparable with published τ-Knowledge results, and none is claimed;
  # contract/constraints.md records the caveat. Cross-generation comparison is unaffected (the
  # backend is constant by construction) and retrieval *usage* — query formulation, k,
  # iteration, stopping — stays mutable harness territory.
  # Re-deciding this value means a NEW experiment id, never a new value under this one.
  retrieval_config: bm25

  # `base` is a task *split*, not a task set: tau's --task-set-name defaults to the domain's
  # own set, and --task-split-name defaults to "base". Two values, not one — conflating them
  # was an early mistake, corrected in contract/constraints.md.
  task_set_name: banking_knowledge
  task_split_name: base

# The generation protocol's experiment configuration (SIA_EVALUATION_PLAN.md §3;
# self_improving_agent_evaluation_protocol.md §26). Frozen with everything else in this
# file: the partition manifest is proposed from these sizes and verified against them,
# and the distinct-task budget must fit the eligible pool — (G*B)+T under batch_mode
# fresh, B+T under fixed (seq 5 and seq 6 alike: 36 of 97 — under fixed mode G does not
# enter the budget, which is why G could move 2 -> 6 without touching the partition;
# the pool is exhausted of virgin tasks, so
# reuse is a recorded freeze decision, not an accident — see the manifest header). Powered scale per D11 (2026-08-14,
# sized from seq-2 actuals by results/experiment_002_bm25-sonnet46/SIZING_ANALYSIS.md:
# powered for a ~+4-5 pp/generation loop — ~97% direction, ~82% trend-significance at
# α=.05 — where the debug T=8 could resolve nothing smaller than ~45 pp. T=28 gives a
# ~10-task failure mode 97%/85% odds of ≥1/≥2 held-out witnesses vs 60%/19% at T=8 and
# tightens the noise band ±17 → ±9 pp; B=8 turns batch prevalence quotes from quarters
# into eighths — the cheapest lever on mutation quality; G=5 is the strongest power
# lever, compounding mutations AND adding curve points to the pre-registered trend
# test). The full G=5/B=10/T=47 experiment is deferred to seq 6: at measured per-episode
# costs it adds ~10 pp of trend power for ~$80.
#
# G = 6 for seq 6 (plan D23, user-directed 2026-08-16). B and T are UNCHANGED from
# seq 4/seq 5, so D11's per-round sizing rationale above stands verbatim; only the
# number of mutation slots moves — 2 -> 6. This is the direct answer to seq 5's own
# recorded limitation ("what two slots CANNOT show is compounding across many
# generations"): six slots, each landing a composite improvement SET (D22), give the
# loop room to accumulate and give the held-out trend test 7 points instead of 3.
# Rounds: 7 held-out (H0..H6) x 28 x 3 = 588 local episodes; 7 batch rounds x 8 x 3
# = 168 platform episodes.
protocol:
  generations: 6
  improvement_tasks_per_generation: 8
  held_out_tasks: 28

  # CARRIED FROM SEQ 5/6 (plan D17, re-affirmed by D23 and D28): one fixed batch task
  # set — the SAME eight tasks — measured under every generation, H6 included (batch_07
  # is H6's measurement-only endpoint round, consumed by no transition). Seq 4's null
  # left two explanations standing — "the mutations did nothing" vs "the measurement
  # could not see it" — and fixed mode attacks the prerequisite question directly: can
  # the improvement loop fix what it stares at? Seq 5 answered no at two slots; seq 6
  # asked again at six with composite sets and answered no again — but its own review
  # showed the instrument could barely have said yes, five of eight tasks having
  # contributed zero dynamic range across 168 episodes. Seq 8 asks the same question
  # through a STRATIFIED batch (D25 rule 1; strata in split_manifest.yaml's header), so
  # both directions are measurable: anchors can break, marginals can move, headroom can
  # open.
  #
  # The batch curve is a PAIRED saturation curve (same tasks every generation); its
  # pre-registered PRIMARY is scripts/batch_curve.py's exact paired sign-flip endpoint
  # test on per-task rate deltas, H6's batch_07 vs H0's batch_01, alpha 0.05, 2^8
  # enumeration, no interim looks. The SECONDARY is the held-out trend (reveal's
  # one-sided z over H0…H6) read beside its advisory fragility report — and it is a
  # DIAGNOSTIC TRANSFER PROBE, not a capability instrument: these 28 tasks are on their
  # fourth experiment and all three predecessors revealed (D25 rule 2; declared in
  # benchmark/partition_reuse.yaml). Every T-based number states that.
  batch_mode: fixed

  # The full-quadrant reading key (plan D25 rule 3), pre-registered here because a key
  # written after the data exists is not a key. lock.py's READING_KEY_CELLS requires all
  # nine primary × secondary cells; a cell may declare its combination run-voiding, never
  # be absent. Seq 6 observed primary-down / secondary-up and had to adjudicate off-key.
  #
  # DIRECTION IS MECHANICAL, decided from the two committed artifacts, not by reading a
  # curve by eye:
  #   PRIMARY   (results/experiment_<id>/batch_curve.json, endpoint pair only)
  #     up   = sum(per-task rate deltas) > 0 AND the pre-registered one-sided exact test
  #            p < 0.05  (this is the experiment's single confirmatory rejection)
  #     down = sum < 0 AND the MIRRORED enumeration P(sum <= observed) < 0.05. The mirror
  #            is a pre-registered DIRECTION RULE for reading the result, not a second
  #            hypothesis test: alpha is spent once, on the one-sided up test above.
  #     flat = anything else, including a non-significant sum of either sign.
  #   SECONDARY (held_out/trend_test.json, computed only at reveal)
  #     up = z >= +1.645 · down = z <= -1.645 · flat = otherwise.
  #     In every cell the fragility report (held_out/trend_fragility.json) qualifies the
  #     secondary, and the fourth-exposure caveat applies unconditionally.
  #
  # Standing across all nine cells, stated once so no cell has to repeat it: results
  # under the D24 seam are NOT comparable to seq <= 6, and no cell licenses a capability
  # claim from the held-out lane.
  reading_key:
    primary_up_secondary_up: >-
      The loop improved the tasks it stared at and the gain appeared on the transfer
      probe too. The strongest result this design can return. Report as: loop
      demonstrated on the batch (pre-registered primary), with concordant transfer that
      is exposure-confounded and therefore corroborating, never claiming. The closure
      names which changes moved which strata and whether any anchor paid for the gain.
    primary_up_secondary_flat: >-
      The loop optimizes what it measures and the gain does not transfer — mutations are
      batch-shaped. The primary claim stands; no generalization claim is available. The
      endpoint diagnosis asks per change whether its mechanism is task-specific, and the
      closure reports the batch win with the flat probe as its principal limit.
    primary_up_secondary_down: >-
      The batch improved while the transfer probe fell: overfitting with collateral
      damage, the sharpest negative-transfer signal this instrument can produce. The
      primary verdict is positive and must be reported with the held-out decline as its
      headline caveat; the closure identifies the changes that plausibly traded breadth
      for the eight.
    primary_flat_secondary_up: >-
      Null primary with a rising probe — seq 6's cell, now with a batch that could have
      moved. Check the strata first: a flat sum can hide an anchor regression cancelled
      by a headroom gain, and the per-task cells decide which happened. If the batch is
      genuinely inert, a rise on a fourth-exposure set is more likely exposure or noise
      than capability; report null primary, run the fragility report before writing any
      sentence about the secondary, and claim nothing.
    primary_flat_secondary_flat: >-
      Null on both instruments. With strata verified to move under H0 before the freeze,
      the instrument excuse that survived seq 6 is gone: six generations of composite
      sets, with the structural surfaces available for the first time, produced no
      detectable change anywhere. Against the standing reading this says the meta-agent
      is the problem, and the closure says so plainly.
    primary_flat_secondary_down: >-
      The batch held and the transfer probe fell: the loop is doing harm outside what it
      watches, which prose-only loops have never been able to see. Report as a negative
      result; the endpoint diagnosis names the changes whose scope over-generalized, and
      any surviving change refuted this way is recorded as a first-class failed mutation.
    primary_down_secondary_up: >-
      The batch regressed while the probe rose — the cell seq 6 observed off-key. With
      anchors in the batch this is now interpretable rather than a floor artifact: the
      per-task cells say whether anchors broke (a real regression the loop caused) or
      only marginals and headroom moved. A probe rise concurrent with a batch regression
      on a fourth-exposure set supports no positive claim of any kind.
    primary_down_secondary_flat: >-
      The loop actively damaged what it stared at while the probe stayed put. Report as a
      negative result and name the broken anchor cells; the endpoint diagnosis attributes
      them to specific surviving changes, and the closure records which revert the loop
      should have taken and did not.
    primary_down_secondary_down: >-
      The loop made the harness worse on both instruments — the strongest negative result
      available. The closure states which surviving changes are the candidates, whether
      any generation's own falsifier had already fired unheeded, and what the failure says
      about composite sets landing changes faster than the next batch can refute them.

  # True BECAUSE batch_mode is fixed: re-measuring the same batch every generation IS
  # within-batch verification, embraced as the object of study (the lock refuses the
  # contradictory combination). Under fresh mode this stays false (protocol §15).
  allow_within_batch_verification: true

  # The held-out firewall, stated as configuration: nothing about the held-out set —
  # tasks, trajectories, per-task rewards, aggregates — reaches the orchestrator before
  # reveal. Held-out trials per task are frozen.num_trials below — one knob, never two;
  # a held_out_trials_per_task key here is refused by the lock parser.
  holdout_visibility:
    expose_tasks_to_orchestrator: false
    expose_traces_to_orchestrator: false
    expose_per_task_results_to_orchestrator: false
    expose_aggregate_score_to_orchestrator: false

  # FALSE FOR SEQ 6 AND SEQ 8 (plan D23, re-registered by D28; both user-directed
  # 2026-08-16). Seq <= 5 ran with this true: a mutation lands as a PR a human reviews and merges, and the
  # agent never merges its own work (root CLAUDE.md's standing guardrail). Seq 6 tested
  # the loop at six generations with composite sets, and the user explicitly delegated
  # ALL in-loop decisions to the orchestrator — diagnose, compose the set, accept or
  # take an identity generation, open the PR, MERGE it, tag, proceed — through the
  # reveal. Seq 8 runs the same envelope by the same explicit user direction (D28),
  # which now also covers the per-clause adversarial wording review the orchestrator
  # performs on its own instruction text before landing it (schema v3, D26).
  #
  # The deviation lives HERE, in the freeze, rather than being waived at the §29
  # guardrail walk after the fact: seq 5 recorded human approval as "waived, not held",
  # which is an honest note about an unrecorded decision. This is the same fact
  # pre-registered. The guardrail walk reports it as frozen-false by D23.
  #
  # What the delegation does NOT cover, and the run still enforces mechanically: the
  # frozen surfaces above (a mid-run edit refuses every round), the partition, the
  # <policy> block, and the held-out firewall — autonomy is decision authority, never
  # access. Branch protection and CI stay on; a merge the required checks reject is a
  # blocked merge, not an overridden one.
  require_human_approval: false

frozen:
  # FROZEN directly at cut (plan D28, 2026-08-16): seq 8's parameters are user-fixed in
  # the directing prompt, and NOTHING IN THIS BLOCK MOVES — every value below is carried
  # from the seq-6 freeze unchanged, which is deliberate. Seq 8 changes the INSTRUMENT
  # (a stratified batch, a mechanical reading key) and inherits the seam change D24 made
  # between experiments; holding the measured surfaces constant is what keeps the batch
  # curve readable against seq 5's and seq 6's at all.
  #
  # No pilot precedes this freeze and the user-sim screen is NOT re-run: the model pair
  # is unchanged and the 2026-08-15 luna screen (97/97, benchmark/data/user_sim_screen.json)
  # is current — screening evidence is model-conditioned (D12/D13) and the condition
  # holds. This is D19's precedent, applied identically. task_034 stays excluded.
  #
  # What DID get bought before the cut, because D25 rule 1 requires strata measured under
  # the incumbent H0 rather than inherited from lifetime rates:
  # benchmark/probes/2026-08-16-anchor-calibration/ — 69 local episodes, $0.97, three
  # anchor-grade tasks found outside the held-out set, and two of the previously-named
  # marginal candidates measured BELOW the marginal band. The composition that resulted,
  # with every drop and its reason, is in benchmark/split_manifest.yaml's header.
  #
  # Start gate: `make reset_h0` (the recipe is already byte-identical to `h0-baseline`
  # at the D27 scaffold commit b76f274 — seq-6 mutations are evidence, not inheritance),
  # then `make gate_a0a` and `make gate_seam` before the first episode is spent. A.0a is
  # blocking per experiment AND newly load-bearing here: D24 changed the adapter's
  # semantics between experiments, so the suite covering the changed semantics must pass
  # before any seq-8 result exists.
  status: FROZEN

  # The model that actually serves the agent. Authoritative copy lives in
  # target-agent/agents/agent.yaml; the runner refuses to start if the two disagree, which
  # is what stops a later generation "improving" by quietly upgrading its own model.
  #
  # gpt-5.6-luna at medium thinking — D12's intended pair, RESTORED by D14 per D13's
  # return clause once the platform fixed its sandbox serializer (it emitted OpenAI's
  # retired `reasoning.level` for any thinking level; the fix rides the sandbox stack
  # baked into runtime images, so verification requires a POST-fix image — the span of
  # the first episode on one must show `reasoning.effort`). The
  # inference-cost rationale and the sensitivity trade are D12's, unchanged: if luna
  # performs the harness behaviours natively, mutations move the score less; the B1
  # read (D8) guards both failure modes (0/B = strengthen H0, B/B = the model choice
  # re-opens). Calibration of record is the CORRECTED-H0 luna pilot (D16, 2026-08-15:
  # baseline 6/28 = 21.4%, $0.022/local episode —
  # results/experiment_004_powered-bm25-luna56/CALIBRATION_PILOT.md). The earlier 003
  # pilot measured a seq-2-contaminated harness (its arm carried the g1-g3 SYSTEM.md
  # mutations; the h0-baseline tag has since been corrected and reset_h0 verifies
  # byte-identity); the D13 haiku
  # detour is archived at results/experiment_003_powered-bm25-haiku45/.
  agent_model: openai/gpt-5.6-luna
  # null = the ai:-spelled recipe omits thinking_level (user decision at the merge of
  # probe/ai-no-thinking, 2026-08-15). The assertion pins the ABSENCE; whether the
  # platform sandbox injects a default reasoning parameter for this shape is exactly
  # what the next platform episode's span must show.
  agent_thinking_level: null

  # tau requires --agent-llm, but our agent takes its model from the recipe, so this value
  # is declared and unused. Kept equal to agent_model so the file cannot read misleadingly.
  agent_llm_declared: openai/gpt-5.6-luna

  # The user simulator moves scores as much as the agent model does, with no harness change
  # at all. It is a comparison variable in its own right.
  #
  # gpt-5.6-luna here too (D12/D14): one model pair, one provider, minimum surface.
  # The reproducibility knob is surrendered knowingly: luna rejects `temperature: 0.0`
  # exactly as Sonnet 5 did (HTTP 400, verified 2026-08-14), so the simulator samples
  # at the provider default and this half of the environment is stochastic per
  # episode — absorbed by D2's task-pooling. (The D13 haiku detour briefly restored
  # the knob; it leaves with haiku.) The seq-2 user-sim screening evidence is
  # model-conditioned and is re-run at the start gate.
  user_llm: openai/gpt-5.6-luna

  # `timeout` is a per-attempt request ceiling, not a preference. tau sets litellm's
  # `num_retries` but never a `timeout`, so a stalled provider response blocks with no bound:
  # one user-simulator call in the first banking run hung for 601s while the agent side of the
  # same episode used 48s in total. Unbounded here makes wall-clock per generation
  # unpredictable, which is exactly what the cost-and-time budget cannot absorb.
  #
  # 60s is roughly five times the slowest healthy call observed (~12s), so a legitimate call is
  # never cut while a stall now costs 60s and a retry instead of ten minutes.
  #
  # This mapping REPLACES tau's DEFAULT_LLM_ARGS_USER rather than merging with it — every
  # key the simulator should run with must be listed here. `temperature` is deliberately
  # ABSENT: gpt-5.6-luna rejects any non-default value (see the note on user_llm above).
  # `reasoning_effort` reaches litellm verbatim (user_simulator.py passes llm_args
  # through) and is the medium-effort half of D12.
  user_llm_args:
    reasoning_effort: medium
    timeout: 60

  # 3 per plan D18 (2026-08-15), revising D2's value while keeping its structure: ONE
  # knob governing trials on every round type, batches and held-out alike. D2 chose 1
  # trial and pooled across tasks because trials were unaffordable at Sonnet prices;
  # seq 4 then paid D2's stated cost in full — every cell a coin flip, the whole curve
  # inside single-trial sampling noise (endpoint -7.1pp, trend p=0.802, all consistent
  # with no effect). At luna's measured ~$0.022/episode the affordability objection is
  # gone, so each per-task cell becomes a pass RATE (0..3/3): the noise band tightens
  # ±9 -> ±5 pp at T=28, a batch task at 1/3 hands diagnosis a passing and a failing
  # transcript of the SAME harness on the SAME task, and cross-generation flips become
  # attributable. The aggregate stays the mean per-task rate — the same quantity seq 4
  # estimated, comparably — and pass^k is still never used for generations (guardrail
  # 15; within-generation pass@3/pass^3 are legitimate per-task reliability texture).
  num_trials: 3
  seed: 300

  # Execution budgets. Exactly how a later generation can "improve" by being allowed to do
  # more, so they are frozen and reported rather than tuned.
  max_steps: 200
  max_errors: 10

  # Per-simulation wallclock ceiling, tau's TextRunConfig.timeout. Note this is *not*
  # --max-steps-seconds: that flag only configures audio-native runs, where it is divided
  # by the tick duration. It has no effect in text mode, so freezing it would freeze
  # nothing (contract/constraints.md records the correction).
  timeout_seconds: 600

  # Whether tau ends an episode when an assistant message carries both text and tool calls.
  # On the frozen list because it decides whether a protocol violation is graded at all, so
  # flipping it moves scores with no harness change.
  #
  # Left at tau's own default of false, which is the setting stock runs use and therefore the
  # comparable one. The adapter still forwards such messages unaltered, so the narration is
  # recorded in the trajectory even though tau never delivers it to the user — the harness
  # behaviour stays visible in the evidence rather than being repaired out of existence.
  enforce_communication_protocol: false

# Operational defaults — recorded configuration that is deliberately OUTSIDE the freeze:
# the fingerprint excludes this block (tau_adapter/experiment.py), so editing a value here
# is never freeze drift and never refuses a run.
operational:
  # Episodes in flight at once. Re-decided 2026-08-13 (user): an OPERATIONAL knob, not an
  # execution budget — parallelism moves wall-clock, never what the agent can do inside an
  # episode (each episode is independent and graded alone), so it lives outside the frozen
  # block and the freeze fingerprint. This value is the recorded default; any run may
  # override it with --max-concurrency (1 = serial), and the effective value lands in
  # run_metadata.json so every record still names its configuration. Episodes rendezvous on
  # per-episode bridge channels (tool_bridge.py) on both lanes — contract/constraints.md
  # § Platform-lane concurrency has the platform mechanism. A round can never use more
  # workers than it has episodes (tau's pool idles past the task count), so a generous
  # default is safe: held-out rounds run T-wide on the local lane, which has no sandbox
  # constraint. Platform BATCH rounds take --max-concurrency 3 from the batch target
  # instead (4 -> 3 at the seq-6 freeze; no org sandbox quota exists — misdiagnosis
  # corrected 2026-08-14, and 4-wide validated clean 2026-08-15; see
  # contract/constraints.md § Platform-lane concurrency):
  # the remaining hazard is the heavy-tailed provisioning burst (100-650s observed at
  # 3-wide, vs 35-90s healthy) against the transport's 240s queue budget, whose tau
  # retries are noise a diagnosis round must not carry — drop the value per run if a
  # round shows that churn. Caveat, documented not gated: high N contends on
  # provider rate limits (2N provider streams), which can convert throttling into infra
  # retries.
  #
  # 8 -> 3 (2026-08-16, seq-6 freeze, user-directed and deliberately conservative). The
  # local held-out lane has never shown an incident at 8 or 10, so this is margin bought
  # with wall-clock rather than a response to evidence: seq 6 runs 588 local and 168
  # platform episodes unattended, and a round that has to be re-run costs far more than
  # the parallelism saves. `make batch` pins 3 for the same reason (see the batch
  # target's own note). Raising it mid-experiment is legal — this block is outside the
  # freeze fingerprint — but the autonomous run does not do it to save time.
  #
  # Prior value's rationale, kept because it names the ceiling that was found:
  # 10 -> 8 (2026-08-15, seq-5 restart). Not a response to a local-lane incident — the
  # discarded H0 held-out round ran 84 episodes 10-wide with ZERO incidents, so the local
  # lane's own evidence says 10 was fine. It is margin, taken deliberately after the seam's
  # real ceiling was found: every MCP tools/call parks TWO threads (channel resolution,
  # then the rendezvous), drawn from asyncio's DEFAULT executor at min(32, cpu_count + 4)
  # — 16 on the 12-core host, i.e. a hidden ~8-episode cap that belonged to the machine
  # rather than to any recorded value.
  #
  # CEILING STATUS (final, post-seq-5): REMOVED by the call-site executor —
  # ToolBridge._in_bridge_pool gives the two parking hops their own pool sized from the
  # round's concurrency, with no event-loop surgery (the same-day set_default_executor
  # attempt was reverted during the disconnect scare; contract/constraints.md § The seam's
  # own thread ceiling has the full arc). `bridge_executor_workers` in run_metadata.json
  # records the pool in use. The remaining practical constraints at any width are provider
  # streams (2N) and sandbox provisioning latency — and note the seam timeouts seen at
  # 4-wide in seq 5's batches were daemon patience against slow rendezvous, which no
  # thread count fixes; bridge_calls.jsonl carries the park durations that attribute them.
  #
  # Platform BATCH rounds still take --max-concurrency 4 from the `make batch` target, and
  # that number now carries evidence in both directions: 4-wide validated clean 2026-08-15,
  # while 8-wide produced one 300s rendezvous stall in a 24-episode round (task_028, τ
  # retried, succeeded) — consistent with the thread ceiling above, since a sandbox round-trip
  # parks a bridge thread far longer than a local call does.
  max_concurrency: 3

  # Which tool names count as which behavioral signature in the derived process metrics
  # (plan D25; tau_adapter/process_metrics.py `tool_classes_from_lock`). Operational —
  # outside the freeze fingerprint — because these names configure derived DIAGNOSTICS,
  # never what the agent can do inside an episode; the code stays domain-agnostic and
  # this block says what "search", "transfer", and "capability discovery" mean for the
  # frozen domain. The user's own discoverable calls are deliberately not listed: they
  # measure the simulated user, not the harness.
  # REVIEWED for the seq-8 freeze (the D25/Phase-5.7 checklist item) and left UNCHANGED,
  # deliberately: five of seq 8's eight batch tasks carry discoverable-tool gold actions,
  # so the counter matters more here than it did in seq 6 — and comparability of the
  # counter across the two experiments is worth more than completeness. `list_discoverable
  # _agent_tools` is in the tool_catalog and is NOT added: it records that the agent
  # LOOKED, while these three record that it ACTED, and collapsing the two would blunt
  # exactly the handover-procedure distinction the headroom tier exists to test. If a
  # round's diagnosis wants the looking count it is one grep over bridge_calls.jsonl,
  # outside the pre-registered channels.
  process_metric_tools:
    search: KB_search
    transfer: transfer_to_human_agents
    discoverable:
      - unlock_discoverable_agent_tool
      - call_discoverable_agent_tool
      - give_discoverable_user_tool

# Written by `make policy`. The pre-commit hook and CI compare sha256 against the
# <policy> block of target-agent/SYSTEM.md; the adapter additionally compares the block
# against the live env.get_policy() at episode start.
policy:
  sha256: 9c660d4354d7cb0858dd03dae0ad6ace1c25c181a07440b519442c48517fb176
  source_domain: banking_knowledge
  source_retrieval_config: bm25

# Written by `make policy`. The bridge asserts the live tau tool set matches this list
