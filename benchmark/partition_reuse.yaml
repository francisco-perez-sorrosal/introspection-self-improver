  # ── seq 10 (010_adopt-bm25-luna56) ────────────────────────────────────────────────
  # Five rows, one per prior source, because the check ranks severity per prior experiment
  # and collapsing them would read as one generation of distance when it is five.
  #
  # What changed with plan D33, and it changes what these rows MEAN. Through seq 8 a
  # held_out_from_held_out row was an admission of weakness: the orchestrator had seen the
  # prior reveal's per-task results, so the firewall was "weaker than it looks" and the
  # lane was formally demoted to a diagnostic transfer probe carrying no capability claim.
  # D33 (user-directed 2026-08-17) replaces that reading with a mechanism. In-loop decision
  # inputs are improvement batches ONLY — current and past — and held-out artifacts of
  # every experiment, revealed included, are quarantined from in-loop recall WITHOUT
  # EXPIRY: no held_out/ directory, no summary.md, no trend or fragility artifact, no
  # task x generation matrix, no closure section carrying per-task held-out content. Prior
  # experiments are recalled through their improvement_records/ and improvement_backlog.md,
  # which are batch-derived by construction.
  #
  # So exposure is now graded by CHANNEL, and the two channels are not equivalent:
  #   * a task the loop used as a BATCH task is burnt for held-out use FOREVER — the loop
  #     read its transcripts in full as diagnosis evidence and no reading discipline undoes
  #     that (this is why all 36 rows below are held_out_from_held_out and none is
  #     held_out_from_batch, and why seq-2's 12 batch tasks went back to batch stock);
  #   * a HOLDOUT-ONLY task is claim-eligible under the procedural firewall — the same
  #     enforcement class the project has trusted pre-reveal for eight experiments, now
  #     with no expiry date and an attestation in the §29 walk.
  #
  # The honesty boundary, stated with the decision rather than discovered later: the
  # strong-form guarantee ("no operator ever saw the key") is NOT restorable for tasks that
  # have been revealed — the matrices are committed, and sessions that performed those
  # reveals existed. What seq 10 claims is the procedural form, named in those words
  # wherever a T-based number appears. The unqualified zero-exposure claim requires a pool
  # no prior experiment touched, which banking_knowledge cannot supply (zero virgin tasks);
  # that is a domain decision, user-owned, pencilled seq 12.
