# The generation protocol's task partition, batch_mode FIXED: one batch task set
# measured under every generation, plus the fixed held-out set, as lists of tau
# task ids because tau selects tasks with --task-ids.
#
# Rules (SIA_EVALUATION_PLAN.md D1/D9; invariants in CLAUDE.md):
#   batch_NN — round NN over the ONE fixed batch task set (every batch_NN list is
#              deliberately identical; verify enforces the identity). batch_NN is
#              run by H_(NN-1); the last batch round is run by H_G and consumed by
#              no transition — it is the batch curve's endpoint measurement.
#              Platform lane, fully observable, re-measured BY DESIGN: the batch
#              curve asks whether the loop can fix what it directly observes.
#   held_out — measured once per generation on the local lane. Tasks, trajectories,
#              and rewards stay out of tree (the vault) until the experiment's reveal.
#
# Hand-chosen lists (no stratified proposal): the batch composition is itself a
# freeze decision, recorded in the note below.
# Changing any list invalidates the experiment — a new experiment id (bump
# experiment.seq in benchmark_lock.yaml), never new lists under the old one. Verify
# with scripts/propose_split.py --verify.
#
# Seq 12 (plan D36), composed from the Phase 0 ceiling probe as an EMPIRICAL reachability oracle
# (benchmark/probes/2026-08-18-phase0-ceiling-probe/): 35 candidates x 3 trials under H0 and a
# hand-built H-expert, openai_embeddings, the backend Phase 0 selected on measured harness
# headroom (+15.2 pp vs bm25 +6.7 pp). A task H-expert passes is PROVABLY harness-reachable,
# which is what finally lets a batch admit a headroom stratum instead of guessing at one from
# trajectories. B=26 rather than the designed 30 because only 26 of the 35 candidates earned a
# reachability certificate, and the pre-registered composition rule says shrink (floor 24)
# rather than admit a wall; the shrink is recorded, not smoothed over. The certificate is read
# as EITHER arm passing: the rule literally says "any task H-expert never passes", which would
# have dropped task_063 (H0 3/3) and task_010 (H0 2/3) as walled, and calling a task H0 passes
# every time unreachable is false. That widening affects exactly two tasks and changes no
# verdict (strict letter gives B=24, also inside the power envelope). Strata under the incumbent
# H0 at openai_embeddings, 3 trials: 3 anchors (H0 3/3, the regression channel), 12 marginals
# (1/3-2/3, where num_trials resolves movement), 11 headroom (H0 0/3 but H-expert passes - the
# tier seq 10 never got to admit). NO walled task is admitted. 53 reachable failing cells at H0
# against seq 10s 17 and seq 8s ~5. T=36 is FORCED, not chosen: exactly 36 tasks have never been
# batched by any experiment and D33 burns batch-used tasks for held-out use forever; pure-
# holdout, claim-bearing on the D33 procedural basis, all reuse declared in
# partition_reuse.yaml.

