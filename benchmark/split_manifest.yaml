# The generation protocol's task partition, batch_mode FIXED: one batch task set
# measured under every generation, plus the fixed held-out set, as lists of tau
# task ids because tau selects tasks with --task-ids.
#
# Rules (SIA_EVALUATION_PLAN.md D1/D9; invariants in CLAUDE.md):
#   batch_NN — round NN over the ONE fixed batch task set (every batch_NN list is
#              deliberately identical; verify enforces the identity). batch_NN is
#              run by H_(NN-1); the last batch round is run by H_G and consumed by
#              no transition — it is the batch curve's endpoint measurement.
#              Platform lane, fully observable, re-measured BY DESIGN: the batch
#              curve asks whether the loop can fix what it directly observes.
#   held_out — measured once per generation on the local lane. Tasks, trajectories,
#              and rewards stay out of tree (the vault) until the experiment's reveal.
#
# Hand-chosen lists (no stratified proposal): the batch composition is itself a
# freeze decision, recorded in the note below.
# Changing any list invalidates the experiment — a new experiment id (bump
# experiment.seq in benchmark_lock.yaml), never new lists under the old one. Verify
# with scripts/propose_split.py --verify.
#
# seq 6 loop-reliability at depth (plan D23/D22). The partition is seq 5's, REUSED VERBATIM in
# both halves — same fixed 8 batch tasks, same T=28 held-out set — because holding the
# instrument constant is the point: seq 6 changes G (2 -> 6) and the mutation shape (composite
# improvement SETS, D22, growth surfaces first-class), and nothing else, so its curve compares
# directly against seq 5's. FIXED BATCH, hand-chosen originally for seq 5: 8 tasks that FAILED
# under recent harnesses in seq-4 batches, covering the recurring modes — value resolution
# (task_065, task_072, task_096), discoverable-tool handover (task_026, task_028), transfer
# discipline in both directions (task_014 refused a required transfer; task_082 transferred on
# first request), wholesale abandonment/unbounded search (task_070). Under fixed mode G does not
# enter the distinct-task budget (B+T = 36 of 97), which is why six slots cost no extra tasks.
# HELD-OUT: the pool holds zero virgin tasks and the orchestrator has now seen TWO revealed per-
# task result sets for these 28 (seq 4 and seq 5), so the held-out lane is a transfer probe
# carrying a triple-exposure caveat that every T-based number must state; the BATCH curve is the
# primary instrument. Declared in benchmark/partition_reuse.yaml.

