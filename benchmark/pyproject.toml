[project]
name = "tau-adapter"
version = "0.1.0"
description = "The seam between tau2-bench and an Introspection recipe."
# tau2 declares >=3.12,<3.14, but its package __init__ imports the voice module, which
# imports `audioop` — removed from the stdlib in 3.13 by PEP 594. So the real ceiling is
# 3.12. Narrowed here rather than papering over it with the audioop-lts shim, since the
# constraint is upstream's and pretending otherwise would hide it from anyone reproducing.
requires-python = ">=3.12,<3.13"
dependencies = [
  # The task oracle. Pinned by commit in benchmark_lock.yaml and reproduced into
  # vendor/ by `make bootstrap`; see [tool.uv.sources] below. The `knowledge` extra
  # is what supplies the banking_knowledge retrieval pipeline.
  "tau2[knowledge]",
  # Serves the tau tool surface to Pi over streamable HTTP.
  "mcp>=1.2",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

# A path source rather than a git source on purpose. tau2 keeps its 715 MB of domain
# data at its repository root, outside the installable package, so a checkout is needed
# regardless and TAU2_DATA_DIR has to point at one. One checkout serves both roles.
[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tau_adapter"]

# Bare `pytest` would otherwise walk into vendor/tau2-bench and fail collecting its voice
# tests. The vendored checkout is the pinned objective, not code under test here — its suite is
# upstream's to run, and reaching into it is how a "fix" to the evaluator starts.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit so the contract is this project's own, not whatever config happens to sit above it
# in the filesystem. B/S/BLE earn their place here: the seam runs subprocesses, serves HTTP,
# and threads results between them, which is where blind excepts and mutable defaults hurt.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "BLE", "RUF", "EXE"]
ignore = [
  "E501",    # ruff format owns line length
  "S101",    # asserts guard invariants that must not be caught and continued from
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # deliberate subprocess use with fixed argument vectors
