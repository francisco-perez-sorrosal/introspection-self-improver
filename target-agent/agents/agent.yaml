name: agent
description: Banking support agent evaluated by tau2-bench; the harness under improvement.

# FROZEN. `model.name` and `model.thinking_level` are comparison variables, not harness
# surface — a generation that raised either would "improve" by being given a better model
# rather than a better harness. Their locked values live in benchmark/benchmark_lock.yaml
# and the runner refuses to start when the two disagree.
#
# The `ai:` block is the current spelling (adopted 2026-08-15). Validated by both the
# cloud (introspection-recipe-check 0.3.0) and the local toolchain since CLI 0.27.1;
# `thinking_level` is deliberately omitted — the sandbox's default-injection behaviour
# for this shape is pinned by the platform-episode span, and the lock asserts the
# field's absence.
ai:
  model: openai/gpt-5.6-luna

# Empty on purpose, and load-bearing THREE times over. The baseline gets only the tools tau
# hands it (§13); withholding `read`/`bash` denies a locally-hosted agent any path to the
# task definitions and gold state sitting in benchmark/vendor/ (§22.1); and under the D24
# seam this list doubles as the Pi-local suppression registry (tau_adapter/pi_local.py) —
# every name here (plus `agent` when subagents is non-empty) is executed by Pi and
# suppressed from τ's graded trajectory, logged in raw_data. An extension tool becomes
# model-callable by being registered in a declared extension AND listed here — both halves
# in one coherent change; the committed-undeclared template is extensions/noop-tool.ts
# (tool name probe_note), and first use is adoption-first (contract/protocol.md step 4).
tools:
  # TEMPORARY, pre-freeze suppression canary only (contract/protocol.md step 0, plan
  # D30 rule 6). Reverted before the first graded round; H0 registry is empty.
  - probe_note

# Empty, and measured to stay that way on this seam: a DECLARED skill reaches nothing on
# the local lane — not the prompt, not the session, with or without `read` (probe P2,
# benchmark/probes/2026-08-16-surface-probes/). Skill-shaped judgment ships as a
# `before_agent_start` hook that reads its own content (see extensions/noop-hook.ts, the
# committed-but-undeclared template). Declaring a skill here without re-measuring the
# host's behavior is a wasted mutation at best.
skills: []

# Empty, and the surface has never run an episode on this seam. The committed-unreferenced
# template is agents/noop-subagent.yaml — enabling it adds its name here, which
# auto-generates the `agent` delegation tool (never listed in tools: manually) and puts
# that tool in the D24 suppression registry. `from: agent` binds the frozen model pair;
# delegation is asynchronous (start/status/wait); first use is adoption-first with a
# latency probe (contract/protocol.md step 4).
subagents: []

# The tau environment arrives as MCP tools. `include: ["*"]` takes whatever the bridge
# advertises; the bridge is what pins that set, by asserting its catalog against
# benchmark_lock.yaml before the first episode runs.
#
# Pi may issue several tool calls in one assistant turn. The bridge serializes them so each
# becomes exactly one tau turn — done there rather than with a recipe `session` setting,
# which the vendored checker also rejects.
mcp:
  mode: tools
  servers:
    tau:
      include:
        - "*"
