  flow as t0 already does unprompted. NO flip is predicted with confidence — t0 shows that not
  transferring is insufficient to pass a 20-action task — so this prediction is about behaviour,
  and the check in batch_03 is the transfer turn index, not the reward. Secondary: the
  mid-conversation transfers on task_096 and task_028 should be LEFT ALONE, since they follow
