    user turn after a single KB search — 8 messages each, reason fraud_or_security_concern,
    against 20 gold actions — with no identity verification and no attempt. At H0 this was
    3/3 identical. The discriminating fact is inside the same round: t0, under the same
    harness on the same task, worked for 62 messages and 5 KB searches before transferring,
    so the behaviour is not forced by the task or the user simulator. The frozen policy
    already fixes a countable threshold ("If the user asks for a human agent 4 times, then
    you may invoke the transfer_to_human_agents tool"); the agent fires at request 1. This is
    the target of this generation.
