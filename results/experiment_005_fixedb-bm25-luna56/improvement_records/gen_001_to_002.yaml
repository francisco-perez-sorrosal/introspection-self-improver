counterevidence: >-
  Four arguments against this mutation, recorded rather than resolved.

  (1) The standing counterevidence against ANY transfer mutation is strong and specific. Seq 4
  (prior experiment, prose context only) spent three of five generations on transfer guidance
  and each correction created its mirror image — gen-002 forbade a policy-REQUIRED transfer,
  gen-003 licensed a policy-FORBIDDEN one, gen-005 deleted the guidance and deferred to the
  policy. That is the single best-evidenced failure pattern in this project's history, and this
  mutation is in its blast radius. Two structural guards were chosen against it: the threshold
  stays the policy's (this rule states no condition of its own, so it cannot contradict the
  policy), and the rule is scoped to the case where the CUSTOMER asks, saying nothing about
  agent-initiated transfer on inability. Whether those guards hold is the thing being tested.

  (2) The pre-registered falsifier is a task this experiment currently passes. task_014's gold
  IS a transfer (reason unconfirmed_external_communication), triggered by an unverifiable
  customer claim rather than by repeated requests. It should be out of scope by construction —
  but if task_014 regresses from 1/3 in batch_03, this mutation over-reached in exactly seq 4's
  way, and that reading is committed to in advance.

  (3) Not transferring is demonstrably not sufficient to pass. task_082 t0 already declined to
  capitulate, worked for 62 messages and 5 searches, and still scored 0.0 against 20 gold
  actions. So the honest expected effect on the batch number is small, and the prediction is
  about behaviour rather than score. A reader who scores this mutation by whether task_082
  flips will mis-grade it.

  (4) A higher-value target was left unconsumed for want of a slot. task_072 is one field from
  passing and has been twice, in different fields; task_070's denied prediction is the clearest
  known limit of gen-001. Both were ranked below this one because neither is as deterministic
  or as cleanly falsifiable, but with G=2 the choice forecloses them. The backlog records T3
  as never reachable under this freeze.
hypothesis: >-
  The agent treats a customer's stated request for a human as an instruction to execute rather
  than as one input to a rule the policy already specifies. The evidence for it being a
  *reading* failure rather than a capability limit is inside the round: the same harness, on
  the same task, both capitulated at turn one (t1, t2) and worked the task for 62 messages
  before transferring (t0) — so the behaviour is available, and what is missing is the
  discipline that decides between them. If the harness names the request as something to be
  counted, and delegates the threshold to the policy that already fixes it at four, then the
  first request should stop terminating episodes and the agent should stay on the work.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — the discipline applied
  to a policy rule, not the rule itself. The frozen <policy> region is untouched and make check
  asserts it byte-for-byte (5733 chars). This is deliberately the narrowest possible foothold in
  contested territory: the mutation supplies counting, and the policy supplies every condition
  and the threshold.
proposed_change: >-
  Add one rule to the <instructions> block: when the customer asks to be handed to a human,
  treat that as a request to be counted, not as an instruction to follow; the policy states how
  many such requests change the answer, so apply that count rather than acting on the first one,
  and keep doing the work the knowledge base gives you until the count is reached. It states no
  condition of its own and names no threshold of its own.
