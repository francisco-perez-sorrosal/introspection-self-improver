    DB difference. Recorded as a finding and explicitly NOT approved as a target: the
    only lever that reliably helps is matching a default string, which is grader-gaming
    against a frozen evaluator rather than a capability improvement.
  prevalence: 1/8
counterevidence: >-
  Three arguments against this hypothesis and this choice of target, all recorded rather
  than resolved.

  (1) The strongest single witness is partly self-undermining. task_014's passing trial
  (t1, reward 1.0) did NOT retrieve doc_..._042 either — it supplied the correct reason
  code without reading the source. So grounding is demonstrably not NECESSARY for a
  correct value on that task; priors sometimes land it. The claim this record makes is
  the weaker and survivable one: ungrounded selection is unreliable, and the batch shows
  its unreliability directly (task_070's three trials produced three different account
  classes under one frozen configuration). It is not a claim that grounding is the only
  path to a correct argument.

  (2) A higher-prevalence mode was passed over. Premature transfer covers 9/24 episodes
  against this mechanism's task-level 6/8, and task_082's 3/3 determinism makes it the
  most reliably measurable intervention available. It was not chosen because seq 4 (prior
  experiment, prose context only) spent three of five generations on transfer guidance
  and each correction created its mirror image — gen-002 forbade a policy-REQUIRED
  transfer, gen-003 licensed a policy-FORBIDDEN one, gen-005 deleted the guidance and
  deferred to the policy — because harness prose competed with a frozen policy that
  already covers the case unambiguously ("only if you absolutely have to, and you are
  sure that there are no potential actions you can take"). That is standing
  counterevidence against the slot-2 candidate, not against this one, and it is why the
  ranking is what it is.

  (3) This mutation's own predicted cost. Instructing the agent to search for the
  deciding rule as well as the subject can push episodes toward unbounded search: task_070
  t0 already issued 11 KB searches and never acted at all. The mutation deliberately adds
  no stopping or verification gate — seq 4's gen-002 added exactly such a check and it
  blocked determinate actions — but that leaves the abandonment risk unmitigated by
  design. If abandonment or transfer prevalence RISES in batch_02, that is this
  mutation's cost and must be read as such rather than attributed elsewhere.
hypothesis: >-
  The agent treats a state-changing tool call's arguments as something to be inferred
  from the conversation rather than resolved from a source. It grounds the customer's
  subject matter (KB searches are numerous, specific and on-topic) but then selects the
  code, category, account class or corrected amount by which option best matches the
  customer's words — reading "ATM fee rebates" and choosing credit_type "rebate_credit"
  where the tool's stated criterion is "incorrect fee charges", or comparing account
  attributes at length while never asking which promotion is in force. If the harness
  makes argument resolution an explicit act with a named source — the unlocked tool's own
  parameter description for a documented argument, a KB query aimed at the deciding rule
  when the bank owns the value — then arguments whose defining source is reachable should
  be filled correctly more often, and the trial-to-trial instability in the chosen value
  should fall.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — retrieval USAGE
  (what a query is aimed at) plus tool-contract reading (using the parameter
  documentation returned by unlock). Both are explicitly mutable surface. The frozen
  <policy> region is untouched and make check asserts it byte-for-byte (5733 chars); the
  frozen bm25 retrieval backend and the graded tool set are untouched. This mechanism was
  chosen partly BECAUSE it does not compete with the frozen policy, which is the failure
  pattern seq 4 recorded three times.
proposed_change: >-
  Add one rule to the <instructions> block: when a tool call changes state, every argument
  the agent had to choose — a code, a category, an account class, a corrected amount —
  comes from a source it actually read. Two clauses: if the tool documents the argument,
  re-read that parameter description from the unlock response and choose by the criterion
  it states rather than by which option's name most resembles the customer's words; if
  the bank decides the value (which product to open, which reason code applies, which of
  several competing rules is currently in force), search the knowledge base for that
  decision itself, not only for the customer's topic. It closes with "Search for the
  deciding rule as well as the subject, then act on what you found" — deliberately
  non-blocking, adding no stopping or verification gate.
