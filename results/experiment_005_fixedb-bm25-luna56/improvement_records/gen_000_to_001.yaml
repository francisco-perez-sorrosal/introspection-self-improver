expected_effect: >-
  Direction: fewer write calls carrying a wrong chosen value, and less trial-to-trial
  variance in that value. Mechanism per task, so each is falsifiable separately.
  task_072 is the strongest prediction — the docstring criterion ("incorrect fee charges")
  matches the task, both amounts are already correct in 2/3, and credit_type is the sole
  remaining error; if any task flips it should be this one. task_014: a query aimed at the
  reason-code list should reach doc_..._042 and yield unconfirmed_external_communication
  rather than the adjacent kb_search_unsuccessful_customer_requests_transfer. task_070: a
  query aimed at the deciding rule should surface both promotions and the active-date test,
  and the three trials should converge rather than producing three different classes.
  task_065, task_096 and task_026 may benefit, but their values also require multi-step
  computation, so no flip is predicted there. No prediction is made for task_082 or
  task_028, whose failures are the untargeted transfer and invented-tool-name modes.
  No number is predicted. Measured by batch_02 — the sanctioned within-batch verification
  under batch_mode fixed — and by the hidden held-out round for H1; batch_02's read will
  be of a set the loop has now been tuned on, and must say so.
