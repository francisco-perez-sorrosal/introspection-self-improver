- description: >-
    A volunteered OPTIONAL argument mutates DB state and breaks db_match on an otherwise
    gold-identical trial. task_065 t2 issued exactly the three gold write calls with the
    correct account classes (Evergreen checking, Green savings, close chk_rp65a7b3c4) and
