signals:
- description: >-
    A write-call argument the agent had to CHOOSE is filled from its priors rather than
    from the source that defines it, while the customer's subject matter is grounded
    competently. Sharpest instance: task_072 supplies credit_type "rebate_credit" where
    gold is "fee_refund" in all three trials, with BOTH credit amounts correct in 2/3 —
    the criterion ('rebate_credit' for missing rebates, 'fee_refund' for incorrect fee
    charges) is in the tool's own docstring, delivered in the unlock response the agent
    had already received, and the tool writes "type": credit_type into the DB, so the
    wrong enum breaks db_match by itself. task_070 opened Hunter Green (t1), Cobalt Blue
    (t2) and nothing at all (t0) where gold is Sky Blue, and zero of its 28 KB queries
    across three trials contain the word "promotion" although which of two promotions is
    currently active is the task's entire decision rule. task_014 used the wrong reason
    code in 2/3; doc_bank_accounts_bank_accounts_(general)_042 carries the tier list and
    was retrieved in 0/3 trials INCLUDING the one that scored 1.0 — the passing trial
    guessed. Also task_065 (wrong account_class 2/3), task_096 (amount 7.5 vs 15.00,
    expected_apy 6.7 vs 6.85) and task_026 (wrong new_rewards_earned values).
  prevalence: 6/8
- description: >-
    Transfers to a human while actionable work remains — transfer_to_human_agents appears
    in no DB-basis task's gold. task_082 is the extreme and the most reproducible cell in
    the batch: the user's opening line asks for a human, and the agent transfers on turn
    one after a single KB search, with no identity verification and no attempt,
    identically in all three trials (8 messages each) against 20 gold actions. Also
