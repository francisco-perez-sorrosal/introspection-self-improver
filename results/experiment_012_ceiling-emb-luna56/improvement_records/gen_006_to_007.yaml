changes:
- mechanism: >-
    Remove C11 in full. Its adoption clause confirmed and its mechanism clause was denied, its
    cost falsifier fired, and the round it landed in fell 7.2 pp with every stratum down.
  surface: revert
  evidence: >-
    1515 pi_local_calls across 77 of 78 episodes with the sole-cause counter flat at 8;
    messages per episode 39.26 -> 43.43 against a stated ceiling of 43; round 41.0% -> 33.8%;
    endpoint test against the pooled baseline now negative at -0.333 (p = 0.6593). Decisive
    conversations for the mechanism's persistence under the tool: task_056
    (01a01834-d39b-71c2-97a1-7d982dda9128) and task_002
    (01a0182f-6dd9-71a4-b258-2ee0cb134cbb). Backlog target T1.
  expected_effect: >-
    DELTA against batch_07, measured by batch_08 (the endpoint round, consumed by no
    transition): messages per episode falls below 41.5, KB_search per episode below 8.0, and
    the round total recovers above 36%. THE NULL BRANCH IS THE INFORMATIVE ONE AND IS STATED
    FIRST: if the round does not recover, C11 did not cause the fall, the attribution in this
    record is wrong, and the collapse belongs to accumulated instruction growth or to variance
    the identity pair under-measured.
  risk: >-
    Removing a tool the model called 1515 times could itself disturb behaviour beyond undoing
    C11 — the harness the model met in batch_08 differs from batch_06's by more than the
    absence of one tool if the agent had reorganised around it. Watched by the same counters:
    a recovery to within a cell or two of batch_06's 32/78 supports the attribution, while
    landing well below batch_06 says the removal did its own damage.
