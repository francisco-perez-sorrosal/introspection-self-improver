    on the same CALL as C1; C1's prose is gone as of this transition, so the collision is too.
  prevalence: 8 tasks / 12 failing episodes in batch_03; task_046 0 of 9 lifetime on the gold tool
- description: >-
    T1's REMAINDER IS ISOLATED. The wrong-named-class mechanism is still the largest sole
    cause in the round at 8 episodes / 5 tasks (task_001, task_003, task_006, task_023,
    task_058) even though C3's retrieval counter moved and its stratum moved with it.
    Retrieving more was necessary and is not sufficient — which is precisely the evidence
    gen-002's record said it would wait for before landing C3's second half.
  prevalence: sole cause in 8 episodes / 5 tasks, the largest single mechanism in batch_03
counterevidence: >-
  FIVE OBJECTIONS. (1) C4 IS NOT A CLEAN SURFACE EXPERIMENT, and the record should not
  pretend otherwise. The content is near-identical to C1's but not identical: the hook names
  THIS tool's actual parameters and drops the "unless the customer's request calls for it"
  clause. So a positive result is consistent with either "structure beats prose" or "the
  escape clause was the whole problem", and the two cannot be separated by this round. What
  it CAN settle is the negative: if the counter stays at 9 with the parameters named
  explicitly at the point of use and no alternative licensed, then the surface is not the
  axis and the content is. Stated now so a positive result is not over-claimed later.
  (2) C3's HEADROOM MOVEMENT IS THREE CELLS. The A/A pair measured zero movement in that
  stratum, which is what makes three cells interesting, but a stratum that has never moved
  has also never had its variance estimated — "zero movement twice" bounds it loosely, not
  tightly. The claim made is that this is the strongest signal available, not that it is
  significant. (3) THE ANCHORS FELL over the same step, 7/9 -> 5/9, while the headroom rose.
  Neither movement is outside what the identity pair produced on no change at all, and
  reading the rise while ignoring the fall would be exactly the selective reading the noise
  floor exists to prevent. (4) C6 IS THE CHANGE THIS PROJECT'S OWN HISTORY ARGUES AGAINST.
  Five measurements say an instruction does not inherit the scope its author reasoned about,
  and the ceiling probe reproduced that lesson INSIDE a harness written by someone who knew
  it, regressing five tasks H0 passes with two of them stopping early. C6 is landed anyway
  because its evidence is verbatim self-report from two transcripts and because it is worded
  as a completed-state check rather than a missing-precondition bar — the variant measured
  safe — but the objection is real and the safety falsifier is written to fire before its
  own counter does. (5) THE ROUND TOTAL IS NOT EVIDENCE. 29/78 against a pooled 54/154 is
  +2.1 pp, and the identity pair moved +2.6 pp on a byte-identical harness. No claim in this
  record rests on the round total.
hypothesis: >-
  Two of gen-002's three changes worked at the counter level and one did not, and the one
  that did not is the one whose rule had a licensed alternative attached to it. So this set
  tests the two live explanations for C1's failure at once — surface (C4 moves the identical
  rule to a hook that names the concrete parameters at the point of use) and sufficiency
  (C6 adds the half of the retrieval mechanism that gen-002 deliberately withheld, now that
  the first half has moved its counter and its stratum but left the mechanism the largest
  in the round) — while C5 consumes the target that the previous set had to hold back for
  collision reasons that no longer apply.
owning_layer: >-
  extension-hook (C4, the first structural mutation of this experiment) and instructions
  (C5, C6). This DISCHARGES the D29 surface-concentration ladder that gen-002's three
  instruction mutations armed: the set includes a change on a class this experiment had not
  exercised. The project-scope ledger is now complete — every surface class this repo can
  name has been exercised in a graded round or measured by probe, with sub-agent's
  step-4b probe (generation_000/subagent_probe/) recording a surface_exhausted verdict for
  every retrieval-shaped target, since a child cannot reach tau's tools at all.
proposed_change: >-
  Three changes on different steps: C4 on the argument payload of a call (delivered
  structurally), C5 on which tool is unlocked and called, C6 on whether a named candidate is
  committed to before its stated requirements are covered. C4 and C5 share tasks task_060 and
  task_061 but act on different fields of the call with independently measurable counters
  (the optional-key count versus the gold-tool-unlocked count); C6 shares tasks with C5 on
  task_055 and task_056 and acts on the product-class choice rather than the tool choice.
  The interaction rule is satisfied on the "different steps" limb rather than the "different
  tasks" limb, and that is stated rather than assumed.
schema_version: 4
changes:
- mechanism: >-
    Deliver the required-arguments rule as a tool_result hook that names the unlocked tool's
    own required and optional parameters, parsed from the unlock text tau just returned, at
    the moment the agent reads it and with no licensed alternative attached. The rule is
    C1's; only the delivery changes.
  surface: extension-hook
  evidence: >-
    C1's counter flat at 9 episodes / 10 calls across batch_01, batch_02 and batch_03 —
    two rounds without the instruction and one with it. Decisive conversation for the
    underlying defect: 01a0170c-15cf-7408-bca7-256d6a226fac (task_060 t0). Backlog target T2.
  expected_effect: >-
    DELTA against batch_03: close_bank_account_7392 calls carrying either optional key fall
    from 9 episodes / 10 calls to <= 3 episodes in batch_04. Reward is NOT predicted — the
    three target tasks carry other defects too (task_061 and task_065 are multi-mechanism in
    every round), so a cell there is possible but not the test. The injected text was verified
    present in a fetched session before this prediction was written, per the standing rule
    that a preflight verifies a change runs and never that it works.
  risk: >-
    (a) The hook fires on every unlock, including tools whose optional parameters gold DOES
    carry, so it could suppress a legitimately-needed argument — watched as a delta on gold
    actions classified ABSENT, which must not rise from 12 by 4 or more. (b) It adds text to
    every unlock result, which costs context on tasks that unlock many tools — watched on
    messages per episode, which must not rise above 44 from 40.18.
  adoption_stage: false
  host_facts:
  - fact: >-
      tool_result fires for every tau tool and the tool name arrives MANGLED as
      mcp_tau_<tau name>_<hash>, so a handler must match on a substring and never on equality
    probe_evidence: results/experiment_008_stratb-bm25-luna56/generation_001/context_probe/hook_firings.json
  - fact: >-
      event.content is an ARRAY of {type:"text"} blocks, and a returned content patch reaches
      the model while appearing zero times in tau's graded trajectory
    probe_evidence: results/experiment_012_ceiling-emb-luna56/generation_002/g003_preflight/
  - fact: >-
      a handler runtime error is logged and swallowed rather than raised, so the handler
      returns undefined on any shape it does not recognise instead of throwing
    probe_evidence: results/experiment_012_ceiling-emb-luna56/generation_002/g003_preflight/
  commit: 4baaa25
- mechanism: >-
    Unlock and call the tool the retrieved procedure document names for an operation, rather
    than substituting one whose name resembles the operation.
  surface: instructions
  evidence: >-
    8 tasks / 12 failing episodes in batch_03; task_046 deterministic at 3/3 this round and
    0 of 9 lifetime ever unlocking the gold tool (conv
    01a01706-963b-77ad-9878-efcb9e85fadf, where the agent unlocked
    get_all_user_accounts_by_user_id_3847, pay_credit_card_from_checking_9182 and
    get_closure_reason_history_8293 instead of get_user_dispute_history_7291). Backlog
    target T3.
  expected_effect: >-
    DELTA against batch_03: failing episodes in which a gold discoverable-tool name was never
    unlocked or called fall from 12 to <= 7, AND task_046 unlocks the tool gold requires in at
    least 1 of 3 trials against 0 of 9 across the three rounds so far. The second clause is
    the sharper of the two because task_046 has never once done it.
  risk: >-
    The agent reads "the tool the procedure names" as licence to unlock more tools
    speculatively, spending steps. Watched on tool calls per episode, which must not rise
    above 15 from 13.21.
  adoption_stage: false
  clauses:
  - clause: >-
      When a procedure document names the tool to use for an operation, unlock and call that
      tool.
    adversarial_reading: >-
      "When a procedure document names the tool" is a precondition the model can decline to
      find satisfied — if it has not retrieved a document that names a tool, the sentence is
      vacuous and it proceeds exactly as before, which is the failure mode on every task
      where the procedure was never retrieved in the first place.
    falsifier: >-
      The never-unlocked-gold-tool count fails to fall from 12 by 5 or more while KB_search
      per episode is unchanged — the shape of a sentence that never found its precondition.
  - clause: Do not substitute a tool whose name resembles the operation.
    adversarial_reading: >-
      Read as a prohibition on using any plausibly-named tool, it suppresses the legitimate
      exploratory unlocks by which the agent discovers what exists, and the agent stalls or
      escalates instead.
    falsifier: >-
      unlock calls per episode fall while gold actions classified ABSENT rise by 4 or more
      from 12, or transfer episodes rise by 4 or more from 21.
  commit: faf489a
- mechanism: >-
    Before naming one of the bank's named products or account classes to the customer or
    sending it to a tool, check that a document covering each requirement the customer stated
    for it has been retrieved, and search for it if one is missing. This is C3's second half,
    withheld at gen-002 pending evidence that the retrieval half alone is insufficient.
  surface: instructions
  evidence: >-
    Verbatim self-report in two transcripts read in full at g=0: task_002 wrote "if we're
    looking for a card with the highest overall flat rate and no subscription, the available
    data is insufficient. So, I'll recommend the EcoCard" (conv
    01a01695-c9df-75aa-99c2-bf4ec23d82f8, batch_01; the task's batch_03 conversation is
    01a01703-2e1a-7696-a718-244a377e1109), and task_056 wrote "ATM rebates are unclear... I
    might only recommend Hunter Green conditionally" before recommending it unconditionally
    (conv 01a0169b-6d5c-7222-b82f-ee9c5b311920, batch_01; 01a01708-4998-7718-8bd0-2a2576330aa3
    in batch_03). The sufficiency evidence gen-002 required: C3 moved its retrieval counter
    and its stratum, and the mechanism is STILL the largest sole cause in batch_03 at 8
    episodes / 5 tasks. Backlog target T1.
  expected_effect: >-
    DELTA against batch_03: wrong-named-class sole-cause episodes fall from 8 to <= 4.
  risk: >-
    THE NAMED HAZARD OF THIS EXPERIMENT. An instruction about a precondition can be read as a
    bar on acting, and the ceiling probe's own expert harness regressed five tasks H0 passes,
    two of them by stopping early. Mitigated by wording it as a completed-state check with a
    SEARCH as its remedy rather than a stop; the residual risk is watched by a safety
    falsifier that fires before the change's own counter is consulted.
  adoption_stage: false
  clauses:
  - clause: >-
      Before you name one of those products or account classes to the customer or send it to
      a tool, check that you have retrieved a document covering each requirement the customer
      stated for it.
    adversarial_reading: >-
      Read as a bar rather than a check, the agent declines to name any option until it
      believes coverage is complete, and since coverage is never provably complete it stalls,
      asks the customer more questions, or escalates — the exact regression the ceiling probe
      measured.
    falsifier: >-
      SAFETY FALSIFIER, scored before the change's own counter: gold actions classified ABSENT
      rise from 12 by 4 or more, OR transfer episodes rise from 21 by 4 or more. Either fires
      and this change is the revert candidate regardless of its wrong-named-class count.
  - clause: If one is still missing, search for it.
    adversarial_reading: >-
      An unbounded remedy: "search for it" licenses arbitrarily many further searches, which
      is the cost blowout a prior experiment reverted a change for.
    falsifier: >-
      KB_search per episode rises above 7.5 from 6.28, or messages per episode above 44 from
      40.18.
  commit: cf2c13d
