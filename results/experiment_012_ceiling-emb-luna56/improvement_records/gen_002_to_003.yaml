signals:
- description: >-
    C1's MECHANISM IS DENIED, on the cleanest counter this batch has. Calls to
    close_bank_account_7392 carrying the optional `reason` / `waive_early_closure_fee` keys
    stood at 9 episodes / 10 calls in batch_01, 9 / 10 in batch_02 and 9 / 10 in batch_03 —
    three rounds, two of them BEFORE the instruction existed and one after, identical to the
    call. The change moved nothing anywhere it could fire. Its pre-registered clause-1
    adversarial reading is exactly what happened and is now measured rather than
    hypothesised: the customer states a motive for closing the account, so "send it only if
    the customer's request calls for it" reads as permission rather than restriction. This
    is a mechanism denial, not merely a denied prediction.
  prevalence: 9 episodes / 10 calls in each of three consecutive rounds, 3 tasks
- description: >-
    C2 IS CONFIRMED ON BOTH HALVES OF ITS PREDICTION, and independently corroborated.
    Round-wide catch-all `reason` calls on transfer_to_human_agents fell 7 -> 3 against a
    predicted <= 3, specific-member calls rose 14 -> 21, and transfer episodes rose 19 -> 21
    rather than falling — the change sharpened the code without suppressing the transfer,
    which is what the paired prediction was written to distinguish. The independent
    corroboration is that the sole-cause enumeration, computed by different code from the
    counter, moved with it: REASON-only failing episodes 5 -> 2 and the task count 3 -> 1.
  prevalence: catch-all calls 7 -> 3 round-wide; sole-cause REASON episodes 5 -> 2, tasks 3 -> 1
- description: >-
    C3 IS DIRECTIONAL AND ITS COST FALSIFIERS DID NOT FIRE, but it fell 0.04 short of its own
    stated threshold and is recorded that way rather than rounded up. Distinct KB documents
    per episode 32.94 -> 35.90, a rise of 2.96 against a predicted "at least 3". KB_search
    per episode 6.09 -> 6.28 against a 7.3 ceiling; messages per episode 37.79 -> 40.18
    against a 41.6 ceiling; gold actions classified ABSENT 12 -> 12, so the clause-2
    "an agent that stopped looking" falsifier did not fire either. The prior experiment's
    cost blowout (+31% KB_search) did NOT reproduce here at +3.1%.
  prevalence: distinct KB docs/episode +2.96 round-wide; KB_search +3.1%, messages +6.3%
- description: >-
    THE ZERO-NOISE STRATUM MOVED FOR THE FIRST TIME, and it moved on C3's tasks. Headroom ran
    3/33 in batch_01 and 3/33 in batch_02 — zero movement across the byte-identical A/A pair,
    8 of its 11 tasks at 0/3 twice — and reached 6/33 in batch_03. The three movers are
