    diagnosed C3 in the first place. This is the strongest reward-level signal the experiment
    has produced, and it is confined to the one stratum where the A/A pair measured no
    ambient movement at all. Stated with its limit: three cells is three cells, the anchors
    fell 7/9 -> 5/9 over the same step, and the round total moved +2.1 pp against a pooled
    baseline — which is inside what the identity pair moved on no change whatsoever.
  prevalence: headroom 3/33, 3/33, 6/33 across the three rounds; movers task_002, task_055, task_056
- description: >-
    T3 REPRODUCES AND WIDENS, and now clears the three-task bar decisively. Counting every
    failing episode in which a gold discoverable-tool name was never unlocked or called, the
    mechanism reaches 8 tasks and 12 episodes in batch_03 (task_015, task_046, task_055,
