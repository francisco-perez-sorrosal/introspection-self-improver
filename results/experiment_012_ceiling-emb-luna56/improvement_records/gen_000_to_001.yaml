  IDENTITY round (lock protocol.identity_generations [1]): H1 = H0 byte-for-byte, batch_02 is
  the A/A measurement that fixes this experiment's own noise floor before any attribution bar
  is applied, and its episodes pool with batch_01 into the primary's baseline (2 x num_trials
  per task). The four targets above are opened, ranked and left pending; the first mutation
  set is composed against batch_02, not against this round.
