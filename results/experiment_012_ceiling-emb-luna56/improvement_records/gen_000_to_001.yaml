  summary: >-
    BATCH HEALTH FIRST. batch_01 ran 78 platform episodes (26 tasks x 3 trials) against
    recipe commit c23d6d2 (arm_sha_ok on every completed row; recipe byte-identical to
    h0-baseline, verified by `make reset_h0` before the round). All four sandbox seam
