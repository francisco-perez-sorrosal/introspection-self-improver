    reaching for a catch-all where a member naming the actual situation exists.
  prevalence: sole miss-mechanism in 5 episodes across 3 tasks (task_004, task_008, task_014)
- description: >-
    T5 — the procedure stops before the customer's later requests (gold actions ABSENT).
    Heterogeneous and HELD rather than consumed: the shape overlaps T1 (an agent that cannot
    resolve a value stalls and escalates), and a prior experiment measured over-escalation
    unmoved by all eight of its mutations. Re-ranked against batch_02, which measures the same
    harness and will say which of these cells are noise.
  prevalence: sole miss-mechanism in 8 episodes across 7 tasks
counterevidence: >-
  THREE OBJECTIONS, recorded so they can be judged rather than assumed. (1) THE H-EXPERT
  COINCIDENCE, declared under the launch directive's rule. Phase 0's hand-built ceiling
  harness — built with full access to these tasks and readable as batch-side evidence —
  converged on "for a choice among bank-defined named options retrieve the full candidate list
  and the per-candidate attributes the customer's requirements refer to". T1 as derived here
  from batch_01's own transcripts overlaps that. Nothing was ported: the derivation ran from
  the four-searches-same-documents pattern and the two verbatim self-reports of unresolved
  attributes, neither of which is in the H-expert source. The overlap is recorded rather than
  hidden, and it cuts BOTH ways — it corroborates the mechanism, and it warns that the ceiling
  harness carrying this same idea REGRESSED five tasks H0 passes. (2) THE NULL RESULT THIS
  BATCH IS SILENT ON. A prior experiment landed a per-candidate-search instruction, confirmed
  its retrieval counter once, paid +31% KB_search against a +20% threshold, and reverted it.
  This batch cannot distinguish "the mechanism is right and the delivery was wrong" from "the
  mechanism does not pay". Any T1 landing must pre-register a KB_search-per-episode DELTA
  falsifier, never a level. (3) THE ANCHOR STRATUM IS WEAKER THAN THE FREEZE ASSUMED. Phase 0
  measured all three anchors 3/3 on the LOCAL lane; this platform round returns task_006 2/3,
  task_032 2/3 and task_063 0/3. task_063 moving three cells exceeds every measured noise
  floor, so the usable regression channel is task_006 + task_032 (five of six cells) plus
  task_005 and task_037, which both ran 3/3 here. Every later change's falsifier names those
  four instead of the frozen anchor list.
hypothesis: >-
