    never opened the account, dropping the additive half of the request. Filed separately from
    T1 rather than merged: if a T1 change moves these tasks too the mechanism generalizes
    across catalogues, and if it moves only the product classes it does not.
  prevalence: >-
    sole miss-mechanism in 5 episodes across 3 tasks (task_046, task_063, task_094);
    agent_tool_name differs in 9 episodes across 5 tasks counting multi-mechanism episodes
- description: >-
    T4 — a generic catch-all enum member is chosen where a specific one applies. All three
    tasks grade on ACTION with compare_args ["reason"], so the transfer is right and only the
    code is wrong, and each passes on at least one trial, so the value is resolvable. task_004
    gold account_ownership_dispute, agent customer_requests_human_no_specific_reason (t0, t1);
    task_008 gold customer_demands_after_unavailable_offer_refusal, agent
