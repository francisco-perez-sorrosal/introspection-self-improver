    weather, not investigated per standing guidance. run.py refuses to resume a closed
    round, so the loss is accepted and recorded rather than topped up; task_003 carries
    2 graded trials here and the endpoint test handles unequal per-task n by construction.
    77 episodes graded. GRADED READ, visible by design: 26/78 (33.3%), mean per-task rate
    33.3% — Phase 0 measured H0 on this exact batch at 32.1%, so no D8 viability read
    fires (neither 0/78 nor 78/78). Provenance of every action verdict:
    generation_000/batch_01/graded/updated_results.json, read through scripts/gold_diff.py's
    NORMALIZED three-way comparison (MATCH 197 / ARGS 94 / ABSENT 26), never through tau's
    raw miss list. The observation harvest was not attempted: this batch is a complete
    census (78 enumerated episodes), where the full-population transcript read is the
    stronger evidence tier. READ DEPTH, with reasons: all 26 tasks read at the graded-action
    level; five conversations exported in full via `introspection conversations get
    --format trajectory` because the decisive evidence is a sentence the agent wrote about
    its own uncertainty, which no action verdict can carry. NO PREFLIGHTS were run — this
    transition lands no change.
signals:
- description: >-
    T1 — a bank-defined named option (card_type / account_class / account_type) is committed
    to before the attribute that selects it has been retrieved. The agent searches by INTENT,
    which under openai_embeddings returns substantially the same high-scoring documents on
    every re-ask, and it commits while a requirement-relevant per-candidate attribute is still
    unretrieved. DECISIVE: task_002 conv 01a01695-c9df-75aa-99c2-bf4ec23d82f8 issued four
    KB_search calls, got doc_credit_cards_gold_rewards_card_001 back at rank 1 in three of
    them, held the complete eight-card catalogue by name in context (the Diamond Elite APY
    table), never retrieved the Platinum document, and wrote in its own reasoning "the
    available data is insufficient. So, I'll recommend the EcoCard". task_056 conv
    01a0169b-6d5c-7222-b82f-ee9c5b311920 retrieved an ACTIVE promotion notice governing
    business-checking recommendation order and never applied it, named Cobalt Blue in its own
    candidate prose without retrieving that candidate's document, and wrote "ATM rebates are
    unclear" before recommending unconditionally. Direction reverses across tasks (task_002
    should be Platinum and chose EcoCard; task_058 should be EcoCard and chose Gold), so this
    is not a product bias. SUPPORTING but NOT decisive: task_055's wrong downstream account_id
    and task_056's wrong destination_account_id are this mechanism's symptom one step later,
    counted on the mechanism rather than the symptom.
  prevalence: >-
    sole miss-mechanism in 11/78 episodes across 6 tasks (task_001 task_002 task_003 task_023
    task_024 task_058); implicated in 21 of the 51 failing graded episodes across 10 tasks
- description: >-
    T2 — the agent volunteers optional arguments the gold call does not carry. Gold calls
    close_bank_account_7392 with account_id alone; the agent adds `reason` and
    `waive_early_closure_fee`, which the customer never asked for. Because a discoverable
    tool's payload is compared as a whole nested object, the extra keys are a miss. DECISIVE:
    task_060 t0 conv 01a0169d-52d0-758d-a38e-f61349d3697a performed the unlock and opened the
    correct "Silver Plus Account", and the two volunteered arguments are its ONLY remaining
    defect against gold. 8 of 9 instances add both keys, one adds `reason` alone.
  prevalence: 9/9 episodes across 3 tasks (task_060, task_061, task_065) — fully deterministic
- description: >-
    T3 — the wrong member of the discoverable-tool catalogue is unlocked and called. task_046
    conv 01a016a4-885f-7503-b524-69c420d77e12: gold unlocks and calls
    get_user_dispute_history_7291; the agent unlocked get_all_user_accounts_by_user_id_3847,
