signals:
- description: >-
    C8's ADOPTION PREDICTION IS MASSIVELY CONFIRMED, and it is the second time this project
    has put a Pi-local surface into a graded round. pi_local_calls went from 0 across all 312
    platform episodes of this experiment to 578 in one round, in 76 of 78 episodes and on all
    26 tasks, against a prediction of >= 20 on >= 6 tasks. Arguments well formed, zero
    max_steps terminations, no episode near the frozen 600 s timeout, and zero occurrences of
    track_requests in tau's graded trajectory. Its per-episode distribution runs 0 to 22
    (conv 01a017b0-8dc7-7789-a06d-724f4e5733e1 is the heaviest at 21). THE REWARD PREDICTION
    IS DEFERRED TO batch_06 BY DESIGN and is not read here — adoption is not improvement, and
    a prior experiment's first tool was adopted enthusiastically and moved no reward.
  prevalence: 578 calls across 76 of 78 episodes and all 26 tasks, from a lifetime base of 0
- description: >-
    C7 IS CONFIRMED ON ONE HALF AND MISSED THE OTHER BY 0.05, reported as missed rather than
    rounded. Messages per episode 42.78 -> 41.21 against a predicted < 41.5: confirmed.
    KB_search per episode 7.58 -> 7.05 against a predicted < 7.0: missed. Both fell, so C6
    WAS a cost driver and the +20.7% attributed to it at gen-004 is substantially confirmed;
    the residual above 7.0 is consistent with C3 and C9's retrieval instructions carrying
    part of the level.
  prevalence: KB_search 7.58 -> 7.05; messages 42.78 -> 41.21
- description: >-
    THE FUTILITY DECLARATION MADE AT gen-004 IS REFUTED BY THE VERY NEXT ROUND, and this is a
    process finding worth more than the arithmetic that produced it. At gen-004 the
    accumulated delta was +3.9 pp, the gap 7.5 pp, the largest single-generation gain 1.8 pp
    and four slots remained: 1.8 x 4 = 7.2 < 7.5, so the primary was declared dead on a
    margin of 0.3 pp. batch_05 moved the accumulated delta to +7.7 pp (34.6% -> 42.3%, sum of
    rate deltas +2.000, permutation p = 0.1112, CMH z = 1.386), which makes the largest
    single-generation gain 3.8 pp and the gap 3.7 pp against three remaining slots: 3.8 x 3 =
    11.4 >> 3.7. THE PRIMARY IS REACHABLE AGAIN. The lesson: a futility check computed from
    "the largest gain the experiment has actually produced" is unstable while the experiment
    has produced few gains, because the statistic it depends on is itself updated by the very
    round that would refute it. Declaring it out loud is what made the refutation visible.
  prevalence: gap 7.5 -> 3.7 pp; largest single-generation gain 1.8 -> 3.8 pp
- description: >-
    THE RISE IS DOMINATED BY THE NOISIEST STRATUM AND THE QUIET ONE FELL. Anchors 3/9 -> 7/9
    (+4 cells), marginals 19/35 -> 20/34, headroom 8/33 -> 6/33 (-2 cells). The A/A identity
    pair already moved the anchors 4/9 -> 7/9 on a byte-identical harness, so a +4 anchor
    swing is inside measured noise, while the headroom stratum — which moved zero cells
    across that same pair — went backwards. The round total is therefore the weakest evidence
    in the round and the per-change counters remain the attribution channel.
  prevalence: anchors +4 cells, headroom -2 cells, marginals +1 cell
- description: >-
    C5's TARGET MOVED MONOTONICALLY THE WRONG WAY FOR A SECOND ROUND, which meets the revert
    bar on both limbs. Failing episodes in which a gold discoverable-tool name was never
    unlocked or called: 12 before C5 landed, 14 after one round, 16 after two. task_046 is 0
