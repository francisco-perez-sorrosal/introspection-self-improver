    refuted MECHANISM rather than a refuted prediction, with witnesses from two rounds rather
    than one.
  prevalence: 12 -> 14 -> 16 failing episodes across 8 tasks
- description: >-
    SIX MEASUREMENTS NOW SEPARATE BY SHAPE RATHER THAN BY SURFACE, and this is the finding
    that composed C9. Confirmed or directional: C2, pick the enum member that names the
    situation; C3, search a candidate by its exact name. Both direct the model to make a
    POSITIVE CHOICE among alternatives already visible to it. Denied: C1 and C4, send only
    the required arguments (WITHHOLD) — denied through prose AND through a verified
    point-of-use structural injection; C5, use the tool the procedure names (a PRECONDITION
    the model can decline to find satisfied); C6, check coverage before committing (VERIFY).
    The axis that predicts success here is the shape of the demand, not the delivery surface.
  prevalence: 2 confirmed/directional and 4 denied, across 2 surfaces and 5 rounds
counterevidence: >-
  FOUR OBJECTIONS. (1) THE SHAPE HYPOTHESIS IS BUILT ON SIX POINTS AND FITS THEM AFTER THE
  FACT. It was not pre-registered; it is a post-hoc grouping of this experiment's own
  verdicts, and C9 is its first genuine out-of-sample test. If C9's counter moves, the
  hypothesis earns one prospective confirmation and no more than that. (2) C9 CARRIES THE
  EXACT ESCAPE HATCH THAT KILLED C5. "When the knowledge base states a rule" is a
  precondition the model can decline to find satisfied, which is the diagnosed cause of C5's
  vacuity. The defence — a selection rule is what the agent is already searching for when it
  faces a choice, unlike a tool-naming procedure it has no reason to seek — is an argument,
  and this experiment has watched arguments of that shape fail. Its falsifier is written to
  catch exactly this. (3) THE ROUND'S RISE IS NOT EVIDENCE FOR ANY CHANGE IN IT. +4 anchor
  cells against an A/A pair that moved 3 on nothing, with the quiet stratum falling 2. No
  claim here rests on the round total. (4) SPENDING THE LAST REVERT NOW IS A REAL COST. C10
  uses revert 2 of 2, so nothing gen-006 or gen-007 lands can be removed. The trade is
  accepted because C5 is measured denied across two rounds and carrying a known-inert
  sentence into the endpoint harness is itself a cost; the consequence is recorded so the
  final two sets are composed conservatively rather than discovering the constraint late.
hypothesis: >-
  The changes that have worked in this experiment share a shape rather than a surface: they
  direct the model to make a positive choice among alternatives already in front of it. The
  changes that have failed asked it to withhold, to verify, or rested on a precondition it
  can decline to find satisfied — and the withholding case failed identically through prose
  and through a verified structural injection, which rules out delivery as the explanation.
  C9 tests this prospectively on the second-largest remaining mechanism, and C10 removes the
  clearest instance of the failing shape from the harness.
owning_layer: >-
  instructions (C9) and revert (C10). Every surface class this repo can name has already been
  exercised in this experiment except a declared skill, which is measured inert on this seam,
  so no concentration obligation is outstanding. The surface choice for C9 is deliberate
  rather than default: C4 established that this defect family is not surface-limited, so the
  cheapest delivery is the correct one.
proposed_change: >-
  Two changes on disjoint mechanisms: C9 acts on which named option is chosen after retrieval,
  C10 removes an instruction about which tool to unlock. Their counters (wrong-named-class
  sole-cause episodes; never-unlocked-gold-tool episodes) are computed by different code paths
  and share no task where both are the sole cause. Neither touches C8, whose reward prediction
  comes due at batch_06 and must be scored without confounding — that is why this set is two
  changes rather than three.
schema_version: 4
changes:
- mechanism: >-
    Apply the selection rule the knowledge base states — a priority order, an eligibility
    condition, a tie-break — to the candidates already retrieved. The deciding rule is
    retrieved and then not applied.
  surface: instructions
  evidence: >-
    task_056 is 0/3 in every round of this experiment and is the clean case: at its second
    search it retrieved doc_bank_accounts_bank_accounts_(general)_013, an ACTIVE promotion
    notice stating the recommendation priority for business checking accounts outright, then
    recommended a different account without applying it (batch_05 conv
    01a017b0-8dc7-7789-a06d-724f4e5733e1; the mechanism was first read in full at g=0 in conv
    01a0169b-6d5c-7222-b82f-ee9c5b311920). Wrong-named-class is sole cause in 5 episodes / 4
    tasks in batch_05 and present in 10 of the round's 25 multi-mechanism failing episodes.
    Backlog target T1.
  expected_effect: >-
    DELTA against batch_05: wrong-named-class sole-cause episodes fall from 5 to <= 2, AND
    task_056 performs the gold open_bank_account_4821 call with account_class "Cobalt Blue"
    in at least 1 of 3 trials against 0 of 15 across every round so far. The second clause is
    the sharper one because task_056 has never once done it.
  risk: >-
    The precondition "when the knowledge base states a rule" is the same escape hatch that
    made C5 vacuous. Cost is the secondary risk: KB_search per episode must not rise above
    7.8 from 7.05, and messages per episode not above 44 from 41.21.
  adoption_stage: false
  clauses:
  - clause: >-
      When the knowledge base states a rule for choosing among named options — a priority
      order, an eligibility condition, a tie-break — apply that rule to the candidates you
      retrieved.
    adversarial_reading: >-
      "When the knowledge base states a rule" is declined: the model does not recognise a
      promotion notice or an eligibility checklist as "a rule for choosing", so the sentence
      never fires and behaves exactly as C5 did.
    falsifier: >-
      The wrong-named-class sole-cause count fails to fall by 2 or more from 5 while distinct
      KB documents per episode is unchanged from 37.37 — the signature of a sentence whose
      precondition was never satisfied.
  - clause: apply that rule to the candidates you retrieved
    adversarial_reading: >-
      "the candidates you retrieved" licenses applying the rule to an incomplete candidate
      set, ranking correctly over the wrong universe — which is the defect C3 addressed and
      would re-introduce one layer up.
    falsifier: >-
      The counter falls while task_056 stays at 0/3, i.e. the rule is applied but to a
      candidate set that never contained the gold option.
  commit: 4dcd553
- mechanism: >-
    Remove C5's instruction to unlock and call the tool a procedure document names. Its
    counter moved nothing anywhere it could fire and moved the wrong way twice.
  surface: revert
  evidence: >-
    Failing episodes in which a gold discoverable-tool name was never unlocked or called:
    12 before C5 landed, 14 after batch_04, 16 after batch_05. task_046 is 0 of 15 lifetime
    on get_user_dispute_history_7291 (conv 01a017af-85ca-7006-b2b2-253c650be3e1). Backlog
    target T3.
  expected_effect: >-
    DELTA against batch_05: the never-unlocked-gold-tool counter stops rising from 16 — it
    does not exceed 16 in batch_06. The null branch is informative: if it keeps rising with
    the sentence gone, the rise was never attributable to C5 and belongs to the growing
    instruction set or to drift.
  risk: >-
    Removing the only instruction aimed at tool selection could let the counter rise further.
    Watched by the same counter; a rise above 20 would say the sentence was doing something
    after all, in the opposite direction to its prediction.
  adoption_stage: false
  commit: 010ec80
