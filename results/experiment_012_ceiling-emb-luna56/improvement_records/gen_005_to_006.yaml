  summary: >-
    BATCH HEALTH. batch_06 ran 78 platform episodes against recipe commit 7241443 (the
    exp12-g005 tag's tree), all 78 graded, zero incomplete. GRADED READ: 32/78 (41.0%);
    curve 33.8, 36.4, 37.2, 39.0, 43.4, 41.0%. Counters from benchmark/scripts/mech_counters.py,
    the same code across all six rounds. PREFLIGHTS: 6 local episodes for C11, and the SECOND
    one is the one that carried information. The first (task_038, non-partition) recorded
    compare_candidates called ZERO times — ambiguous between "not applicable" and "not
    registered", so it was explicitly NOT treated as a verdict. The second, on task_056 (a
    batch task, permitted by allow_within_batch_verification) where the mechanism
    demonstrably applies, recorded 43-46 invocations per session and pi_local_calls 47/47/48
    with well-formed arguments. The zero on task_038 was correct behaviour. Cost was checked
    against the SAME TASK'S OWN BASELINE rather than the round mean — task_056 ran 66/66/66
    messages at batch_05 and 70/90/76 at batch_06 against the preflight's 60/61/73, so no
    inflation. No behavioural number from those six episodes is evidence.
signals:
- description: >-
    C9 IS DENIED AND MOVED THE WRONG WAY. Wrong-named-class sole-cause episodes went 5 -> 8
    against a predicted <= 2. Its clause-1 adversarial reading — the model declines to
    recognise a promotion notice or eligibility checklist as "a rule for choosing", so the
    sentence never fires — remains the leading account, and it is the same failure C5 had.
  prevalence: 5 -> 8 sole-cause episodes across 4 tasks
- description: >-
    AN ERROR IN THE ORCHESTRATOR'S OWN PREDICTION, recorded rather than quietly dropped. C9's
    second clause named task_056 as "0 of 15 across every round so far". The record shows 1 of
    15: task_056 passed 1/3 at batch_03. It went 0/3 -> 1/3 this round, which is exactly what
    it had already done once WITHOUT C9, so the clause fired on a pre-existing condition and
    diagnoses nothing. This is precisely the level-versus-delta error the composition policy
    warns about, committed in a record that quotes the rule. C9's verdict therefore rests on
    its first clause alone, which is denied.
  prevalence: task_056 by round — 0/3, 0/3, 1/3, 0/3, 0/3, 1/3
- description: >-
    THE SHAPE HYPOTHESIS FAILED ITS FIRST PROSPECTIVE TEST. gen-005 proposed, from six
    measurements, that changes succeed when they ask for a POSITIVE CHOICE among alternatives
    already visible and fail when they ask the model to withhold, verify, or rest on a
    precondition it can decline. C9 was built deliberately in the confirmed shape and was
    denied with its counter moving the wrong way. The hypothesis was recorded as post-hoc when
    proposed; one out-of-sample test refutes it. What survives is the narrower, better-evidenced
    statement it was built on: instruction-shaped demands on this harness have been denied five
    times running, across two delivery surfaces.
  prevalence: 1 prospective test, denied
- description: >-
    C10 IS CONFIRMED. The never-unlocked-gold-tool counter had risen 12 -> 14 -> 16 across the
    two rounds carrying C5; with C5 removed it read 15. The rise stopped, which is what the
    prediction asked for. Modest, and a single round, but the direction reversed on removal.
  prevalence: 12, 14, 16 with C5; 15 without it
- description: >-
    C8's DEFERRED REWARD PREDICTION COMES DUE AND SPLITS. Its own mechanism counter — failing
    episodes carrying a gold action never performed — fell 15 -> 13 -> 10 across the two
    rounds carrying the tool, which is a genuine mechanism confirmation over two witnesses.
    The round total fell 43.4% -> 41.0% over the same step. So: MECHANISM CONFIRMED, REWARD
    NOT. This reproduces a prior experiment's central finding on a different tool and a
    different mechanism — adoption is not improvement, and now: a moving mechanism counter is
    not improvement either.
  prevalence: ABSENT failing episodes 15 -> 13 -> 10; round total 43.4% -> 41.0%
- description: >-
    THE PRIMARY REMAINS REACHABLE. batch_06 vs the pooled baseline: 34.6% -> 41.0%, sum of
    rate deltas +1.667, permutation p = 0.1597, CMH z = 1.174. Accumulated +6.4 pp against
    11.4 pp required, so the gap is 5.0 pp against two remaining slots and a largest observed
    single-generation gain of 3.8 pp: 3.8 x 2 = 7.6 > 5.0.
  prevalence: accumulated +6.4 pp, gap 5.0 pp, 2 slots remaining
counterevidence: >-
  THREE OBJECTIONS. (1) C11 IS THE FOURTH ATTEMPT AT ONE MECHANISM AND THE PRIOR IS POOR.
  Wrong-named-class has now absorbed C3 (partial), C6 (denied, reverted), C9 (denied, wrong
  direction) and now C11. The defence is that C11 is the first attempt on the surface whose
  pattern this experiment has actually confirmed, but "categorically different" is an argument
  and this experiment has watched an argument of that exact shape fail once already this
  round. (2) C8's SPLIT VERDICT CUTS AGAINST C11. The state-tool pattern moved its own counter
  and did NOT move reward. If C11 does the same — counter moves, reward does not — the
  correct conclusion is that these mechanism counters are not the binding constraint on this
  objective, not that the next tool will work. That reading is pre-committed here so it cannot
  be avoided later. (3) NO REVERT REMAINS, so C11 is carried into the endpoint harness whatever
  it does. It was preflighted twice for that reason, and its cost was checked against its own
  task baseline rather than the round mean, but the asymmetry is real: a bad change landed now
  is permanent for this experiment.
hypothesis: >-
  Five successive instruction-shaped changes have been denied on this harness, two of them
  through a verified point-of-use structural injection as well as through prose, while the one
  pattern confirmed in the back half is a tool that holds state the model cannot silently
  lose. C11 applies that pattern to the mechanism that has resisted every instruction aimed at
  it: the decisive transcripts show the agent stating the gap in its own words and then losing
  it, so a tool that computes the gap back is the delivery never tried for it.
owning_layer: >-
  extension-tool. No surface-concentration obligation is outstanding — every class this repo
  can name has been exercised in this experiment except a declared skill, measured inert on
  this seam.
proposed_change: >-
  ONE change, and the deviation from the 3-5 composition policy is deliberate: no revert
  remains, so anything landed now is permanent for this experiment, and the round's value lies
  in testing one well-evidenced mechanism cleanly rather than in filling slots. C9's sentence
  is replaced rather than reverted — a re-delivery of the same target on the surface the
  evidence favours, consuming no revert because none remains.
schema_version: 4
changes:
- mechanism: >-
    A per-episode tool holding the customer's stated requirements against the named candidates
    under consideration, returning the candidate/requirement pairs whose value has not been
    retrieved. It computes the gap rather than asking the model to remember it.
  surface: extension-tool
  evidence: >-
    Wrong-named-class is sole cause in 8 episodes / 4 tasks in batch_06 and has resisted three
    prior changes. The decisive transcripts state the gap in the agent's own words and then
    lose it: task_002 "the available data is insufficient. So, I'll recommend the EcoCard"
    (conv 01a017e0-2450-7737-bbe4-d39970f189fc this round; first read at g=0 in conv
    01a01695-c9df-75aa-99c2-bf4ec23d82f8), task_056 "ATM rebates are unclear... I might only
    recommend Hunter Green conditionally" before recommending it unconditionally (conv
    01a017e7-7ec8-7039-a530-1e4b85882e82). Backlog target T1.
  expected_effect: >-
    DELTA against batch_06, both clauses required. compare_candidates is called in >= 15
    episodes across >= 5 tasks with well-formed arguments (action in requirement/candidate/
    value/gaps), AND wrong-named-class sole-cause episodes fall from 8 to <= 4. Adoption alone
    is NOT the open question here — this is the second tool on a surface whose adoption is
    already established at 578 calls in batch_05 — so unlike C8 this change carries a
    mechanism prediction in the same round as its adoption one.
  risk: >-
    Cost, and it is the reason no revert remaining matters: the tool is inherently multi-call
    (one per requirement, per candidate, per retrieved value). Watched as a delta: messages per
    episode must not rise above 43 from 39.26, and ANY max_steps termination is a fired
    falsifier because this experiment has had none in six rounds. Secondary risk: the tool
    reports gaps and the model proceeds anyway, which is what C6 measured happening to a
    prose version of the same check.
  adoption_stage: false
  host_facts:
  - fact: >-
      a tool name listed in agents/agent.yaml  is executed by Pi and never forwarded to
      tau; measured in this experiment at 578 calls in one round with zero occurrences in tau's
      graded trajectory
    probe_evidence: results/experiment_012_ceiling-emb-luna56/generation_004/batch_05/episode_manifest.jsonl
  - fact: >-
      the same registry governs the auto-generated delegation tool, re-confirmed at zero
      occurrences in tau's trajectory across three episodes
    probe_evidence: results/experiment_012_ceiling-emb-luna56/generation_000/subagent_probe/VERDICT.md
  clauses:
  - clause: >-
      When the customer's request comes down to a choice among the bank's named options, use
      the compare_candidates tool
    adversarial_reading: >-
      "comes down to a choice among named options" is a precondition the model can decline to
      find satisfied — the same escape hatch that made C5 and C9 vacuous — so the tool is never
      called on the tasks it targets.
    falsifier: >-
      compare_candidates is called in fewer than 15 episodes or on fewer than 5 tasks. The
      task_038 preflight already shows the tool correctly NOT firing where no such choice
      exists, so a low count round-wide is about the precondition, not about the wiring.
  - clause: ask for the gaps before you choose
    adversarial_reading: >-
      The model asks for the gaps, receives them, and chooses anyway — exactly what C6 measured
      when the same check was delivered as prose, and what both decisive transcripts show the
      agent doing with a gap it had already articulated.
    falsifier: >-
      The adoption clause confirms while the wrong-named-class counter fails to fall from 8 by
      4 or more — tool used, gap reported, decision unchanged.
