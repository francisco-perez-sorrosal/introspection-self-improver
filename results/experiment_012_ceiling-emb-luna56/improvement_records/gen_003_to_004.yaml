expected_effect: >-
  THE PRIMARY IS DECLARED DEAD ON THIS ROUND, per the futility check (contract/protocol.md
  step 4, plan D36). The arithmetic: accumulated delta on the endpoint-test scale is +3.9 pp
  (batch_04 vs pooled batch_01+batch_02, 34.6% -> 38.5%, sum of rate deltas +1.000,
  permutation p = 0.2997); significance at alpha needs 11.4 pp per the freeze's committed
  power envelope; the gap is 7.5 pp; the largest single-generation gain this experiment has
  actually produced is 1.8 pp; four slots remain including this one; 1.8 x 4 = 7.2 pp < 7.5
  pp. It fires NARROWLY — a 2.0 pp estimate for the largest gain would leave the primary
  alive at 8.0 pp — and the sensitivity is recorded rather than smoothed. The consequence is
  not stopping: from here the remaining slots buy knowledge, and this set is the first
  composed under that rule. What is explicitly NOT claimed is that the loop found nothing —
  the headroom stratum, the only one with no measured ambient movement, has gone 3/33 to
  8/33; the correct statement is that the endpoint test cannot reach alpha from here.
  SET-LEVEL DIRECTION: none predicted. C7 predicts a cost reduction, C8 predicts adoption
  only. DELIBERATELY NOT TARGETED: the wrong-named-class mechanism, which loses its only
  countermeasure this round and is watched rather than addressed; and C5, which is denied and
  moved the wrong way but is left in place because only one revert remains and a second
  removal this round would confound C7's measurement.
