counterevidence: >-
  Two readings argue against reverting. (1) THE COUNTERS DID MOVE IN THE PREDICTED DIRECTION,
  and the revert bar is a denied MECHANISM rather than a denied prediction — a strict reading
  keeps C5. Against that: the movement is inside the counter's own round-to-round drift, and
  the rule's purpose is to protect changes whose mechanism demonstrably fires, which this one
  does not. (2) ONE ANCHOR CELL AND ONE TASK'S TWO CELLS ARE WITHIN THE MEASURED NOISE
  (14 of 36 cells flip on an identical harness), so the harm may be imaginary. That is
  precisely why the revert is not justified on the harm: it is justified on the mechanism
  doing nothing, with the harm as a secondary reason not to carry an inert change into the
  endpoint harness. The revert's own prediction tests the harm claim honestly — if task_006
  and task_003 do not recover, the harm was noise and the record will say so.
hypothesis: >-
  C5 is inert. Showing the agent the ids it has already retrieved does not change how often
  it searches, because the re-searching is driven by bm25's ranking rather than by the agent
  forgetting its own history. Removing it should return the counters to their pre-C5 levels
  and, if the two regressions were real rather than noise, restore them.
