counterevidence: >-
  The strongest argument against reverting C4 is a measured counterfactual from a prior
  experiment: a change kept through a DENIED prediction produced that experiment's clearest
  win two rounds later, and the rule "revert on a denied mechanism, never a denied
  prediction" exists because of it. C4's mechanism is not denied — it fired once, visibly,
  with the deciding document retrieved and the target task at its best of six rounds. What is
  denied is replication. Reverting a once-firing mechanism is therefore a JUDGEMENT and is
  recorded as one: the case for it is that the cost is paid every round while the benefit
  appeared in one, and that an endpoint harness should carry only mechanisms that held. A
  reader who weighs the prior counterfactual more heavily would keep C4, and the record
  should let them see exactly what was traded.
hypothesis: >-
  C4's instruction produces more searching on every task and the right document on
  approximately one episode in nine. The endpoint harness is better without it: the retrieval
  cost is constant and the benefit is not, and the remaining changes (C1, C2, C3) each have a
  mechanism that fired and held.
