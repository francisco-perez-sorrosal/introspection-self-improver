  prevalence: 2/12 tasks, 7/36 episodes across the two rounds
counterevidence: >-
  Three objections stand against this change and are recorded rather than answered away.
  (1) THE TOOL CANNOT FIX ITS OWN INPUTS. The preflight showed the model supplying Gold at a
  flat 2.5% cash back against Silver's "cash back outside top categories" 1.0% while the
  customer's stated spend is travel — so the ranking it returns is correct on the values
  given and the values are what is incomplete. If the true defect is attribute selection
  rather than ordering, this change moves the failure one layer up and does not remove it.
  That is a legitimate outcome for an adoption-first round and is exactly what batch_03 will
  show. (2) task_023 did not call the tool at all in the preflight, so the mechanism's reach
  may be narrower than its evidence — task_023's customer asks about a rebate rather than
  asking to choose, and the product decision is implicit. (3) The bundled instruction carries
  a conditional ("when the customer states requirements or preferences and you are choosing
  between options"), and the standing lesson across three experiments is that any injected
  precondition can read as a bar to acting. Its falsifiers are recorded per clause below.
hypothesis: >-
  The agent fails these tasks not by failing to retrieve and not by failing to act, but at a
  filtering-and-ordering step it performs in prose: given several candidates and a stated
  preference order, it selects on the salient attribute instead. Moving that step onto a
  deterministic surface the model calls — one that also names which attributes were not
  supplied — should make the selection follow the stated order, and should make an
  incomplete retrieval visible as an explicit gap rather than a silent default.
owning_layer: extension-tool (with its bundled usage instruction as one mechanism)
proposed_change: >-
  One change. Not a set: this is the first change ever landed on the extension-tool surface
  in this project's history, and adoption-first makes it a one-round bet whose prediction is
  adoption rather than reward. Adding a second change would confound the round for no gain,
  because the reward read is deferred either way — and the prior experiment's clearest
  lesson about first uses of a surface (a hook that never executed, whose preflight looked
  3/3 by chance) argues for keeping this one unconfounded. T2 was the alternative and waits
  for gen-003 on the weaker-evidence rule.
schema_version: 4
changes:
- mechanism: >-
    Move constrained multi-candidate selection off prose and onto a deterministic tool: the
    model supplies the candidates it retrieved with their attribute values, the customer's
    hard requirements, and the customer's preference order; the tool filters, reports why
    each excluded candidate failed, names the attributes not supplied, and ranks the
    qualifiers by the stated order. The tool encodes NO domain knowledge — no document ids,
    product names, thresholds or gold values — and has no filesystem, network, subprocess or
    cross-call state. The bundled one-paragraph usage instruction is part of the same
    mechanism per D29: a capability and its adoption path are one diagnosis.
  surface: extension-tool
  evidence: >-
    Backlog target T1. task_003 6/6 episodes across batch_01 and batch_02 applying for the
    Gold Rewards Card against gold's Silver; task_023 4/6 choosing Silver against gold's
    Diamond Elite; task_055's measured counterfactual (t0 passed in batch_02 on the correct
    Silver Plus Account). Conversations 01a01294-8f6d-726c-beb1-6ea99ed368ec,
    01a01298-0a52-7093-adc9-736ec9c85f0a, 01a0129f-0ab4-7764-a75c-a556b35bac8f (task_003,
    batch_02) and the batch_01 set recorded in gen_000_to_001.yaml.
  expected_effect: >-
    ADOPTION-FIRST. Predicted for batch_03: pi_local_calls >= 1 on task_003 (the task whose
    customer states an explicit preference ordering) in at least 2 of 3 trials, with
    well-formed arguments — two or more candidates, each carrying the attributes named in
    the requirements — and no episode exceeding tau's frozen 600s timeout. Round-wide
    pi_local_calls must move off zero, where it has sat for every platform episode of every
    experiment. THE REWARD PREDICTION IS DEFERRED to batch_04 and is stated as deferred: a
    confirmed adoption with unmoved reward is NOT a denial, while a denied adoption (the
    model does not call it) is a mechanism denial and a first-class revert trigger.
  risk: >-
    Three. (a) The tool ranks what it is given, so incomplete or mis-selected attribute
    values produce a confidently wrong answer — the preflight already showed this shape.
    (b) The bundled instruction's conditional could be read as a precondition and suppress
    action, the standing failure mode of injected preconditions. (c) Pi-local execution
    spends wall-clock and tokens inside tau's frozen episode budget; the tool is pure
    computation over its arguments, but adoption adds turns. The anchors task_006 and
    task_032 are the regression channel for all three and must hold 3/3.
  adoption_stage: true
  adoption_criteria: >-
    Adoption and correct invocation, measured on batch_03 and nothing else: (1)
    pi_local_calls >= 1 on task_003 in >= 2 of 3 trials and >= 1 round-wide on any other
    task where a product recommendation is due; (2) well-formed arguments — >= 2 candidates
    per call, each with attributes matching the requirement names, verified by reading the
    call payloads in a fetched conversation rather than inferred from the counter; (3)
    latency inside tau's frozen timeout_seconds with no episode terminating on it. The
    reward-level prediction is DEFERRED to batch_04.
  host_facts:
  - fact: >-
      A tool call whose name appears in agents/agent.yaml `tools:` is executed by Pi and
      never forwarded to tau — the list IS the D24 Pi-local suppression registry — costing
      no tau step and none of the ten max_errors, and logged in
      raw_data.pi_suppressed_tool_names with the manifest deriving pi_local_calls. This is
      the fact the whole change depends on, and it was an ASSUMPTION on the platform lane
      until this experiment measured it.
    probe_evidence: >-
      results/experiment_010_adopt-bm25-luna56/gates/suppression_canary.json (platform lane,
      3/3 episodes, pi_local_calls 1 each, probe_note absent from tau's graded trajectory,
      all four seam counters zero) and benchmark/probes/2026-08-16-surface-probes/ probe P6
      (local lane, mock domain).
  - fact: >-
      An extension is declared once, in package.json `pi.extensions`; agent.yaml has no
      extension counterpart, and a registered tool becomes model-callable only by ALSO being
      allowlisted in agent.yaml `tools:`. A tool registered without that entry leaks to tau
      as a graded invalid call.
    probe_evidence: >-
      benchmark/probes/2026-08-16-surface-probes/ (P3/P6) plus this experiment's own
      suppression canary, which exercised exactly this wiring end to end on pushed main
      before being reverted (commits 5c9b1ec and its revert 8ef635a).
  clauses:
  - clause: >-
      When the customer states requirements or preferences and you are choosing between
      options, retrieve each candidate's specification, then call `compare_options` with
      every candidate you retrieved, the customer's requirements, and their preference order.
    adversarial_reading: >-
      The conditional is read as a precondition on ACTING rather than on calling: an agent
      that judges the customer's preferences insufficiently "stated", or that judges itself
      not to be "choosing between options", skips both the tool and the recommendation. This
      is the exact shape measured three times — any injected statement about a missing
      precondition can read as a bar to acting.
    falsifier: >-
      apply_for_credit_card / open_bank_account calls fall on task_003, task_023 or task_063
      relative to batch_01 + batch_02, or transfer-carrying episodes rise round-wide. Either
      fires and the clause, not the tool, is the suspect.
  - clause: Report and act on the option it selects.
    adversarial_reading: >-
      Read as licensing deference to the tool's output over the agent's own reading of the
      knowledge base, so a wrong ranking built from wrong inputs is followed rather than
      questioned — the tool becomes an authority instead of a calculator.
    falsifier: >-
      An episode calls compare_options, receives a ranking whose inputs the transcript shows
      to be incomplete (an UNDECIDABLE or NOT SUPPLIED line in the tool's own output), and
      applies for the ranked option anyway without retrieving the missing attribute.
