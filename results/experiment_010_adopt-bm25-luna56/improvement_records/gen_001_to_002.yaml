signals:
- description: >-
    THE NOISE FLOOR, and it is this transition's most consequential measurement. On a
    byte-identical harness (batch_01 -> batch_02) the round total was UNCHANGED at 20/36
    (+0.0 pp) while 14 of 36 trial cells flipped and 6 of 12 task rates moved, every one of
    them by exactly +/-1. Both anchors held 3/3. Adding the voided pass as a third draw:
    task_008 measured 3, 2 and 0 (range 3), task_089 and task_014 range 2, nine tasks range
    <= 1, and task_006 / task_032 / task_076 were stable at 9/9. The aggregate is a far
    better-behaved statistic than any single cell — gains and losses cancel almost exactly.
    Operational consequence for the remaining slots, stricter than the prior experiment's
    2-cell rule: a one-cell task movement is noise, two is suggestive, and NO single-task
    movement is attributable without its own mechanism counter moving in the predicted
    direction. This is the number gen-001 was pre-registered to buy, obtained before the
    first mutation rather than by accident in a late round.
  prevalence: 36/36 episodes, paired against batch_01's 36/36
