counterevidence: >-
  Three objections to gen-006's hook. (1) IT MAY NOT REDUCE SEARCHING AT ALL. The agent may
  re-search because bm25 ranks poorly for its query, not because it forgot what it holds; in
  that case the index is inert and the cost stands. The counter distinguishes them and the
  prediction is written on it. (2) IT ADDS TEXT TO EVERY KB_search RETURN, so it spends
  context to save turns — on a task that already retrieves 12 times per episode the index
  itself grows, and the net could be negative. MAX_SHOWN caps it at 40 ids, which bounds but
  does not eliminate this. (3) A PRIOR EXPERIMENT MEASURED THAT A BARE LIST CHANGES NOTHING:
  its C1 appended a list of KB-named tools and moved no counter, while a missing-state note
  moved one 0/3 -> 3/3. This hook appends a bare list, which is the shape with a measured
  null behind it. It is landed anyway because the list here is about the agent's OWN
  history rather than about the domain — the agent cannot otherwise know it — but the prior
  null is the reason the prediction is a counter and not a reward.
hypothesis: >-
  The agent re-searches because it cannot see what it already holds: nothing in its context
  summarises the documents this episode has returned, so it reissues overlapping queries and
  pays turns for documents it has. Appending the ids it has already received should let it
  notice coverage and stop, reducing KB_search per episode and episode length without
  removing or altering anything tau returned.
owning_layer: extension-hook
proposed_change: >-
  One change, on the class the D29 ladder requires. gen-005 was the third instructions
  mutation, so a set confined to instructions was no longer self-certifying; the obligation
  is discharged by landing on extension-hook — a class this experiment has never exercised —
  rather than by argument, which the rule explicitly does not accept.
schema_version: 4
changes:
- mechanism: >-
    After every KB_search return, append the document ids this episode has already received.
    Nothing tau returned is removed, rewritten or hidden; the model reads the original result
    plus one line naming its own retrieval history. The hook cannot name a document the
    episode has not seen, which is the line between tracking retrieval and supplying an
    answer.
  surface: extension-hook
  evidence: >-
    Per-episode KB_search counts across batch_05 and batch_06 (9.4 -> 12.3), mean messages
    across all six rounds (37.3, 36.2, 41.5, 42.1, 43.6, 48.7), round cost ($0.64 -> $1.26),
    and gen-004's elimination of compare_options as the driver (calls halved, length
    unchanged). Conversations 01a013dd-48ce-759c-9d58-80f38c6705c7,
    01a013e2-95d5-7610-8026-837571151abb, 01a013e7-5d75-738e-8f30-e827a5906ede.
  expected_effect: >-
    On batch_07, as deltas against batch_06: mean KB_search per episode falls below 12.3;
    mean messages per episode falls below 48.7; and no task that improved at batch_06
    regresses by more than one cell. Reward is not the prediction — this is a cost-side
    change and a flat round total with the counters moving is a CONFIRMED outcome.
  risk: >-
    The index spends context to save turns and could net negative on retrieval-heavy tasks
    (bounded, not eliminated, by the 40-id cap). It may also be inert if the agent
    re-searches because bm25 ranks poorly rather than because it forgot — the prior
    experiment's measured null on bare lists is the standing reason to expect that.
