  summary: >-
    batch_05 under H4 (C1 + C2 + C3): 36/36 completed, evidence_complete and arm_sha_ok, all
    four sandbox seam counters zero, every episode user_stop, zero max_steps, $1.00. FIFTH
    round over the same twelve tasks — a set the loop has been tuned on. Read through the
    normalized gold-action comparison, per-task pi_local_calls, the per-round episode
    profile, and — for task_003 — the domain's own knowledge-base documents, which is what
    finally resolved its failure mode. PREFLIGHTS: nine local-lane episodes across two
    candidate forms of one change (generation_004/g005_preflight and g005_preflight_b),
    inside the ~12 budget; compared on process counters, never on preflight reward, and
    never provenance for anything here.
signals:
- description: >-
    C3's MECHANISM CONFIRMED, its COST CLAIM DENIED, and the denial is the round's most
    useful result. pi_local_calls fell 52 -> 28: task_055 15 -> 10, task_057 11 -> 5,
    task_063 9 -> 4, while task_003 held at exactly one call per episode — the narrowing
    concentrated the calls on genuine selections exactly as designed. But mean messages per
    episode rose 42.1 -> 43.6, mean tool messages 14.4 -> 15.5, round cost $0.98 -> $1.00.
    HALVING THE TOOL CALLS DID NOT SHORTEN EPISODES, so compare_options is not what drives
    the turn cost. That hypothesis is dead; KB_search volume is the obvious next suspect and
    no slot has been spent on it.
  prevalence: 3/3 predicted call-count targets fell; 0/3 cost targets moved
- description: >-
    THE CURVE DOES NOT REPLICATE, and task_014 is most of why. Round totals: 20, 20, 17, 26,
    19 of 36 (55.6, 55.6, 47.2, 72.2, 52.8%). batch_04's high did not survive a round whose
    harness contained everything batch_04's did plus a narrowing. task_014 alone has run
    1, 2, 0, 3, 0 across the five rounds — it supplied +3 of batch_04's rise and -3 of
    batch_05's fall — and NO change in this experiment can act on it: it makes no
    discoverable-user-tool handover and has never called compare_options. Against the
    measured A/A floor (14 of 36 cells flipping on an identical harness) no round total in
    the 17-26 band is yet evidence of anything.
  prevalence: 5 rounds; task_014 contributes +/-3 cells of every swing
- description: >-
    T1's REMAINDER IS SOLVED AS A DIAGNOSIS, and it is a retrieval gap rather than a
    comparison gap. Reading the domain's own documents: task_003's two finalists both clear
    every hard requirement and tie on the customer's first stated tie-break ($0.00 annual
    fee), so the decision falls to her second, highest cash back. The Gold Rewards Card is
    2.5% flat; the Silver Rewards Card's overview says 1.0% "outside top categories", and
    doc_credit_cards_silver_rewards_card_002 states 4.0% on TRAVEL — which the customer
    names as her main expenditure. Silver wins on her own criteria and the deciding document
    is in the task's required set. Measured over three preflight episodes, that document is
    retrieved 0/3 while the word "travel" appears 41-75 times per episode. The agent argues
    about travel constantly and never pulls the travel rate.
  prevalence: task_003 1/15 episodes lifetime; deciding document retrieved 0/3
- description: >-
    A FALSIFIER MIS-SPECIFICATION, recorded as craft rather than buried. C3's clause-1
