    rather than a DELTA against the prior round is not a falsifier. Every falsifier from
    here states a delta.
  prevalence: 1 of 2 clauses in the gen-004 record
counterevidence: >-
  Three objections to gen-005's change. (1) ITS EVIDENCE IS THIN AND IS STATED AS THIN: the
  selected candidate form moved the retrieval counter from 0/3 to 1/3. That is a better
  counter, not a solved mechanism, and one episode in three could be chance. (2) IT IS THE
  THIRD INSTRUCTIONS CHANGE, and the instructions block has now grown in four of five
  generations — accumulating instruction text is precisely how prior experiments lost scope
  control, and each addition competes with the frozen policy for the model's attention. (3)
  A DIFFERENT READING OF THE SAME EVIDENCE IS AVAILABLE: bm25 is a frozen surface, and if
  the ranking simply will not return silver_002 for the queries this agent can plausibly
  form, the ceiling is the retrieval backend rather than the harness — the class a prior
  experiment retired a target over. The counter distinguishes them: if the document is
  retrieved and the choice still does not move, the harness is not the limit; if the
  document is never retrieved however the instruction is phrased, it is bm25.
hypothesis: >-
  The agent treats one document per candidate as the candidate's specification. Rates that
  are split across an overview and a category document are therefore compared on their
  headline values, and a customer whose stated use falls in a bonus category is quoted the
  wrong number. Telling the agent that a product's terms are usually split, and to search
  again per candidate using what the customer says they will use it for, should surface the
  category document — and a retrieval-and-order instruction is the one prose shape a prior
  experiment measured working, as against prohibitions and offered alternatives.
owning_layer: instructions
proposed_change: >-
  One change. The evidence for it is a document-level diagnosis rather than a cell movement,
  which is the strongest form this experiment has produced; but its preflight counter is
  thin, so it lands alone and is read on the counter alone.
schema_version: 4
changes:
- mechanism: >-
    Tell the agent that a product's rates and benefits are usually split across an overview
    document and further category, tier or condition documents, and to search again for each
    candidate by name together with what the customer says they will use it for, using the
    figure that applies to that use rather than the headline one.
  surface: instructions
  evidence: >-
    Backlog target T1's remainder. task_003 1/15 episodes across five rounds choosing Gold
    where gold is Silver; the domain's own doc_credit_cards_silver_rewards_card_002 carrying
    the 4.0% travel rate that decides the task; that document retrieved 0/3 in preflight
    while "travel" appears 41-75 times per episode. Conversations
    01a01388-ad16-70dd-a7e9-a2514e773c75, 01a0138f-6609-73f7-90a0-9e8358c4ba29,
    01a01393-f167-7608-9f88-a21ade110340.
  expected_effect: >-
    On batch_06: the category-specific document of a candidate is retrieved in at least 1 of
    3 task_003 episodes, against 0 of 3 in batch_05, and round-wide KB_search calls per
    episode do not fall. Reward is NOT the prediction — task_003 has passed once in fifteen
    episodes and a single cell would be indistinguishable from its own variance.
  risk: >-
    Two. (a) "Search again for each candidate" invites more retrieval on every task, and the
    turn cost is already unexplained and rising — this change could worsen it, which is why
    round-wide KB_search per episode is in the prediction as a level to hold rather than to
    raise. (b) It is the third instructions change; the block has grown in four of five
    generations, and a fourth addition should be resisted unless its evidence exceeds this
    one's.
  adoption_stage: false
  clauses:
  - clause: >-
      One document per option is rarely the whole picture: a product's rates and benefits
      are usually split across an overview document and further documents covering specific
      categories, tiers or conditions.
    adversarial_reading: >-
      Read as licensing indefinite re-searching: the agent keeps searching for a further
      document that may not exist, spending turns inside a frozen step budget on tasks where
      the overview genuinely is the whole picture.
    falsifier: >-
      Round-wide KB_search calls per episode rise by more than 20% against batch_05, or any
      episode terminates on max_steps.
  - clause: >-
      use the figure that applies to that use rather than the headline one
    adversarial_reading: >-
      Read as a licence to prefer any category figure over the headline one even when the
      customer's use does not fall in that category — quoting a bonus rate the customer
      cannot earn, which is a worse error than quoting the headline.
    falsifier: >-
      An episode quotes or compares on a category rate whose category the customer's stated
      use does not match, on any task other than task_003.
