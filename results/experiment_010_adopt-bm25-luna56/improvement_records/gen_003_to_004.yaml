  prevalence: task_003 1/3 after four rounds; task_063 0/12 episodes lifetime
counterevidence: >-
  Two objections to gen-004's change, recorded rather than answered away. (1) IT MIGHT
  SUPPRESS THE TOOL WHERE IT HELPS. The narrowing names what a choice is not, and the
  standing lesson across four experiments is that any injected statement about a
  precondition can read as a bar to acting — an agent that under-classifies a genuine choice
  will stop calling the tool on task_003 and task_023, the two tasks it demonstrably helps.
  That is the first clause's falsifier and the primary risk. (2) THE COST MAY NOT BE THE
  TOOL'S. Messages per episode rose from 37 to 42 between H0 and H2, but H2 also sits four
  rounds into a tuned-on batch and the identity round showed 14 of 36 cells flipping on an
  unchanged harness; a five-message shift is not obviously outside that. Against this: the
  per-task call counts are not noise — 15 and 11 calls on tasks that are not choices are
  counted invocations, and the round cost rose 52%, which no cell-level noise explains.
hypothesis: >-
  C1's mechanism is right and its trigger is too wide. The model reads "choosing between
  options" as covering any deliberation, so it calls a ranking tool while carrying out a
  single prescribed procedure, spending turns inside a frozen step budget for no decision.
  Naming what a choice is — one product, plan or account class out of several the bank
  offers — and naming what it is not should keep the calls on the tasks where a selection
  actually happens, and return the episode profile toward H0's while keeping the gains.
owning_layer: instructions
proposed_change: >-
  One change, again for an attribution reason: batch_04 carried two live changes and its
  9-cell rise could not be split between them, with 3 of those cells attributable to
  neither. Landing a single narrowing keeps batch_05 a clean read on whether the cost falls
  without the gains going with it. C1 is NOT reverted and NOT modified in its code — the
  tool's own behaviour is correct — only its usage instruction narrows.
schema_version: 4
changes:
- mechanism: >-
    Narrow compare_options' trigger to a genuine selection: one product, plan or account
    class out of several the bank offers, called once with every retrieved candidate — and
    say explicitly what is not a choice (a single course of action, a lookup, or a step
    already being carried out). The tool's code is untouched; only the condition under which
    the model reaches for it changes.
  surface: instructions
  evidence: >-
    Per-task pi_local_calls across batch_03 and batch_04 (task_055 9 -> 15, task_057 5 -> 11,
    task_063 9 -> 9 while 0/3 lifetime), the per-round episode profile (mean messages 37.3/36.2
    at H0 -> 41.5/42.1 at H2/H3; round cost $0.64 -> $0.98), and H3's held-out round carrying
    this experiment's first max_steps termination. Conversations
    01a01338-bb37-7478-bfd9-e0be1949a5f3, 01a0133d-b0b2-709d-a8a2-6d193093a764,
    01a01348-435d-71c0-902c-d01e8596efc3.
  expected_effect: >-
    On batch_05: pi_local_calls falls on task_055, task_057 and task_063 against batch_04's
    15, 11 and 9, while HOLDING at >= 1 per episode on task_003 and task_023 — the two tasks
    where a selection genuinely happens. Mean messages per episode falls back toward H0's
    ~37 and round cost below $0.98. No task that improved at batch_04 regresses by more than
    one cell. If calls fall on task_003 as well, the narrowing over-fired and the clause, not
    the tool, is the suspect.
  risk: >-
    The narrowing could suppress the tool where it helps — an agent that under-classifies a
    genuine choice stops calling it on task_003 and task_023. Secondary: the instructions
    block has now grown or changed in three of four generations, and accumulating instruction
    text is how prior experiments lost scope control; a fourth addition should be resisted
    unless its evidence is at least this strong.
  adoption_stage: false
  clauses:
  - clause: >-
      When the customer has to choose one product, plan or account class from several the
      bank offers, retrieve each candidate's specification, then call `compare_options` once
      with every candidate you retrieved
    adversarial_reading: >-
      "has to choose ... from several the bank offers" is read narrowly enough that a task
      where the choice is implicit — the customer describes a need rather than asking to
      pick — no longer qualifies, so the tool stops firing on exactly the tasks it helps.
      task_023's customer asks about a rebate and never asks to choose, and it is the most
      exposed to this reading.
    falsifier: >-
      pi_local_calls falls below 1 per episode on task_003, or stays at 0 on task_023, in
      batch_05.
  - clause: >-
      Do not call it for anything else: a single course of action, a lookup, or a step you
      are already carrying out is not a choice between options.
    adversarial_reading: >-
      A prohibition, and prohibitions are the shape a prior experiment measured failing
      (eleven changes, prohibitions and offered alternatives denied while retrieval-and-order
      instructions confirmed). Read maximally it could suppress deliberation generally, not
      just the tool call — the agent doing less comparing rather than less calling.
    falsifier: >-
      KB_search calls per episode fall round-wide against batch_04, or any task that
      improved at batch_04 regresses by two or more cells.
