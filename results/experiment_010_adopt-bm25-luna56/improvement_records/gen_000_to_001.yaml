# protocol.identity_generations: [1]). H1 = H0 BY DESIGN, decided at freeze and before any
# episode ran — not a rejected mutation, not a failed one. Its purpose is measurement:
# batch_02 re-measures the identical harness, giving this experiment its round-to-round
# noise floor BEFORE the first mutation instead of by accident in a late round, and pooling
# the primary's H0 baseline to six trials per task (batch_01 + batch_02).
