signals:
- description: >-
    C1's ADOPTION PREDICTION IS CONFIRMED on every clause, and it is the project's first
    graded use of a Pi-local surface. pi_local_calls went from ZERO — across all 168
    platform episodes of the prior experiment and every episode before it — to 39, in 18 of
    36 episodes across 6 of 12 tasks. task_003, the task whose customer states an explicit
    preference ordering, called it in 3 of 3 trials against a predicted >= 2 of 3.
    Arguments are well-formed multi-candidate payloads carrying the attributes named in the
    requirements. No episode terminated on tau's frozen timeout. The D24 suppressing path,
    which three closures named as the live hypothesis for why this loop could not improve,
    is now demonstrably usable rather than assumed.
  prevalence: 39 calls over 18/36 episodes, 6/12 tasks
- description: >-
    C1's REWARD did not follow, and the round fell: 17/36 (47.2%) against the pooled H0
    baseline 40/72 (55.6%). The reward prediction was pre-registered as DEFERRED to batch_04
    and stays deferred; this is recorded as an observation, not scored as a denial. Both
    anchors held 3/3, so the regression channel is silent and no anchor paid for it. Read per
    task against its OWN identity-draw range rather than a global band: task_057 4/6 -> 0/3
