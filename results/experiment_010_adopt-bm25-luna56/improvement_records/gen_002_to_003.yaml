    2/3 (range 1, outside, a GAIN), task_014 3/6 -> 0/3 (range 2, inside — and it never
    called the tool), task_003 0/6 -> 0/3 (the target task: called 3/3, unmoved).
  prevalence: 17/36 episodes against a 40/72 pooled baseline
- description: >-
    THE ROUND'S DECISIVE FINDING, and it re-opens a parked target: task_057's collapse is not
    the tool. All three trials fail on T2 — the user calling mobile_check_deposit,
    mobile_deposit, deposit_check and mobile_deposit_check with an `amount` key, where the
