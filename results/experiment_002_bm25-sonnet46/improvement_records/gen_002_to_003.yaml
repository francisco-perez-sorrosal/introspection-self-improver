signals:
- description: >
    Required-procedure incompleteness — the once-per-batch recurring mode: task_041
    matched 2/25 gold actions; the 17-dispute fraud workflow its scenario requires
    was never driven while the conversation drifted through limit-increase and
    family-account requests. Same family as B2 task_045 (9/15 tail unexecuted) and
    B1 task_061 (closure procedure never completed).
  prevalence: 1/4
- description: >
    Policy-enumeration argument value: task_008's agent transferred to a human as
    the gold action requires, but with reason 'unconfirmed_external_communication'
    where the graded expectation is 'customer_demands_after_unavailable_offer_refusal'
    — a categorical field drawn from policy text, ungrounded. The g2 mechanism
    covers record-decided fields but did not reach policy enumerations.
  prevalence: 1/4
counterevidence: >
  task_041's user pursued several concurrent asks, so part of the miss may be
  scenario pressure rather than pure wrap-up discipline; and instruction-block
  growth across three generations adds per-episode cost and could dilute
  instruction-following. Both accepted as risks; the held-out curve arbitrates.
hypothesis: >
  The dominant residual reward loss on procedure-heavy tasks comes from ending or
  drifting away from a KB-governed procedure before its required steps are executed
  or offered. Forcing step-list extraction, progress tracking, and finish-or-park
  discipline converts long almost-workflows into completed ones.
owning_layer: agent judgment — system-prompt instructions (target-agent/SYSTEM.md <instructions>)
proposed_change: >
  One instruction block composing with g1/g2: when a KB procedure governs the issue,
  extract the full required step list (verification, per-item actions, user-run
  tools), track completion, finish or explicitly park across topic changes, and
  never wrap up with a required step unexecuted and unoffered.
