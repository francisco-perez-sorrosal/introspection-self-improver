signals:
- description: >-
    gen-005 G1 CONFIRMED at its prediction, and it is the weakest confirmation in the
    experiment. task_014 recovered 0/3 to 1/3, t1 passing with a transfer. The pre-registered
    RATE falsifier — transfers above batch_04's 15/24 — did not fire: they rose 6/24 to 12/24.
    So G1 is not simply the sixth rate lever, but a doubling of the transfer rate alongside a
    one-trial recovery is a thin margin, and the honest reading is that the dial moved again
    and happened to land where task_014 sits.
  prevalence: task_014 0/3 to 1/3; transfers 6/24 to 12/24
- description: >-
    gen-005 G2 DENIED. Its prediction was that at least one task_072 trial would supply BOTH
    gold amounts in one episode. batch_06's trials produced 14.00 and 5.00, 16.0 and 6.0, and
    14.0 with its partner — against gold's 14.00 and 3.50. Across six rounds and eighteen
    episodes one amount has been right in some trial and both have NEVER been right in one.
    The instruction reached neither the computation nor, on the sampled narration, the
    explanation.
  prevalence: 0/18 episodes across six rounds paired both amounts
- description: >-
    task_065 regressed 1/3 to 0/3, and the decomposition matters more than the number. E1's
    ordering holds in ALL THREE trials — every one issues its opens before its close — and C3's
    restraint holds, with close_bank_account_7392 carrying account_id alone in all three. What
    collapsed is the CLASS choice: Blue Account and Silver Plus Account 3/3, against gold's
    Evergreen and Green. The task's pass was never stable — 1/3 at best, in two of six rounds —
    so what read as a fixed task was a coin flip whose ordering had been fixed underneath it.
    Recorded as a correction to the gen-003 record's framing: E1 did produce the pass
    mechanically, and it did not make the task reliable.
  prevalence: 3/3 trials ordered correctly; 0/3 chose correctly
- description: >-
    The three modes still live at the final slot, each with a reason it is not being mutated
    against. task_065's class choice is stochastic rather than unaddressed. task_070's target
    was retired at g=2 after three denied predictions, on the reading that bm25 — a frozen
    surface, not harness — does not carry what its gold answer needs; the agent retrieves Sky
    Blue's own specification and rejects it. task_026 and task_028's handover has been
    performed since gen-001 but never in gold's shape, and the frozen policy already specifies
    the procedure in full, which is the mutation shape that has failed most often in this
    project's history.
  prevalence: 5/8 tasks have never passed under any harness in this experiment
counterevidence: >-
  Two arguments against this set.

  (1) Spending the final slot on a revert forgoes the last chance to raise the endpoint the
  pre-registered test measures. That is precisely why it is the right call: protocol step 4
  forbids inventing a change to fill a slot, and choosing a speculative change BECAUSE it is
  the last one measured would be optimising the endpoint statistic rather than following
  evidence — the behaviour the frozen reading key calls overfitting. The revert is
  evidence-driven and, on the available evidence, neutral: task_072 has scored 0/3 both with
  and without G2.

  (2) G1 was retained on a thin confirmation. Its falsifier was a rate test set at batch_04's
  15/24 and transfers landed at 12/24 — inside the threshold, but double batch_05's. A stricter
  falsifier would have caught it. The threshold was pre-registered before the round and is not
  being moved after the fact; the thinness is recorded here instead, and the closure should
  read G1's confirmation with it.
hypothesis: >-
  G2's mechanism was right and its surface was wrong. The agent retrieves the fee rule and then
  produces a figure that is not the sum of the charges the rule selects; requiring it to name
  the addends did not change what it produced. The deterministic surface that would fix this —
  a tool that sums exactly — is unavailable in this seam, as measured at g=0. Removing the
  instruction leaves the final harness carrying only changes whose evidence survived.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — one paragraph removed.
  Frozen <policy> untouched and asserted byte-for-byte at 5733 chars; agent.yaml, package.json,
  lock and partition unchanged.

  The final harness carries five surviving changes: C3 (do not volunteer optional arguments),
  D1 (retrieve the rule that decides among options), D2 (no agent-authored escape from the
  completion check), E1 (order state changes so an earlier one does not disqualify a later
  one), and G1 (a prescribed handover is an action to retrieve). Three changes were reverted
  after their predictions were refuted — C2's escape clause, E2, and G2 — and C1 was superseded
  in place by D1. Every one of the five survivors tells the agent what to retrieve or in what
  order to act; every one of the four removed told it what not to do, offered it an alternative,
  or asked prose to do a deterministic job.
proposed_change: >-
  An improvement SET of ONE change on branch gen-006/revert-addends: the revert of gen-005's G2,
  a first-class change under plan D22. The set is one change because no live mode has an
  evidenced mechanism that has not already been tried, and because this is the harness the
  endpoint test measures.
