counterevidence: >-
  Four arguments against this set.

  (1) D2 narrows an instruction that half-worked, which is exactly the operation that failed
  four times across seq 4 and seq 5 (prior-experiment context, prose only). The defence is that
  the harm is MEASURED rather than anticipated — a null report with amount_difference 0, a lost
  full-effort trial, transfers up 9/24 to 11/24 — and that the half being kept carries its own
  falsifier (task_065 must stay at 2 of 3 or better on opening both accounts). If it regresses,
  D2 is itself the revert candidate for gen-003, and the honest reading will be that C2 could
  not be separated into halves at all.

  (2) The batch number went DOWN, 2/24 to 1/24, and the set that produced it is being extended
  rather than reverted wholesale. The case for extending is that every per-change prediction
  scored informatively — one behaviour confirmed with its outcome denied, one confirmed, one
  confirmed with a measured side effect, one unpredicted positive — and that a single cell
  moving by one episode on a task that has been 1-2/3 throughout is inside this design's noise.
  The case against is that a loop which keeps building on a falling curve is exactly the failure
  mode the frozen reading key calls "the meta-agent is the problem". Recorded so the closure can
  judge it rather than discover it.

  (3) task_014's regression is NOT attributed. It fell 2/3 to 1/3: t1 took no action in 14
  messages, and t2 transferred with reason kb_search_unsuccessful_customer_requests_transfer
  where gold is unconfirmed_external_communication. The wrong reason code is C1 territory and C1
  did not help there; the no-action trial resembles batch_01's own t2. With three trials on a
  task that has never exceeded 2/3, this is not separable from sampling, and no change in this
  set is aimed at it.

  (4) The transfer mode is now 11/24 episodes — the largest single failure mode in the batch,
  larger than when it was declined a slot at g=0 — and it still gets no direct mutation. The
  reasoning is unchanged and is now testable: D2 removes a clause this transition MEASURED to
  license transferring, so batch_03 says whether the rise was caused by the harness's own
  previous generation. Attacking transfer directly before that question is answered would
  confound the two.
hypothesis: >-
  Two distinct hypotheses, one per change.

  The agent can now assemble the right candidate set and still cannot choose from it, because it
  is answering a different question than the bank asks. Given a list of products it ranks them
  against the customer's stated preferences; the gold answers are fixed by something the bank
  holds — an offer currently in force, an eligibility condition, a pairing between two products
  — which no amount of feature comparison surfaces. If the harness names the RULE as the object
  to retrieve, rather than the option list, the search should reach it.

  Separately: an instruction that offers an alternative to acting will have its alternative
  taken. C2's "or explained to them" was written to excuse items that genuinely need no action,
  and the model used it to convert action into explanation and, in the limit, into transfer.
  Tying the alternative to a retrieved finding — the knowledge base gives no action — removes
  the agent's own narration as a way to satisfy the check.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — one paragraph revised
  and one paragraph narrowed. The frozen <policy> region is untouched and make check asserts it
  byte-for-byte (5733 chars) on every commit; agents/agent.yaml, package.json, the lock and the
  partition are unchanged.

  Prompt-only again, and the justification recorded at g=0 still binds: the seam probe committed
  at generation_000/seam_probe/ measured that a Pi-local extension-tool call reaches tau as an
  invalid tool call, costing a tau step and one of ten max_errors, so extension tools and
  sub-agents are unavailable in this seam and only the no-tool-call hooks remain. Neither of this
  set's mechanisms fits those hooks — both are decisions taken BEFORE a call, where a
  result-transforming hook has nothing to work on. D1's pre-registered denial condition is
  written precisely to force that question: if two successive rewordings fail to make task_070
  ask an in-force question, prose is the wrong surface and gen-003 must find another one rather
  than reword a third time.
proposed_change: >-
  An improvement SET of two changes, one commit each on branch
  gen-002/deciding-rule-and-no-escape, landed as one PR. D1 revises gen-001's C1 in place; D2 is
  a partial REVERT of gen-001's C2, which plan D22 makes a first-class change and which
  gen-001's per-change commits made mechanically possible. They compose because D1 acts on
  retrieval before a write and D2 on the check at the end of an episode.

  Deliberately not in this set: any direct transfer mutation (backlog T4, now 11/24 episodes)
  until D2 answers whether the harness's own previous generation caused the rise; any
  restatement of the discoverable-tool handover (backlog T5), which moved 0/6 to 6/6 on its own
  and should be left to settle before being touched; and arithmetic support for computed amounts
  (backlog T6 — task_072's amounts got worse, 12/8, 14/16 and 12/16 against gold 14.00 and
  3.50), which is still not separable from D1's mechanism.
