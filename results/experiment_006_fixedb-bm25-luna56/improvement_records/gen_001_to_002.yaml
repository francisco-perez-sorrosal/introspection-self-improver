signals:
- description: >-
    gen-001 C1 scored: BEHAVIOUR CONFIRMED, OUTCOME DENIED, and the pair is the most
    informative result of this transition. C1 predicted task_070 would enumerate the
    business-checking class list and open Sky Blue. The enumeration arrived — "Sky Blue"
    appears in task_070's queries in t1 ("business checking overdraft fees no overdraft fee
    Navy Blue Cobalt Blue Sky Blue Lime Green business acco...") and again in t2, after ZERO
    of batch_01's 22 queries mentioned it. The gold option entered the candidate set for the
    first time in this experiment. The agent then opened Hunter Green anyway, 3/3, exactly as
    before. task_065 t2 pushed the same behaviour further: sixteen queries, five of them
    enumerating one savings class each (Green, Bronze, Silver, Gold Plus, Platinum Plus), and
    it still opened Blue Account and Silver Plus Account rather than gold's Evergreen and
    Green. Enumeration is therefore not the binding constraint.
  prevalence: 6/6 episodes on task_070 and task_065 enumerated; 0/6 chose gold
- description: >-
    What the agent does instead, and it is a single coherent mechanism: it treats the choice
    as its own optimisation over published features against the customer's stated wants.
    task_070's queries in both rounds are a feature search — overdraft fees, ATM rebates of
    at least 15 dollars a month, APY at or above one percent — and across six episodes and
    roughly 65 queries in two rounds NOT ONE asks which offer, rate or promotion is currently
    in force. task_065's gold pairs Evergreen checking with Green savings, a relation between
    two products that no ranking of either one reaches; the agent's queries rank savings
    classes by APY and checking classes by perks, separately. This is the signal D1 targets.
  prevalence: 6/6 episodes on task_070 and task_065; 0 in-force or pairing queries
