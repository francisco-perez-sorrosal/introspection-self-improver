counterevidence: >-
  Three arguments against this set.

  (1) G1 is the SIXTH mutation on transfer behaviour across three experiments and the fifth in
  this one's blast radius. Five predecessors failed. The claim that this one differs — that it
  names a retrievable prescription rather than a condition for appropriateness — is a claim
  about wording, and this experiment's own most repeated lesson is that wording does not carry
  the scope its author intends. The mitigation is the falsifier, which is a rate test rather
  than a task test: if transfers exceed batch_04's 15/24 it became a rate lever like the others.

  (2) G2 asks prose to fix arithmetic. The honest surface for "sum these specific charges" is
  deterministic, and this seam does not have one — the g=0 seam probe measured that an
  extension tool's call reaches tau as an invalid tool call costing a step and an error. G2 is
  therefore the best available instrument rather than the right one, and its falsifier says so
  explicitly: if the enumeration appears in the narration while the amounts stay unpaired, prose
  reached the explanation and not the computation.

  (3) The curve fell to 1/24 and two changes are being added rather than one reverted. The
  defence is that the fall is attributable — task_014 minus two, task_072 minus one, both
  explained by the F1 revert whose prediction was confirmed — and that neither loss argues for
  restoring E2, which was itself refuted. Reverting a confirmed revert to recover a task would
  be optimising the batch number against the mechanism, which is the failure the reading key
  calls overfitting.
hypothesis: >-
  Two hypotheses, one per change.

  The agent's escalation behaviour is governed by whether it believes escalation is permitted,
  not by whether the situation warrants it — which is why every instruction that adjusted the
  warrant moved the rate wholesale. If the knowledge base's own prescriptions are named as
  something to RETRIEVE, the decision moves from the agent's sense of permission to the
  document, and the two sides of the dial stop being coupled.

  Separately: the agent retrieves the fee rule and then produces a figure that is not the sum
  of the charges the rule selects. Requiring it to name the addends turns an estimate into an
  enumeration, which is the same procedural move that worked for ordering (E1) and for
  retrieval (D1).
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — two paragraphs added.
  Frozen <policy> untouched, asserted byte-for-byte at 5733 chars on every commit; agent.yaml,
  package.json, lock and partition unchanged.

  Prompt-only, and the g=0 seam-probe justification still binds. Worth restating at this point
  because it is now load-bearing for G2 specifically: an extension tool would be the correct
  home for "sum these charges exactly", and the probe committed at generation_000/seam_probe/
  measured that such a tool's call reaches tau as an invalid tool call, costing a tau step and
  one of ten max_errors. The right surface does not exist here, and G2 is landed as the best
  available rather than the right one.

  The composition rule this set follows, which is itself a result: of the nine changes landed
  before it, every change that told the agent what to RETRIEVE or in what ORDER to act confirmed
  (D1 produced task_072's first pass, E1 produced task_065's, C3 confirmed 3/3), and every
  change that told it what NOT to do or offered it an ALTERNATIVE failed or backfired (C1 inert,
  C2's escape clause and E2 both produced the behaviour they named). Both changes here are in
  the first class by construction.
proposed_change: >-
  An improvement SET of two changes, one commit each on branch
  gen-005/prescribed-handover-and-addends. G1 acts on where the escalation decision comes from;
  G2 acts on how a monetary figure is produced. They touch different tasks primarily (task_014
  and task_072) and different behaviours; the residual coupling is that task_072 lost trials to
  transfers in batch_04 and to amounts in batch_05, so a batch_06 movement there is jointly
  attributable and the record says so.

  Deliberately not in this set: task_070 (T1 retired at g=2 — nine episodes, behaviour confirmed
  twice, outcome denied three times, and the agent now retrieves Sky Blue's own specification
  and rejects it; the live reading is that bm25, a frozen surface, does not carry what the gold
  answer needs); task_026's write-count regression to 27, entangled with its transfers; and T5's
  handover, still performed but never in gold's shape.
changes:
- mechanism: >-
    Move the escalation decision from the agent's sense of what it is permitted to do to the
    knowledge base's own prescriptions, by naming those prescriptions as something to retrieve.
    States no condition for when transfer is appropriate and no threshold.
  surface: instructions
  evidence: >-
    task_014 3/3 in batch_05 declined a transfer its gold requires, each trial saying so
    explicitly — conversations for t0, t1 and t2 end with the agent reporting it cannot
    escalate, t2 citing referral-link guidance it read as forbidding escalation of undocumented
    offers. Controlled against batch_04, where the same task scored 2/3 with gold's reason code
    while E2 was present and transfers ran 15/24. Backlog target T4, sixth attempt.
  expected_effect: >-
    In batch_06, task_014 recovers to at least 1/3 with reason unconfirmed_external_communication.
    PRE-REGISTERED FALSIFIER, deliberately a RATE test rather than a task test: if
    transfer-carrying episodes rise above batch_04's 15/24, this change became a rate lever like
    its five predecessors and is gen-006's revert candidate.
  risk: >-
    The highest-prior-risk change in the experiment: five of five previous mutations on this
    behaviour failed, and three of them created the mirror-image error. It is landed on the
    strength of a mechanism the transcripts state in the agent's own words, not on a fresh
    theory of when transfer is appropriate.
  commit: c16d3e1
- mechanism: >-
    Turn a computed monetary total into an enumeration: name the specific charges being summed
    and add those.
  surface: instructions
  evidence: >-
    task_072 all three batch_05 trials retrieved the ATM fee policy and still produced 14.0 and
    10.0, 12.0 and 6.5, 11.5 and 4.5 against gold's 14.00 and 3.50 — one amount right in some
    trial, never both in one, across five rounds and fifteen episodes. task_096's credits show
    the same shape. Backlog target T6, un-held on the condition pre-registered at g=2.
  expected_effect: >-
    In batch_06, at least one task_072 trial supplies BOTH gold amounts in the same episode —
    something no trial has done in five rounds. Falsifier: if the enumeration appears in the
    narration while the amounts stay unpaired, the instruction reached the explanation and not
    the computation, and the conclusion is that prose is the wrong surface for arithmetic.
  risk: >-
    Asking prose to do a deterministic job, because the seam denies the deterministic surface.
    Recorded as a known compromise rather than a design choice.
