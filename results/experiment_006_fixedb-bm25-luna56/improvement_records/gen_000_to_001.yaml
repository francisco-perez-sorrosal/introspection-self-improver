signals:
- description: >-
    A value the bank defines is chosen from a candidate set the agent never enumerated. The
    cleanest case is task_070, 3/3: gold opens business_checking with account_class
    "Sky Blue", and the agent opened "Hunter Green" (t0, t1) and "Cobalt Blue" (t2). Across
    22 KB queries in the three trials, NOT ONE asks for the list of business-checking
    classes — every query is built either from the customer's stated requirements ("no
    overdraft fees", "ATM fee rebates at least $15 per month") or from class names the agent
    already held ("Navy Blue Cobalt Blue True Blue", "Hunter Green Business Checking"). The
    option was never a candidate, so no care in choosing could have reached it. Same mode:
    task_065 3/3 (opened Blue/Bluest/Silver Plus against gold Green + Evergreen), task_096
    (three different expected_apy values — 2.95, 3.0, 2.7 — across three trials for one
    account whose rate the bank publishes; t1 got the OTHER account's pair 6.85/6.55 exactly
    right, which shows the mode is retrieval-dependent rather than arithmetic), and task_082
    t1 (dispute_category card_not_present_fraud against gold card_present_fraud; close reason
    "fraud_suspected" against gold "lost").
  prevalence: 4/8 tasks, 10/24 episodes
- description: >-
    Coverage failure, distinct from value failure: the agent does part of the requested work
    correctly and stops. task_096 t0 and t2 credit and report on the Bronze account and never
    touch the Gold Plus account the same customer named (t1 acted on both). task_065 t0 and
    t2 close the checking account and open ONE replacement where gold opens two. task_028 t2
