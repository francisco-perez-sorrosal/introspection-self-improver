counterevidence: >-
  Three arguments against this set.

  (1) E2 is the fifth transfer mutation this project has attempted and four of the previous
  four failed (prior-experiment context, prose only). The defence is that all four stated a
  condition for when transfer is appropriate and so competed with a frozen policy that already
  fixes one at four requests; E2 states no condition and names no threshold, addressing instead
  the agent's REASON for reaching for the tool. Whether that distinction is real is exactly
  what batch_04 tests, and the falsifier is the same one that caught seq 5: task_014's gold IS
  a transfer, so a fall below 1/3 there means E2 over-reached identically.

  (2) E1 generalises from a single trial. task_065 t2 is one cell. It is landed anyway because
  the causal chain is visible end to end in that transcript — right classes, close first, open
  refused for tenure, agent tells the customer to come back in two weeks — and because it is
  the only witness that could exist: no other trial in nine episodes ever got far enough to
  hit the constraint. A rule generalised from one cell is nonetheless a rule generalised from
  one cell, and its falsifier is deliberately broad.

  (3) The batch rose to 3/24 and the loop is being extended rather than consolidated. The rise
  is one episode above batch_01's 2/24, on a set now tuned on for two generations, at three
  trials per task; it is not outside what single-cell sampling can produce. The set does not
  claim the rise as evidence for itself — task_072's 0/3 to 2/3 is claimed, because it carries
  a mechanism visible in the transcript, and that is a different kind of claim.
hypothesis: >-
  Two hypotheses, one per change.

  Once the agent chooses the right objects to act on, the remaining failure is the ORDER in
  which it acts on them: a bank's state changes are not commutative, because closing an
  account can dissolve the tenure, balance or relationship that qualifies the customer for the
  one being opened. Naming that dependency should make the agent sequence the opens before the
  closes without needing to know which specific tenure rule applies.

  Separately: the agent reaches for transfer when its own analysis fails to resolve, not when
  the policy says to. Four previous mutations tried to correct WHEN transfer is appropriate and
  each competed with a policy that already fixes that. Naming the reason instead — an
  unresolved discrepancy is not itself grounds — leaves the policy's conditions untouched while
  removing the motive that produces the behaviour.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — two paragraphs added.
  The frozen <policy> region is untouched and make check asserts it byte-for-byte (5733 chars);
  agents/agent.yaml, package.json, the lock and the partition are unchanged.

  Prompt-only, and the g=0 justification still binds: the seam probe at
  generation_000/seam_probe/ measured that a Pi-local extension-tool call reaches tau as an
  invalid tool call, so extension tools and sub-agents are unavailable and only the
  no-tool-call hooks remain. Neither mechanism here fits those hooks — both govern decisions
  taken before a call. E1 is the one mechanism in the experiment so far that WOULD suit a
  deterministic surface, since "did an earlier write invalidate a later one" is checkable
  rather than judged; that surface does not exist in this seam, and the fact is recorded rather
  than worked around.
proposed_change: >-
  An improvement SET of two changes, one commit each on branch gen-003/ordering-and-escalation,
  landed as one PR. E1 acts on the order of write calls; E2 governs the agent's reason for
  reaching for one specific tool. They do not interact.

  Deliberately not in this set, and this is a change of policy from the two previous
  generations: task_070 gets NO slot. Its D1 prediction has now been denied three times while
  its behaviour clause was confirmed twice — the agent enumerates, asks which offer is in force,
  retrieves Sky Blue's own specification, and still chooses Hunter Green. The live reading is
  that the gold answer is not derivable from what bm25 surfaces, and bm25 is a deliberate freeze
  rather than harness surface. A fourth rewording would be the loop repeating itself, which is
  the failure mode this experiment exists to detect. Also held: backlog T5 (the handover, still
  settling at 6/6 with a superfluous arguments payload) and T6 (computed amounts, which D1
  appears to have resolved on task_072 and which should be re-read on batch_04 before being
  targeted).
