counterevidence: >-
  Three arguments against this set.

  (1) The attribution of the transfer rise to E2 is mechanistic, not statistical. gen-003
  landed two changes and the rise could belong to E1, which lengthened episodes by reordering
  work, or to drift between rounds. The case for E2 is that the transferring episodes' own
  transcripts show the precondition-then-transfer shape E2's wording describes, and that E1
  touches only the order of write calls. The falsifier is explicit and symmetric: if batch_05
  stays at or above 15/24 after E2 is gone, E2 was not the cause and the whole gen-003 set
  becomes a revert candidate.

  (2) Reverting after one round discards a change that might have needed two. Against that:
  the move was 50 percent in the wrong direction on the single most prevalent failure mode in
  the batch, and the experiment has five rounds of evidence that instructions of this shape do
  not converge with repetition — they acquire new failure modes. Leaving it in place for a
  second round would spend a generation to learn that again.

  (3) A one-change set forgoes the composite hypothesis this experiment exists to test. It is
  chosen because the set-composition rule forbids two changes acting on one behaviour, and
  every remaining live mode in batch_04 — the technical_system_error reads on task_028,
  task_072's two lost trials, task_096's three transfers — is transfer-adjacent. Padding the
  set would have made the revert unmeasurable. Recorded so the closure can weigh a deliberate
  single-change generation against the D22 design.
hypothesis: >-
  E2 caused the escalation rise it was written to prevent, by describing a sequence rather than
  removing a motive. Remove it and transfers should return to the level batch_03 measured under
  gen-002's harness, which is the only harness state that has ever reduced them. Everything else
  gen-003 landed — the ordering rule that produced task_065's first pass — stays.
owning_layer: >-
  Target-agent harness, <instructions> block of target-agent/SYSTEM.md — one paragraph removed,
  restoring the block to its gen-003 E1 state. The frozen <policy> region is untouched and make
  check asserts it byte-for-byte (5733 chars); agents/agent.yaml, package.json, the lock and the
  partition are unchanged.

  Prompt-only, and the g=0 seam-probe justification still binds (extension tools and sub-agents
  reach tau as invalid tool calls; only the no-tool-call hooks remain, and none of them can
  intervene on a decision taken before a call). Worth recording at the halfway point: of the
  eight changes this experiment has landed, the three that CONFIRMED told the agent what to
  retrieve or in what order to act (D1, E1, C3), and the three that failed told it what not to
  do or offered it an alternative (C1's enumeration was inert, C2's escape clause and E2 both
  produced the behaviour they named). That asymmetry is a property of the surface, and it is the
  strongest guidance available for the remaining slots.
proposed_change: >-
  An improvement SET of ONE change on branch gen-004/revert-escalation: the revert of gen-003's
  E2, which plan D22 makes a first-class change. The set is one change deliberately and the
  reason is recorded in counterevidence (3): every other live failure mode in batch_04 acts on
  the same behaviour the revert is measuring, and the set-composition rule forbids that.

  Deliberately not in this set: the technical_system_error reading of empty tool results
  (task_028 3/3, task_096 t2) — transfer-adjacent; task_026's write-count regression to 27 —
  entangled with the same episode's transfer; task_065 t0/t1's class choice — T1, retired as a
  target for task_070 but live here, and the natural candidate for gen-005 once this revert has
  been measured.
