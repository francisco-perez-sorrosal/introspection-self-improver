- description: >-
    F1's preflight was CHANCE, and this is the more transferable half. It showed
    update_transaction_rewards_3847 unlocked 3/3 against a 0/12 baseline — for a change that
    could not have caused it, since the change never executed. A three-trial local run
    displayed a perfect result on a behaviour whose observed rate is near zero. This is the
    anchor-calibration lesson recurring one level up: that probe measured that single-trial
    history mis-picks an anchor about a third of the time, and here a three-trial preflight
    manufactured a clean confirmation out of noise. A preflight verifies that a change RUNS,
