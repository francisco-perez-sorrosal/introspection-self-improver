counterevidence: >-
  Two arguments against this set.

  (1) Not landing the repair forfeits the only untried mechanism against the two tasks whose
  movement the primary endpoint test most needs. With three tasks moved and five at zero
  delta, the exact paired sign-flip test cannot reach alpha 0.05 — five non-zero deltas are
  required (1/32) and four give 1/16. So declining to gamble on F1's repair is, in effect,
  accepting that the pre-registered primary will not reach significance. That is recorded
  explicitly and it is still the right call: optimising the endpoint statistic with a change
  whose own preflight was chance, and whose predicted side effect the frozen policy names as
  harmful, is exactly the failure a prior closure named when it refused to spend its last slot
  speculatively. The instrument reports what the loop did; it is not a target.

  (2) H5's held-out round re-measures a harness identical to H4's and H3's, and could be seen
  as 84 wasted episodes. It is spent deliberately: an exact behavioural repeat on the same 28
  tasks measures round-to-round noise directly, which is worth having beside a curve at reveal
  and which no other round of this experiment can supply.
hypothesis: >-
  No behavioural hypothesis is under test this generation. The finding is procedural: a change
  that cannot be shown to have executed cannot be credited with any behaviour attributed to it,
  and the loop had the evidence to know that before spending the slot.
owning_layer: >-
  Harness, `revert`. The recipe returns to two hooks and one instruction paragraph — D2
  (context, transfer-reason lookup state), E1 (tool_result, verification-on-record), C2's
  clause in `SYSTEM.md`.
proposed_change: >-
  One change: remove the inert extension. Recorded as `accepted` rather than `identity` because
  the recipe genuinely moved — the file is gone and the tag differs — even though H5 is
  behaviourally identical to H4. Calling it an identity would misdescribe the artifact lineage
  the cadence gates resolve by tag.
