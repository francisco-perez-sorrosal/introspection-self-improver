- mechanism: >-
    Hand a user-discoverable tool over by its exact name rather than as a pre-filled
    machine payload, so the name the user must call reaches the user.
  surface: instructions
  evidence: >-
    Backlog T2. 6/6 of the episodes that use the tool, 2/8 tasks. Causal chain end to end
