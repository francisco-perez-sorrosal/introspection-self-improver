  summary: >-
    Round health first. batch_01 is the H0 baseline round on the platform lane: 24/24
    episodes completed, evidence_complete and arm_sha_ok on every manifest row against arm
    5b6c368, all four sandbox seam counters zero, zero stall warnings, zero 409s, zero
    prompt failures, and pi_local_calls 0 across the round — consistent with H0's empty
    `tools:` registry, so D24 suppression correctly never engaged. 89 stream_reattaches,
    the documented benign class. Platform spend $0.3869. Graded read from
    generation_000/batch_01/graded/updated_results.json: 10/24 episodes, 3/8 tasks, mean
    reward 0.4167.

    Read in FULL rather than by tail, and the depth was decided by the evidence rather than
    by budget: the decisive facts in this round are (a) which tool names appeared inside
    KB_search RESULT text, which no summary carries, and (b) the exact spelling of tool
    arguments, which is where the near-misses live. Both required the raw trajectories.
    The Introspection observation harvest was not used — the round completed inside the
    ~40-minute eligibility window and the full-population transcript read is the stronger
    evidence tier at B=8 x 3 anyway (24 episodes is a census, not a sample).

    TWO READING CORRECTIONS were established before any prevalence was computed, and both
    change what the graded artifacts mean. First, `call_discoverable_*_tool` payloads are
    compared as JSON STRINGS on this domain, so gold's {"user_id": "x"} and the agent's
    {"user_id":"x"} register as a MISS while being the identical call: of 85 gold-action
    misses in this round, 39 are formatting-only and 46 genuinely absent. Every prevalence
    below is computed against a whitespace-normalized comparison, never the raw miss list.
    Second, seq 6's founding structural constraint — "an extension-tool call reaches tau as
    an invalid call, so two of three growth surfaces were never available" — is OBSOLETE
    under D24; extension tools, sub-agents and the no-tool-call hooks are all live, and a
    declared skill remains measurably inert.

    Stratified-batch caveat, new in seq 8: the eight tasks span measured strata, so a mode
    seen only on headroom tasks has never been seen on a task this harness can pass, and
    the anchor cells (task_006, task_032, both 3/3 here, matching their pre-freeze
    calibration exactly) are the regression channel every falsifier must name.
