    The clause-3 falsifier watches exactly this.
  clauses:
  - clause: >-
      call give_discoverable_user_tool with the tool name
      alone
    adversarial_reading: >-
      "alone" is read as scoping the sentence ("just call it, nothing else needed") rather
      than the argument list, and the pre-filled `arguments` payload survives untouched.
    falsifier: >-
      Any give_discoverable_user_tool call in batch_02 carrying an `arguments` key. The
      batch_01 value is 6/6 episodes.
  - clause: >-
      and give the user that exact tool name
    adversarial_reading: >-
      The name is satisfied by being printed in prose to the user while the grant call
      itself is skipped — the model optimises the visible half of the conjunction.
    falsifier: >-
      An episode in batch_02 where the exact tool name appears in an assistant message but
      give_discoverable_user_tool was not called on that task.
  - clause: >-
      When you hand a tool to the user,
    adversarial_reading: >-
      The precondition is treated as avoidable: the model hands tools over LESS often so
      the rule does not apply. This is seq 6's E2 failure mode, where an instruction
      targeting a motive moved the rate the wrong way. The text was deliberately phrased as
      a rule about HOW rather than about WHEN for this reason, so the clause cannot suppress
      the behaviour, only reshape it — but the reading is still available and is watched.
    falsifier: >-
      give_discoverable_user_tool episode count across task_026 + task_057 drops below
      batch_01's 6/6 episodes.
