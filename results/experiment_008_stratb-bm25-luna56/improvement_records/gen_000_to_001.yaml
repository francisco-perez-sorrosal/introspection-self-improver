counterevidence: >-
  Three arguments against this set, recorded so they can be judged rather than assumed.

  (1) The best-evidenced mode in the round is NOT the one this set targets. Transfer
  discrimination is wrong in 7/24 episodes against T1's 6/24, and it is wrong in both
  directions at once — the sharpest single finding of the batch. It is deliberately left
  unconsumed. Six mutations across seq 4, 5 and 6 moved the transfer RATE (9 -> 11 -> 10 ->
  15 -> 6 -> 12 -> 9 per 24) and not one moved DISCRIMINATION; seq 6's own independent
  review calls that "a controlled demonstration that this surface cannot express the needed
  distinction", and seq 6's T4 recorded the condition for a seventh attempt — a mechanism
  that is procedural and counted rather than a judgment about when transfer is appropriate.
  That condition is unmet by anything this round's evidence suggests, and a prose sentence
  would additionally put the task_032 anchor at risk, which is exactly what anchors were
  frozen in to detect. This is a severity-over-prevalence override in reverse: the
  best-evidenced target is skipped on the strength of six prior failures, and the override
  is recorded here so a later reader can judge the choice rather than discover it.

  (2) C1's evidence lives entirely on headroom tasks. task_026 and task_096 are 0/31 and
  0/31 lifetime; NO episode of either has ever passed under any harness this project has
  built. So C1's mechanism is confirmed as a behaviour gap but has never been shown to be
  the BINDING constraint on a pass — fixing it may simply expose the next layer, exactly as
  seq 6's task_065 did across three generations. The prediction is written on the behaviour
  counter rather than on reward for that reason, and a behaviour-confirmed / outcome-denied
  result is an anticipated outcome, not a surprise.

  (3) C2's causal claim is partial. The payload-bearing grant coincides with failure on
  task_057 and with success on task_026's user-call half, so the payload alone does not
  determine whether the user calls correctly; the honest reading is that the exact name
  must reach the user, and repetition achieved that on task_026 by accident. If batch_02
  shows grants without payloads and task_057 still failing, C2's mechanism is real but not
  binding, and T5 (verification without remediation) becomes the live successor.
hypothesis: >-
  The harness reads retrieval output as prose to summarise rather than as a procedure to
  execute, and it hands work to the user as description rather than as a named tool. Both
  are failures of USING what was retrieved, not of retrieving it — the knowledge base
  supplied the tool name in 6/6 episodes of T1 and the policy supplied the handover rule in
  full for T2. If the tool names a KB_search returned are made impossible to skim past, and
  the handover carries the exact tool name instead of a pre-filled payload, then the
  prescribed remediation gets performed and the user's own call matches gold.
owning_layer: >-
  Harness, two surfaces, deliberately not the same one. C1 lands on `extension-hook`
  (tool_result) — the first structural mutation in this project's history, taken because
  the frozen <policy> ALREADY instructs the agent to search the knowledge base for tools it
  can unlock and the agent DOES search, so a sentence would compete with the policy rather
  than add discipline it lacks. C2 lands on `instructions`, where it is a rule about the
  SHAPE of one call rather than a judgment about when to act.
proposed_change: >-
  One improvement set of two changes (plan D22). They compose because they act on different
  steps, different tools, and disjoint counters: C1 changes what the model reads back from
  KB_search (agent-side discovery), C2 changes how the agent writes one call to hand a tool
  to the user. They co-occur on task_026 and nowhere else, and even there at different
  points of the episode. Each would justify landing on its own: C1 on 6/24 episodes with a
  measured counterfactual, C2 on 6/6 of the episodes that use the tool with an end-to-end
  causal chain on task_057. Neither is a revert; no prior seq-8 change exists to revert.
schema_version: 3
changes:
- mechanism: >-
    Re-state, at the end of every KB_search result the model reads, the discoverable-tool
    names that result already contained — deduplicated, capped at 12, matched by naming
    convention (lowercase snake_case with a four-digit suffix, `doc_` excluded). It adds no
    instruction, no judgement and no alternative: it changes where the information sits,
    not what the agent is told to do with it. Deliberately free of any imperative, so it
    has no escape clause to optimise against — the seq-6 lesson applied by construction
    rather than by wording care.
  surface: extension-hook
  evidence: >-
    Backlog T1. 6/24 episodes, 2/8 tasks, 6/6 with the gold tool name measured present in
    returned KB text: task_026 01a00d65-a075-7641-9375-d565495fe56c,
    01a00d69-8b05-70c4-b241-30ecbbb52069, 01a00d6f-75e7-7318-9a50-ea292b00ed6f; task_096
    01a00d68-0144-7152-b3ac-d57f51a49de9, 01a00d6d-18b2-70ef-a8d0-fdf7ad04fca5,
    01a00d72-774e-7340-8f8f-347ffeca5939. Surface legality measured at g=0 by the step-4b
    probe committed at generation_000/toolresult_probe/ (56 firings across every tau tool;
    the patch reaches the model 24/24; 0 occurrences in tau's graded trajectory; 0 tool
    errors).
  expected_effect: >-
    Counter-native, scored against batch_02: unlock_discoverable_agent_tool calls naming
    the gold remediation tool (update_transaction_rewards_3847 on task_026;
    apply_savings_account_credit_6831 or submit_interest_discrepancy_report_7294 on
    task_096) appear in at least 2/3 trials on at least one of the two tasks — the batch_01
    value is 0/6 episodes. Secondarily the lock-named `discoverable` process counter rises
    on those two tasks. Reward movement is NOT predicted: both tasks are 0/31 lifetime and
    a behaviour-confirmed / outcome-denied result is the anticipated case.
  risk: >-
    Indiscriminate unlocking. The appended list names every convention-matching token in
    the result, including tools that do not apply, and the frozen policy warns twice that
    unlocking tools you do not plan to use "causes issues in database logging" — so the
    change could convert a coverage failure into a spurious-write failure. Second risk: the
    appended text lengthens every KB_search result on every task, including the anchors and
    the passing marginal, so a regression there would be collateral from a change that was
    never meant to reach them.
