counterevidence: >-
  Two arguments against this set, and one against its size.

  (1) E1's prevalence is 2 episodes in 72 — the thinnest evidence any change in this
  experiment has been landed on. The counter is that the chain is airtight rather than
  statistical: two failing trials, call-for-call identical to three passing ones except for a
  duplicated write, on a DB-graded task where a duplicate row is a state difference. Landing it
  is a bet that a mechanical defect with a known mechanism beats a statistical mode with an
  unknown one; the falsifier (task_076 stays 2/3 with a single call) settles it in one round.

  (2) E1 is a factual state note, and D2 has just demonstrated in this very round that a
  factual state note can be read as a gate — its transfer rate fell 9/24 -> 6/24 where no
  suppression was requested. The same risk applies here in the direction that matters:
  "verification is now on record" could be read as "verification is handled, do not log", and
  a task needing a genuine second verification would break. No such task is in the batch, which
  bounds the observable risk but does not eliminate it on the held-out set. Falsifier (a)
  watches exactly this.

  (3) The set has ONE change where five slots remain and three tasks are stuck at 0/9. That is
  deliberate. Every additional candidate on the table is either re-treading a surface already
  denied here (C1's salience), re-landing a prior experiment's prose, or targeting a mode
  already shown to be bounded by the frozen surfaces (the credit_type enum, retired last
  round). Landing a weakly-evidenced change to fill a slot is the failure a prior closure
  named explicitly when it refused to spend its final slot on a speculative change. A
  one-change set with a recorded reason is the honest alternative.
hypothesis: >-
  The harness repeats a write it has already made because nothing in what it reads marks the
  write as done. Making the completion legible at the moment it happens removes the ambiguity
  the repetition depends on, without forbidding anything.
owning_layer: >-
  Harness, `extension-hook` (`tool_result`). The recipe now carries two hooks and one
  instruction paragraph; no instructions change lands this generation.
proposed_change: >-
  One change (plan D22 bounds set size by evidence and non-interaction, never by a number).
  D2 is explicitly KEPT rather than reverted, and the distinction from gen-002's treatment of
  C1 is the rule this experiment is now applying: C1's mechanism was denied everywhere AND its
  evidence base was misattributed; D2's mechanism is confirmed on the one task where it can
  fire, and only its predicted task is structurally unreachable. A denied prediction is not by
  itself a revert trigger — a denied MECHANISM is.
