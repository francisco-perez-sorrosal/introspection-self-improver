- description: >-
    The framing sequence is now four points and it is the experiment's most transferable
    output. A bare LIST of facts changed nothing (C1, reverted after its counter moved
    nowhere). A MISSING-state note changed behaviour AND suppressed unasked (D2: transfer-reason
