signals:
- description: >-
    MEASURED ROUND-TO-ROUND NOISE ON AN IDENTICAL HARNESS: 2 cells, 8.3 pp, from two tasks each
    moving one cell. This is the single most important number the experiment produced about
    its own instrument, and it is a direct measurement rather than an estimate — no prior
    experiment in this project has had a behavioural-identity round to measure it with. Every
    per-change attribution must be read against it: a single-cell movement on a marginal or
    headroom task is noise, and the attributions that survive are the ones carrying a mechanism
    and a counter (C2's clause 2 on task_057's user-call name, D2's transfer-reason query rate,
    E1's duplicate-write count), never the ones resting on a cell.
  prevalence: 2/24 cells moved with no harness change
- description: >-
    The anchors have now held 3/3 for six consecutive rounds — 18/18 each on task_006 and
    task_032, 36 episodes with no regression. That is the stratified batch delivering its
    designed function: the regression channel stayed silent through eleven landed changes
    across six generations, so every movement elsewhere is attributable rather than ambient.
    Seq 5 and seq 6 had no such channel by construction.
  prevalence: 36/36 anchor episodes passed across six rounds
