    surface, and the fixed batch measured each one.
  prevalence: 4 injection shapes, 3 measured, 1 landed this generation
counterevidence: >-
  Three arguments against this set, and the third is the strongest.

  (1) The evidence is 3 episodes in 144. That is thinner than anything else landed this
  experiment except E1 itself, and it is a one-line text change to a hook that already exists.

  (2) The measured noise is 2 cells and the predicted effect is at most 1. The batch curve
  CANNOT distinguish this change from noise, and the record says so rather than letting a
  batch_07 number be read as evidence either way. Its prediction is written on the
  duplicate-write counter for that reason, not on reward.

  (3) It lands immediately before batch_07, the endpoint round of the pre-registered primary.
  Changing the harness right before the endpoint measurement is exactly the shape of decision
  that deserves suspicion, and the honest defence is not that the risk is zero but that the
  risk is BOUNDED BY CONSTRUCTION: the note can only appear after a successful log, so it
  cannot suppress the first verification, only a redundant second. The alternative — an
  identity generation — would have been safer and would have asked nothing. With the batch's
  reachable portion saturated at 15/15 and its remaining headroom surface-exhausted, asking the
  framing question was the only remaining way to spend the slot on information rather than on
  the statistic.
hypothesis: >-
  A note that states only a completed state is read as background; a note that states what a
  further action would cause is read as decision-relevant. If that is right, naming the
  duplicate as a consequence prevents the second write where naming the state did not.
owning_layer: >-
  Harness, `extension-hook` (`tool_result`) — one line of injected text. The final recipe
  carries two hooks (D2 on `context`, E1/H1 on `tool_result`) and one instruction clause (C2)
  above the H0 baseline.
proposed_change: >-
  One change, one line. It does not interact with D2 (which fires only on a handoff request
  with no reason lookup) and it is a text refinement of E1's own note rather than a new
  mechanism, so the set is internally trivial by design — the last slot of a saturated batch
  is not the place for an ambitious composite.
schema_version: 3
changes:
- mechanism: >-
    After a successful log_verification, state the consequence as well as the state: "Identity
    verification is on record for this conversation; logging it again would write a duplicate
    verification record." Still a fact with no imperative and no alternative.
  surface: extension-hook
  evidence: >-
    Backlog T6. task_057 t2 in batch_06 logged twice across SEPARATE turns and failed, so E1's
    note was delivered between the calls and ignored; three such episodes across six rounds,
    all failing (task_076 batch_02 and batch_03, task_057 batch_06).
  expected_effect: >-
    Counter-native, scored against batch_07: zero episodes call log_verification more than
    once. Reward movement is NOT predicted — the measured noise is 2 cells and this change's
    maximum effect is 1. Pre-merge verification (local, task_057 x3,
    generation_005/h1_preflight/): the injected text appears 3 times in the Pi sessions, once
    per episode, and every trial logged exactly once. That check is gen-005's standing rule
    applied, and it is possible here because a tool_result patch IS persisted to the session
    where a context injection is not.
  risk: >-
    The note read as a prohibition on verifying at all, which would break every task requiring
    account access. Bounded by construction — the note cannot appear before the first
    successful log — and watched by the falsifier: episodes calling log_verification zero times
    rising above the 9/24 that has held across six rounds.
