counterevidence: >-
  Three arguments against this set.

  (1) F1 targets ground C1 already failed on, and a loop that re-attacks a refuted target is
  the failure mode this project exists to detect. The distinction claimed — framing rather
  than surface — is supported by exactly one contrast (C1 denied, D2 confirmed) plus a
  three-episode local verification. It is a hypothesis with one witness and a preflight, not
  an established law, and batch_05 is its test. Recorded so the closure judges the reasoning
  rather than the outcome.

  (2) F1's own note reports a MISSING state, which is the shape that suppressed transfers when
  D2 did it (9/24 -> 6/24 where no suppression was requested). E1's completed-state note did
  not suppress. F1 is therefore the riskier of the two shapes by this round's own evidence,
  and falsifier (c) watches total agent calls per episode for exactly that.

  (3) task_026 remains 0/12 on REWARD even though its behaviour counter moved in preflight.
  Unlocking and calling the tool is necessary and plainly not sufficient — which transactions
  and which values are the next layer, untouched. The honest expectation for batch_05 is
  behaviour-confirmed / outcome-denied, and it is stated in advance so a null reward cannot be
  read afterwards as a surprise.
hypothesis: >-
  The agent does not act on a prescribed step because nothing it reads marks the step as
  outstanding. Salience alone is insufficient — C1 measured that. What changes behaviour is a
  statement of what remains undone, which D2 measured. Applying that framing to the tool
  discovery step should make the agent unlock and use the tool the knowledge base names.
owning_layer: >-
  Harness, `extension-hook` (`context`). The recipe carries three hooks and one instruction
  paragraph; no instructions change lands this generation either.
proposed_change: >-
  One change. It does not interact with the two live hooks: D2 fires only when a handoff has
  been requested and no reason lookup issued, E1 only on a successful log_verification result,
  F1 only when a KB-named tool remains unclaimed. Disjoint triggers, disjoint counters,
  disjoint falsifiers.
