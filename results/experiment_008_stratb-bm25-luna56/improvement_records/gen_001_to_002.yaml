changes:
- mechanism: >-
    Revert C1, the tool_result hook that re-stated discoverable-tool names at the end of
    KB_search results. Its prediction was denied on its own counter and half its cited
    evidence was a value-resolution mode that name salience cannot address.
  surface: revert
  evidence: >-
    Backlog T1 and the erratum above. C1 measured live in vivo
    (01a00daa-1ca8-74c5-a631-8d413e18e5d6 carries 8 occurrences of its output) with zero
    movement on its counter: task_026 0/3 -> 0/3, task_096 2/3 -> 2/3.
  expected_effect: >-
    None on the behaviour C1 targeted — the counter was already unmoved, so removing the hook
    should leave task_026 and task_096 exactly where they are. The change exists to buy
    attribution: if task_057 holds at >= 2/3 in batch_03 with C1 gone, C2 owns last round's
    win; if it collapses to <= 1/3, C1 owned it and the revert is itself refuted.
  risk: >-
    C1 may have been silently carrying task_057's flip, in which case this revert costs the
    experiment its only confirmed win and buys the attribution with a real regression. That
    trade is taken deliberately: an unattributed win on a fixed batch cannot be built on,
    and five slots remain to re-land the hook if the evidence says so.
  clauses: []
  commit: 64c1a01
- mechanism: >-
    When the customer has asked to be handed to a human and no knowledge-base query about
    transfer reason codes has been issued in this conversation, a `context` hook appends one
    factual line saying exactly that. It reports a procedural state and gives no instruction —
    not whether to transfer, not which reason to choose, not what to search.
  surface: extension-hook
  evidence: >-
    Backlog T3. 6 of 18 transfer-carrying episodes across batch_01 and batch_02 issued the
    lookup the transfer tool's own description prescribes. On task_014 every pass issued it
    (batch_01 t1; batch_02 t0, 01a00dad-d450-7657-8944-5e4d3a5551df) and the trial that
    transferred without it chose a legal-but-wrong enum member
    (01a00dae-d8bc-750a-a61b-edef3495c521). Surface legality measured at this generation's
    step-4b probe (generation_001/context_probe/): fires before every LLM call, sees the full
    conversation, an appended message changed model output in 3/3 episodes, and the injection
    itself appears 0 times in tau's graded trajectory.
  expected_effect: >-
    Counter-native, scored against batch_03: KB queries matching the transfer-reason pattern
    rise to >= 2/3 of task_014's trials (batch_01 1/3, batch_02 1/3), and task_014's reward
    reaches >= 2/3 (1/3 in both prior rounds). Pre-merge behavioural verification on the real
    domain (local lane, task_014 x3, generation_001/d2_preflight/) showed 3/3 trials issuing
    the query and 2/3 passing with the gold reason — verification, not measurement.
  risk: >-
    That it moves transfer RATE rather than DISCRIMINATION, the exact failure of all six
    prior transfer mutations. Watched by two falsifiers: transfer-carrying episodes rising
    above batch_02's 9/24, and any movement on task_032, whose gold transfer carries
    compare_args: [] so its reason is uncompared and it should not move at all. A third risk
    surfaced in pre-merge verification: one trial called transfer_to_human_agents four times
    in one episode, so repeated-call count is watched too.
  clauses: []
  commit: c18788c
