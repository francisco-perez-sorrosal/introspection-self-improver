  prevalence: 1/8
counterevidence: >-
  Two findings argue against over-reading the T1 signal, and both are recorded rather
  than set aside. (1) Search VOLUME does not discriminate: the single passing episode
  (task_023, 01a0038e-da8b) used 5 KB searches while failures ranged from 2 to 12, so
  "search harder" is not supported by this batch and the hypothesis had to be narrowed to
  a stopping condition rather than search effort. (2) A large share of the apparent
  evidence is a grading artifact, not behaviour: tau's Action.compare_with_tool_call
  compares argument dicts, but call_discoverable_agent_tool and call_discoverable_user_tool
  carry their payload as a NESTED JSON STRING, so that field is compared by string
  equality — the agent emits compact JSON and gold carries spaces. 14 of the 43
  action-check misses in this batch (33%) are semantically identical calls differing only
  in whitespace. This costs no reward, because every batch_01 task is reward_basis ['DB'],
  but a naive read of action_checks would have produced a "fails to call discoverable
  tools" failure mode that does not exist. It is frozen evaluator surface and is
  deliberately NOT targeted: matching gold's JSON whitespace would be grader-gaming rather
  than capability.
hypothesis: >-
  H0's instructions contain nothing between "the value is still unconfirmed" and "commit
  the write", so when the knowledge base does not yield a needed rate, enum, amount or
  product class cleanly, the agent supplies a plausible one and proceeds. Adding an
  explicit pre-write grounding check with a stopping condition should convert those
  episodes into either a correct write or an honest stop.
owning_layer: >-
  The target agent's system prompt — target-agent/SYSTEM.md <instructions>. Retrieval
  USAGE (query formulation, iteration, stopping) is mutable harness surface; the bm25
  retrieval backend, the policy text and the model pair are frozen and untouched.
proposed_change: >-
  Nine added lines in target-agent/SYSTEM.md <instructions>, no deletions: before a
  state-changing tool call, check every argument value not read directly from a tool
  result or from the user — rates, percentages, fees, monetary amounts, values chosen
  from a fixed set, and product/plan/tier names — against a specific knowledge-base
  passage retrieved in that conversation; on failure, re-search for that EXACT value
  rather than the general topic; if still unconfirmed, name the value and stop instead of
  writing a plausible one. The frozen <policy> region still matches benchmark_lock.yaml
  (5733 chars) and agents/agent.yaml is untouched, so the model pair stays frozen.
mutation:
  branch: gen-001/pre-write-value-grounding
  pr_url: https://github.com/francisco-perez-sorrosal/introspection-self-improver/pull/4
