  candidate_commit: 8168b08b43245ac7b133a23e780de194e3f8fdec
expected_effect: >-
  Episodes that already run the correct procedure but write unconfirmed values should
  either write correct values or stop and name what could not be confirmed. Measured on
  the held-out set at H1 and nowhere else — this freeze sets
  allow_within_batch_verification false, so re-running the consumed batch would be
  intervention verification rather than generalization. Stated risk, to be checked first
  in B2 if H1 moves sideways: the stopping clause could convert T1 failures into T2
  failures by declining where it previously guessed, and T2 already stands at 3/8.
