signals:
- description: >-
    Commits a state-changing write using a knowledge-base-derived value it never
    confirmed. task_096 (01a00390-566b) wrote expected_apy 3.0 where gold is 3.25 and 6.7
    where gold is 6.85, with credit amounts 11.25/7.5 against gold 17.50/15.00, after NINE
    KB searches that never resolved the APY boost. task_072 (01a0038f-c557) wrote
    credit_type "rebate_credit" where gold is "fee_refund" and amount 10.0 against gold
    3.50, after only TWO searches. task_055 (01a0038f-b771) opened the savings account as
    account_class "Green Account" where gold is "Silver Plus Account". In task_072 and
    task_096 the agent matched gold write-for-write in tool name and count and lost purely
    on values — the right procedure with the wrong numbers.
  prevalence: 3/8
- description: >-
    Bails to a human instead of completing an in-scope procedure. task_005
    (01a0038e-d3b1) made ZERO write calls: its first KB_search returned an unrelated
    rewards-representation doc, it then improvised a stricter identity rule than the
    policy requires and transferred. task_010 (01a0038e-d935) retrieved the CORRECT
