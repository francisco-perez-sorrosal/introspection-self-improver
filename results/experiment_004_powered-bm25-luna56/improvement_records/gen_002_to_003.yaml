signals:
- description: >-
    Prohibition misreading — the agent refuses a transfer the policy requires, BECAUSE
    something is unconfirmed. task_014 (01a003e9-9562) is the experiment's first
    reward_basis ['ACTION'] task and its gold action is the transfer itself. The user asked
    to "connect me with a human agent who can verify this promotion"; the agent answered "I'm
    sorry, but I can't transfer this request because the promotion remains unverified in
    Rho-Bank's referral documentation." Gold:
    transfer_to_human_agents(reason="unconfirmed_external_communication"). Gen-002's clause
    says an unconfirmed value "is never a reason to end the conversation, transfer to a
    human, or leave other required actions undone", and the agent read the middle phrase as
    a prohibition on transferring — the exact inverse of intent. It also contradicts the
    FROZEN policy, which requires helping or transferring when a user asks for a human: a
    harness instruction overriding the graded policy is a defect, not a trade-off. Backlog
    T7, consumed by this generation. Supporting but NOT decisive: transfers across B3 were
    0/8 episodes against 3 in B1 and 1 in B2 — disjoint batches make that suggestive only.
  prevalence: 1/8
- description: >-
    Unbounded re-search exhausts the step budget. task_064 (01a003ea-ae8d) hit max_steps
    after 28 DISTINCT knowledge-base searches across 201 messages at $0.20 — roughly six
    times any other episode in the batch, and the only max_steps termination in the
    experiment so far. Gen-001's surviving "search again for that exact value" clause carries
    no bound. Distinct from T4: this agent never refused, it never converged. Backlog T8 —
    approved, not consumed by this generation.
  prevalence: 1/8
- description: >-
    Never hands over the discoverable tool the procedure requires. task_028 (01a003e9-90df)
    and task_038 (01a003e9-94a2) join task_026 (B1) and task_020 (B2) — FOUR witnesses across
    THREE batches, three of them the same submit_cash_back_dispute_0589 tool. This is now the
    best-evidenced mode in the experiment and it remains unconsumed; it is ranked first for
    the two remaining slots. Backlog T6.
  prevalence: 2/8 this batch, 4 witnesses across 3 batches
counterevidence: >-
  Against the T7 diagnosis specifically: the zero-transfers-in-8 observation is NOT usable as
  evidence of a trend, because B1, B2 and B3 are disjoint task sets and may simply differ in
  how many of their scenarios warrant a transfer at all. Stripped of that, T7 rests on a
  single episode — 1/8, the weakest prevalence of any target consumed so far. It is taken
  ahead of better-evidenced targets (T6 has four witnesses) on SEVERITY rather than
  prevalence, and specifically because the instruction contradicts the frozen policy and
  would otherwise ride along in H3, H4 and H5. That reasoning is recorded so the choice can
  be judged rather than assumed. Against the wider loop: no causal claim is available that
  gen-002 lowered the held-out score — those numbers are sealed — so "gen-002 caused a
  regression" is a statement about the instruction's semantics and one graded episode, not
  about the progression metric.
hypothesis: >-
  Gen-002 tried to say "unconfirmedness does not justify giving up" and expressed it as a list
  of things that are "never a reason", one of which named a tool. Read as a rule about tools
  rather than about values, that sentence forbids a policy-required action. Separating the two
  — this constrains which VALUES you write, never which TOOLS you may use — should keep the
  anti-abandonment intent while removing the prohibition reading.
owning_layer: >-
  The target agent's system prompt — target-agent/SYSTEM.md <instructions>, specifically the
  paragraph gen-002 added. Frozen policy text, bm25 retrieval and the model pair untouched.
proposed_change: >-
  target-agent/SYSTEM.md <instructions>, +5/-4. States that the paragraph limits which values
  are written and never which tools may be used; keeps the anti-abandonment intent as "does
  not by itself justify abandoning the rest of the request"; and names the transfer case
  positively — where the policy or the user calls for a transfer, transfer exactly as the
  policy says, whether or not anything is still unconfirmed.
