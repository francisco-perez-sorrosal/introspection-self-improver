counterevidence: >-
  The experiment's FIRST POSITIVE EVIDENCE lands in this batch and belongs here because it
  cuts against the pessimistic reading of the loop: task_032 (01a003fa-60ca) is a
  reward_basis ['ACTION'] task requiring a transfer, and it PASSED with one
  transfer_to_human_agents call — gen-003 repaired the prohibition misreading it was written
  for. It is one episode on a different task from the one that motivated the fix, so it
  evidences the mechanism, never a gain in score. Cutting the other way, and recorded with
  equal weight: two mutations demonstrably did NOT do their job (task_070's total
  abandonment; T1's return in task_065), so this loop has produced at least one working
  repair, at least one persisting defect, and one regression it introduced and then fixed.
  Finally, an assumption made during diagnosis was WRONG and is corrected rather than
  quietly dropped: B2's task_069 and B4's task_065 were initially read as one scenario under
  two instruction regimes; they are different tasks that share customer rp65a7b3c4. The
  comparison survives the correction — strict stop refused, loosened stop acted and chose
  wrong — but it is weaker evidence than a true paired scenario would have been, and is
  reported as such.
hypothesis: >-
  The handover fails in two ways with one root: the agent treats give_discoverable_user_tool
  as something to describe rather than perform, and when it does perform it, it packs the
  user's arguments into the call because that is what "giving the user a tool to run" seems to
  require. Stating that the handover is a step that must actually happen, and that the call
  carries the tool NAME alone with arguments going to the user in prose, should fix both.
owning_layer: >-
  The target agent's system prompt — target-agent/SYSTEM.md <instructions>. It operationalizes
  what the FROZEN policy already requires (use the function with the exact name; "just
  explaining isn't enough"), and so reinforces the graded policy rather than competing with
  it — the failure mode gen-002 fell into.
proposed_change: >-
  target-agent/SYSTEM.md <instructions>, +5/-0. Handing the tool over is a step that must
  actually be taken and is not replaced by describing it; the call carries the exact tool name
  from the knowledge base and nothing else; the arguments the user needs go in the message to
  them, never inside the call. Deliberately silent on unlock_discoverable_agent_tool, which
  has matched correctly throughout — widening the rule there would add risk with no evidence.
mutation:
  branch: gen-004/hand-over-tools-by-name
  pr_url: https://github.com/francisco-perez-sorrosal/introspection-self-improver/pull/7
  source_commit: b6300372bdbabdb249fc3b44712f4f46c629c710
  candidate_commit: null
expected_effect: >-
  Episodes whose procedure requires the user to act should produce a matching
  give_discoverable_user_tool call carrying the tool name alone, so the user-side
  call_discoverable_user_tool can follow. Measured on the held-out set at H4 and nowhere else.
  Risk, stated: an instruction to "actually hand it over" could produce handovers in episodes
  that do not call for one, which would be an unrequested-action failure of the T5 family
  (1/8, task_046) rather than the omission this fixes. The instruction is conditioned on "when
  the knowledge base says the user performs an action themselves" precisely to bound that.
